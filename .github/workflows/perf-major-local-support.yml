name: Per-source support candidate parked

on:
  pull_request:
    branches:
      - perf/major-2x-specializations
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: major-local-support-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  parked:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Candidate retained; single-frame matrix PR #15 owns the active measurement."
