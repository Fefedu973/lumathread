name: Publish final consolidated renderer result

on:
  workflow_run:
    workflows:
      - Final exact renderer consolidation
    types:
      - completed

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: github.event.workflow_run.head_branch == 'perf/major-2x-final-consolidated'
    runs-on: ubuntu-latest

    steps:
      - name: Check out result branch
        uses: actions/checkout@v4
        with:
          ref: perf/major-2x-final-consolidated
          fetch-depth: 0

      - name: Download exact run artifact
        uses: actions/download-artifact@v4
        with:
          pattern: final-consolidated-*
          path: /tmp/final-consolidated
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Materialize stable result files
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          rm -rf perf/latest-consolidated
          mkdir -p perf/latest-consolidated
          find /tmp/final-consolidated -type f \
            \( -name 'benchmark.json' \
            -o -name 'benchmark.md' \
            -o -name 'consolidated-target.json' \
            -o -name 'consolidated-target.md' \
            -o -name 'visual-diff.json' \
            -o -name 'visual-diff.md' \
            -o -name 'consolidated-renderer.patch' \
            -o -name 'materialized-stack.txt' \) \
            -exec cp '{}' perf/latest-consolidated/ \;
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path('perf/latest-consolidated/run.json').write_text(
              json.dumps(
                  {
                      'runId': int(os.environ['RUN_ID']),
                      'runUrl': os.environ['RUN_URL'],
                      'headSha': os.environ['RUN_SHA'],
                      'conclusion': os.environ['RUN_CONCLUSION'],
                  },
                  indent=2,
              ) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Commit stable result snapshot
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add perf/latest-consolidated
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'perf: publish consolidated renderer result [skip ci]'
          git push origin HEAD:perf/major-2x-final-consolidated
