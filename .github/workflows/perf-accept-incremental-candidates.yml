name: Accept incremental renderer candidates

on:
  push:
    branches:
      - perf/visual-parity-renderer-optimization
    paths:
      - src/**

permissions:
  contents: write

concurrency:
  group: accept-incremental-renderer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    if: contains(github.event.head_commit.message, 'integrate validated')
    name: incremental candidate (${{ matrix.experiment }})
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        experiment:
          - persistent-framebuffers
          - specialized-viewport
          - path-attribute-state-cache

    steps:
      - name: Check out accepted renderer baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Check out identical baseline tree
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: baseline

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          cd baseline
          bun install --frozen-lockfile

      - name: Apply one exact incremental candidate
        id: apply
        shell: bash
        run: |
          set +e
          case "${{ matrix.experiment }}" in
            persistent-framebuffers)
              node perf/scripts/apply-persistent-glass-framebuffers-experiment.mjs
              status=$?
              ;;
            specialized-viewport)
              node perf/scripts/apply-renderer-experiment.mjs specialized-viewport
              status=$?
              ;;
            path-attribute-state-cache)
              node perf/scripts/apply-path-attribute-state-cache-experiment.mjs
              status=$?
              if [ "$status" -eq 0 ]; then
                python - <<'PY'
                from pathlib import Path
                path = Path("src/runtime/path-renderer.ts")
                source = path.read_text()
                source = source.replace(
                    """    return (\n      current?.buffer === next.buffer &&""",
                    """    if (!current) return false;\n    return (\n      current.buffer === next.buffer &&""",
                )
                path.write_text(source)
                PY
              fi
              ;;
          esac
          set -e

          if [ "$status" -ne 0 ]; then
            echo "applied=false" >> "$GITHUB_OUTPUT"
            echo "Candidate is already integrated or incompatible with the current accepted source."
            exit 0
          fi

          echo "applied=true" >> "$GITHUB_OUTPUT"
          bunx biome format --write src

      - name: Validate candidate
        if: steps.apply.outputs.applied == 'true'
        run: |
          bun run check
          bun run build
          bunx tsc -p tsconfig.perf.json --noEmit

      - name: Build baseline and candidate harnesses
        if: steps.apply.outputs.applied == 'true'
        run: |
          bunx vite build \
            --config vite.perf.config.ts \
            --outDir "$GITHUB_WORKSPACE/perf-dist-candidate"
          cd baseline
          bunx tsc -p tsconfig.perf.json --noEmit
          bunx vite build \
            --config vite.perf.config.ts \
            --outDir "$GITHUB_WORKSPACE/perf-dist-baseline"

      - name: Install visual diff dependencies
        if: steps.apply.outputs.applied == 'true'
        run: python -m pip install --disable-pip-version-check pillow numpy scikit-image

      - name: Start deterministic static servers
        if: steps.apply.outputs.applied == 'true'
        run: |
          python -m http.server 4173 \
            --bind 127.0.0.1 \
            --directory perf-dist-baseline > /tmp/lumathread-baseline-server.log 2>&1 &
          echo $! > /tmp/lumathread-baseline-server.pid
          python -m http.server 4174 \
            --bind 127.0.0.1 \
            --directory perf-dist-candidate > /tmp/lumathread-candidate-server.log 2>&1 &
          echo $! > /tmp/lumathread-candidate-server.pid
          for port in 4173 4174; do
            for attempt in $(seq 1 50); do
              if curl --fail --silent "http://127.0.0.1:${port}/" >/dev/null; then
                break
              fi
              sleep 0.1
            done
            curl --fail --silent "http://127.0.0.1:${port}/" >/dev/null
          done

      - name: Run paired incremental benchmark
        if: steps.apply.outputs.applied == 'true'
        run: |
          bun perf/scripts/benchmark.mjs \
            --baseline http://127.0.0.1:4173 \
            --candidate http://127.0.0.1:4174 \
            --out perf-results \
            --repeats 5 \
            --frames 30 \
            --warmup-frames 18 \
            --profile-frames 8

      - name: Check visual parity
        if: steps.apply.outputs.applied == 'true'
        shell: bash
        run: |
          if python perf/scripts/visual-diff.py \
            --baseline perf-results/screenshots/baseline \
            --candidate perf-results/screenshots/candidate \
            --out perf-results/visual; then
            touch perf-results/VISUAL_ACCEPTED
          fi

      - name: Check incremental performance
        if: steps.apply.outputs.applied == 'true'
        shell: bash
        run: |
          if node perf/scripts/evaluate-paired-benchmark.mjs \
            --input perf-results/benchmark.json \
            --output perf-results/paired-evaluation.json \
            --markdown perf-results/paired-evaluation.md \
            --minimum-improvement 0.015 \
            --maximum-regression 0.015 \
            --minimum-scenarios 8; then
            touch perf-results/PERF_ACCEPTED
          fi

      - name: Upload candidate evidence and exact source tree
        if: always() && steps.apply.outputs.applied == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: incremental-${{ matrix.experiment }}-${{ github.sha }}
          path: |
            perf-results
            src
          if-no-files-found: error
          retention-days: 30

      - name: Stop static servers
        if: always() && steps.apply.outputs.applied == 'true'
        run: |
          for pidfile in \
            /tmp/lumathread-baseline-server.pid \
            /tmp/lumathread-candidate-server.pid; do
            if [ -f "$pidfile" ]; then
              kill "$(cat "$pidfile")" 2>/dev/null || true
            fi
          done

  select-and-integrate:
    if: always() && contains(github.event.head_commit.message, 'integrate validated')
    needs: benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out accepted renderer baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download incremental candidates
        uses: actions/download-artifact@v4
        with:
          pattern: incremental-*-${{ github.sha }}
          path: candidates

      - name: Select the best accepted candidate
        id: select
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          accepted = []
          root = Path("candidates")
          if root.exists():
              for evaluation_path in root.glob("*/perf-results/paired-evaluation.json"):
                  candidate = evaluation_path.parents[1]
                  results = candidate / "perf-results"
                  if not (results / "VISUAL_ACCEPTED").exists():
                      continue
                  if not (results / "PERF_ACCEPTED").exists():
                      continue
                  evaluation = json.loads(evaluation_path.read_text())
                  if not evaluation.get("accepted"):
                      continue
                  accepted.append(
                      (
                          float(evaluation["geometricRatio"]),
                          candidate.name,
                          candidate,
                      )
                  )

          if not accepted:
              Path("/tmp/no-incremental-candidate").touch()
              raise SystemExit(0)

          accepted.sort(key=lambda entry: entry[0])
          ratio, name, candidate = accepted[0]
          Path("/tmp/selected-candidate").write_text(str(candidate))
          Path("/tmp/selected-name").write_text(name)
          Path("/tmp/selected-ratio").write_text(str(ratio))
          print(f"Selected {name} at ratio {ratio:.6f}")
          PY

          if [ -f /tmp/no-incremental-candidate ]; then
            echo "selected=false" >> "$GITHUB_OUTPUT"
          else
            echo "selected=true" >> "$GITHUB_OUTPUT"
            echo "name=$(cat /tmp/selected-name)" >> "$GITHUB_OUTPUT"
          fi

      - name: Copy selected exact source tree
        if: steps.select.outputs.selected == 'true'
        run: |
          selected="$(cat /tmp/selected-candidate)"
          rm -rf src
          cp -R "$selected/src" src

      - name: Set up Bun
        if: steps.select.outputs.selected == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Validate selected source again
        if: steps.select.outputs.selected == 'true'
        run: |
          bun install --frozen-lockfile
          bun run check
          bun run build

      - name: Commit selected incremental optimization
        if: steps.select.outputs.selected == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git diff --cached --quiet && exit 0
          git commit -m "perf: integrate validated incremental renderer optimization (${{ steps.select.outputs.name }})"
          git push origin HEAD:perf/visual-parity-renderer-optimization
