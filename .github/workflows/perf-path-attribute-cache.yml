name: Path attribute-state cache

on:
  push:
    branches:
      - perf/visual-parity-renderer-optimization
    paths:
      - .github/workflows/perf-path-attribute-cache.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: path-attribute-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: path state (${{ matrix.experiment }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        experiment:
          - noop
          - path-attribute-state-cache
          - optimized-path-attribute-state-cache

    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4
        with:
          ref: perf/visual-parity-renderer-optimization

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply exact path state experiment
        shell: bash
        run: |
          bunx biome format --write perf/scripts/benchmark-suite.mjs

          case "${{ matrix.experiment }}" in
            noop)
              ;;
            path-attribute-state-cache)
              node perf/scripts/apply-path-attribute-state-cache-experiment.mjs
              ;;
            optimized-path-attribute-state-cache)
              node perf/scripts/apply-renderer-optimization.mjs
              node perf/scripts/apply-path-attribute-state-cache-experiment.mjs
              ;;
          esac

          # Keep the generated comparison fail-closed and type-safe when no
          # pointer state has yet been recorded for an attribute index.
          python - <<'PY'
          from pathlib import Path
          path = Path("src/runtime/path-renderer.ts")
          if path.exists():
              source = path.read_text()
              source = source.replace(
                  """    return (\n      current?.buffer === next.buffer &&""",
                  """    if (!current) return false;\n    return (\n      current.buffer === next.buffer &&""",
              )
              path.write_text(source)
          PY

          bunx biome format --write \
            perf/scripts/apply-path-attribute-state-cache-experiment.mjs \
            perf/scripts/benchmark-suite.mjs \
            src/runtime/path-renderer.ts \
            src/rendering/shaders.ts \
            src/rendering/glass-mask.ts \
            src/rendering/webgl-resources.ts \
            src/runtime/resource-manager.ts \
            src/runtime/glass-terrain-renderer.ts

      - name: Validate candidate and harness
        run: |
          bun run check
          bun run build
          bunx tsc -p tsconfig.perf.json --noEmit

      - name: Check out frozen baseline
        uses: actions/checkout@v4
        with:
          ref: 7f4289aa3ff640f479701ceec0b0d790af037692
          path: baseline

      - name: Install baseline dependencies and inject identical harness
        run: |
          mkdir -p baseline/perf
          rm -rf baseline/perf/harness
          cp -R perf/harness baseline/perf/harness
          cp vite.perf.config.ts baseline/vite.perf.config.ts
          cp tsconfig.perf.json baseline/tsconfig.perf.json
          cd baseline
          bun install --frozen-lockfile

      - name: Build baseline and candidate harnesses
        run: |
          bunx vite build \
            --config vite.perf.config.ts \
            --outDir "$GITHUB_WORKSPACE/perf-dist-candidate"
          cd baseline
          bunx tsc -p tsconfig.perf.json --noEmit
          bunx vite build \
            --config vite.perf.config.ts \
            --outDir "$GITHUB_WORKSPACE/perf-dist-baseline"

      - name: Install visual diff dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy scikit-image

      - name: Start deterministic static servers
        run: |
          python -m http.server 4173 \
            --bind 127.0.0.1 \
            --directory perf-dist-baseline > /tmp/lumathread-baseline-server.log 2>&1 &
          echo $! > /tmp/lumathread-baseline-server.pid
          python -m http.server 4174 \
            --bind 127.0.0.1 \
            --directory perf-dist-candidate > /tmp/lumathread-candidate-server.log 2>&1 &
          echo $! > /tmp/lumathread-candidate-server.pid
          for port in 4173 4174; do
            for attempt in $(seq 1 50); do
              if curl --fail --silent "http://127.0.0.1:${port}/" >/dev/null; then
                break
              fi
              sleep 0.1
            done
            curl --fail --silent "http://127.0.0.1:${port}/" >/dev/null
          done

      - name: Run paired full-surface benchmark
        run: |
          bun perf/scripts/benchmark.mjs \
            --baseline http://127.0.0.1:4173 \
            --candidate http://127.0.0.1:4174 \
            --out perf-results \
            --repeats 5 \
            --frames 30 \
            --warmup-frames 16 \
            --profile-frames 8

      - name: Compare deterministic screenshots
        id: visual
        continue-on-error: true
        run: |
          python perf/scripts/visual-diff.py \
            --baseline perf-results/screenshots/baseline \
            --candidate perf-results/screenshots/candidate \
            --out perf-results/visual

      - name: Publish summary
        if: always()
        run: |
          printf '## Path state candidate: %s\n\n' "${{ matrix.experiment }}" >> "$GITHUB_STEP_SUMMARY"
          test ! -f perf-results/benchmark.md || cat perf-results/benchmark.md >> "$GITHUB_STEP_SUMMARY"
          test ! -f perf-results/visual/visual-diff.md || cat perf-results/visual/visual-diff.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw metrics and candidate sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: path-state-${{ matrix.experiment }}-${{ github.sha }}
          path: |
            perf-results
            src/runtime/path-renderer.ts
            src/rendering/shaders.ts
            src/rendering/glass-mask.ts
            src/rendering/webgl-resources.ts
            src/runtime/resource-manager.ts
            src/runtime/glass-terrain-renderer.ts
          if-no-files-found: warn
          retention-days: 30

      - name: Stop static servers
        if: always()
        run: |
          for pidfile in \
            /tmp/lumathread-baseline-server.pid \
            /tmp/lumathread-candidate-server.pid; do
            if [ -f "$pidfile" ]; then
              kill "$(cat "$pidfile")" 2>/dev/null || true
            fi
          done

      - name: Enforce visual parity gate
        if: always() && steps.visual.outcome == 'failure'
        run: exit 1
