name: Incremental consolidated path static caches

on:
  push:
    branches:
      - perf/major-2x-final-path-caches
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: final-path-static-caches-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 100

    steps:
      - name: Check out path-cache experiment
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install candidate dependencies
        run: bun install --frozen-lockfile

      - name: Import and materialize current consolidated stack
        run: |
          git fetch --no-tags origin \
            +refs/heads/perf/major-2x-final-consolidated:refs/remotes/origin/perf/major-2x-final-consolidated
          git show \
            refs/remotes/origin/perf/major-2x-final-consolidated:perf/scripts/materialize-validated-stack.sh \
            > /tmp/materialize-validated-stack.sh
          bash /tmp/materialize-validated-stack.sh
          bunx biome format --write src/runtime/path-renderer.ts

      - name: Apply path composite and flat-dot static caches
        run: |
          node perf/scripts/apply-path-composite-static-uniform-cache.mjs
          bunx biome format --write \
            src/runtime/path-renderer.ts \
            perf/scripts/apply-path-composite-static-uniform-cache.mjs
          bun run check
          bun run build
          bunx tsc -p tsconfig.perf.json --noEmit

      - name: Check out original renderer for stack-only baseline
        uses: actions/checkout@v4
        with:
          ref: b3c926b88b4861d851075015c141c67f225517fb
          path: baseline

      - name: Install and materialize stack-only baseline
        run: |
          cd baseline
          bun install --frozen-lockfile
          mkdir -p perf/scripts
          cp /tmp/materialize-validated-stack.sh perf/scripts/materialize-validated-stack.sh
          bash perf/scripts/materialize-validated-stack.sh
          bunx biome format --write src perf/harness 2>/dev/null || bunx biome format --write src
          bun run check
          bun run build
          cd ..
          mkdir -p baseline/perf
          rm -rf baseline/perf/harness
          cp -R perf/harness baseline/perf/harness
          cp vite.perf.config.ts baseline/vite.perf.config.ts
          cp tsconfig.perf.json baseline/tsconfig.perf.json

      - name: Build deterministic harnesses
        run: |
          bunx vite build --config vite.perf.config.ts \
            --outDir "$GITHUB_WORKSPACE/perf-dist-candidate"
          cd baseline
          bunx tsc -p tsconfig.perf.json --noEmit
          bunx vite build --config vite.perf.config.ts \
            --outDir "$GITHUB_WORKSPACE/perf-dist-baseline"

      - name: Install visual-diff dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy scikit-image

      - name: Start deterministic servers
        run: |
          python -m http.server 4173 --bind 127.0.0.1 \
            --directory perf-dist-baseline >/tmp/baseline.log 2>&1 &
          echo $! >/tmp/baseline.pid
          python -m http.server 4174 --bind 127.0.0.1 \
            --directory perf-dist-candidate >/tmp/candidate.log 2>&1 &
          echo $! >/tmp/candidate.pid
          for port in 4173 4174; do
            for attempt in $(seq 1 100); do
              curl --fail --silent "http://127.0.0.1:${port}/" >/dev/null && break
              sleep 0.1
            done
            curl --fail --silent "http://127.0.0.1:${port}/" >/dev/null
          done

      - name: Run incremental paired CTA benchmark
        run: |
          bun perf/scripts/benchmark.mjs \
            --baseline http://127.0.0.1:4173 \
            --candidate http://127.0.0.1:4174 \
            --out perf-results \
            --focus cta \
            --repeats 5 \
            --frames 24 \
            --warmup-frames 12 \
            --profile-frames 8

      - name: Prove exactly one renderer frame
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("perf-results/benchmark.json").read_text())
          failures = []
          for scenario in report.get("scenarios", []):
              for build in ("baseline", "candidate"):
                  for index, run in enumerate(scenario.get("raw", {}).get(build, [])):
                      stages = run.get("gpu", {}).get("byStage", {})
                      for stage in ("path-composite", "glass-composite"):
                          value = stages.get(stage, {}).get("countPerFrame")
                          if value is None or abs(value - 1) > 1e-9:
                              failures.append(
                                  f"{scenario.get('name')}/{build}/{index}/{stage}: {value}"
                              )
                      finish = run.get("glPerFrame", {}).get("finish")
                      if finish is None or abs(finish - 1) > 1e-9:
                          failures.append(
                              f"{scenario.get('name')}/{build}/{index}/finish: {finish}"
                          )
          Path("perf-results/path-cache-validation.json").write_text(
              json.dumps({"passed": not failures, "failures": failures}, indent=2) + "\n"
          )
          if failures:
              raise SystemExit("\n".join(failures))
          PY

      - name: Compare cached path output against consolidated stack
        id: visual
        continue-on-error: true
        run: |
          python perf/scripts/visual-diff.py \
            --baseline perf-results/screenshots/baseline \
            --candidate perf-results/screenshots/candidate \
            --out perf-results/visual

      - name: Calculate incremental ratios
        if: always()
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          path = Path("perf-results/benchmark.json")
          if not path.exists():
              raise SystemExit(0)
          report = json.loads(path.read_text())
          wall = []
          gpu = []
          rows = []
          for scenario in report.get("scenarios", []):
              paired = scenario.get("paired", {})
              wr = paired.get("wallMeanMs", {}).get("geometricMeanRatio")
              gr = paired.get("gpuTotalFrameMs", {}).get("geometricMeanRatio")
              if isinstance(wr, (int, float)) and wr > 0:
                  wall.append(wr)
              if isinstance(gr, (int, float)) and gr > 0:
                  gpu.append(gr)
              rows.append({"name": scenario.get("name"), "wallRatio": wr, "gpuRatio": gr})
          geometric = lambda values: math.exp(sum(map(math.log, values)) / len(values))
          output = {
              "wallRatioVsConsolidatedStack": geometric(wall) if wall else None,
              "gpuRatioVsConsolidatedStack": geometric(gpu) if gpu else None,
              "scenarios": rows,
          }
          Path("perf-results/incremental-evaluation.json").write_text(
              json.dumps(output, indent=2) + "\n"
          )
          print(json.dumps(output, indent=2))
          PY

      - name: Publish summary
        if: always()
        run: |
          test ! -f perf-results/benchmark.md || cat perf-results/benchmark.md >> "$GITHUB_STEP_SUMMARY"
          test ! -f perf-results/visual/visual-diff.md || cat perf-results/visual/visual-diff.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exact sources and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consolidated-path-static-caches-${{ github.sha }}
          path: |
            perf-results
            src
            baseline/src
          if-no-files-found: error
          retention-days: 30

      - name: Stop servers
        if: always()
        run: |
          test ! -f /tmp/baseline.pid || kill "$(cat /tmp/baseline.pid)" 2>/dev/null || true
          test ! -f /tmp/candidate.pid || kill "$(cat /tmp/candidate.pid)" 2>/dev/null || true

      - name: Enforce visual parity
        if: always() && steps.visual.outcome == 'failure'
        run: exit 1
