name: Inline CTA dots CPU-wall tradeoff

on:
  push:
    branches:
      - perf/major-2x-inline-dots-wall
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inline-dots-wall-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 110

    steps:
      - name: Check out inline-dot candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install candidate dependencies
        run: bun install --frozen-lockfile

      - name: Materialize exact selected temporal baseline
        run: |
          bash perf/scripts/materialize-final-temporal-stack.sh
          node perf/scripts/add-temporal-parity-snapshots.mjs
          bunx biome format --write \
            src \
            perf/scripts/benchmark.mjs \
            perf/scripts/benchmark-suite.mjs \
            perf/scripts/add-temporal-parity-snapshots.mjs
          git diff --binary \
            b3c926b88b4861d851075015c141c67f225517fb -- src \
            > /tmp/final-temporal.patch
          test -s /tmp/final-temporal.patch

      - name: Select the original inline-dot composite without patch reversal
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/runtime/path-renderer.ts")
          source = path.read_text(encoding="utf-8")
          before = '''  const shouldSplitFlatDots = (settings: Settings) =>
            settings.motionMode === "anchored" &&
            settings.dotsEnabled &&
            settings.dotMode === "flat" &&
            settings.dotOpacity > 0.000001 &&
            settings.dotSpacing > 0.000001;
          '''
          after = '''  const shouldSplitFlatDots = (_settings: Settings) => false;
          '''
          if source.count(before) != 1:
              raise SystemExit(
                  f"expected one split-dot selector, found {source.count(before)}"
              )
          path.write_text(source.replace(before, after), encoding="utf-8")
          PY
          grep -Fq 'const shouldSplitFlatDots = (_settings: Settings) => false;' \
            src/runtime/path-renderer.ts
          bunx biome format --write src/runtime/path-renderer.ts
          bun run check
          bun run build
          bunx tsc -p tsconfig.perf.json --noEmit

      - name: Import production-wall harness without GL profiler overhead
        run: |
          readonly WALL_PROOF_SHA="f975c472d2791f27ce1f0ed9f8c40fae71cd9efe"
          git fetch --no-tags origin "$WALL_PROOF_SHA"
          git show "$WALL_PROOF_SHA:perf/scripts/apply-production-wall-harness.mjs" \
            > perf/scripts/apply-production-wall-harness.mjs
          git show "$WALL_PROOF_SHA:perf/scripts/benchmark-production-wall.mjs" \
            > perf/scripts/benchmark-production-wall.mjs
          node perf/scripts/apply-production-wall-harness.mjs
          bunx biome format --write \
            perf/harness/index.html \
            perf/harness/gl-profiler.js \
            perf/scripts/benchmark-suite.mjs \
            perf/scripts/apply-production-wall-harness.mjs \
            perf/scripts/benchmark-production-wall.mjs

      - name: Check out identical split-dot temporal baseline
        uses: actions/checkout@v4
        with:
          ref: b3c926b88b4861d851075015c141c67f225517fb
          path: baseline

      - name: Install and materialize baseline
        run: |
          cd baseline
          bun install --frozen-lockfile
          git apply --whitespace=nowarn /tmp/final-temporal.patch
          bunx biome format --write src
          bun run check
          bun run build
          cd ..
          mkdir -p baseline/perf
          rm -rf baseline/perf/harness
          cp -R perf/harness baseline/perf/harness
          cp vite.perf.config.ts baseline/vite.perf.config.ts
          cp tsconfig.perf.json baseline/tsconfig.perf.json

      - name: Build candidate and baseline harnesses
        run: |
          bunx vite build --config vite.perf.config.ts \
            --outDir "$GITHUB_WORKSPACE/perf-dist-candidate"
          cd baseline
          bunx tsc -p tsconfig.perf.json --noEmit
          bunx vite build --config vite.perf.config.ts \
            --outDir "$GITHUB_WORKSPACE/perf-dist-baseline"

      - name: Install visual comparison dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy scikit-image

      - name: Start deterministic servers
        run: |
          python -m http.server 4173 --bind 127.0.0.1 \
            --directory perf-dist-baseline >/tmp/baseline.log 2>&1 &
          echo $! >/tmp/baseline.pid
          python -m http.server 4174 --bind 127.0.0.1 \
            --directory perf-dist-candidate >/tmp/candidate.log 2>&1 &
          echo $! >/tmp/candidate.pid
          for port in 4173 4174; do
            for attempt in $(seq 1 100); do
              curl --fail --silent "http://127.0.0.1:${port}/" >/dev/null && break
              sleep 0.1
            done
            curl --fail --silent "http://127.0.0.1:${port}/" >/dev/null
          done

      - name: Run interactive CTA visual and GPU benchmark
        run: |
          bun perf/scripts/benchmark.mjs \
            --baseline http://127.0.0.1:4173 \
            --candidate http://127.0.0.1:4174 \
            --out perf-results \
            --focus cta \
            --repeats 2 \
            --frames 12 \
            --warmup-frames 8 \
            --profile-frames 6

      - name: Compare deterministic interactive CTA screenshots
        id: visual
        continue-on-error: true
        run: |
          python perf/scripts/visual-diff.py \
            --baseline perf-results/screenshots/baseline \
            --candidate perf-results/screenshots/candidate \
            --out perf-results/visual

      - name: Run uninstrumented CTA wall benchmark
        run: |
          bun perf/scripts/benchmark-production-wall.mjs \
            --baseline http://127.0.0.1:4173 \
            --candidate http://127.0.0.1:4174 \
            --out wall-results \
            --focus cta \
            --repeats 3 \
            --frames 45 \
            --warmup-frames 20 \
            --profile-frames 1

      - name: Evaluate CPU/GPU tradeoff fail-closed
        id: tradeoff
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path

          benchmark = json.loads(Path("perf-results/benchmark.json").read_text())
          wall = json.loads(Path("wall-results/production-wall.json").read_text())
          rows = []
          for scenario in benchmark.get("scenarios", []):
              paired = scenario.get("paired", {})
              baseline = scenario.get("baseline", {})
              candidate = scenario.get("candidate", {})
              gpu = paired.get("gpuTotalFrameMs", {}).get("geometricMeanRatio")
              b_instanced = baseline.get("glPerFrame", {}).get("drawArraysInstanced", {}).get("median")
              c_instanced = candidate.get("glPerFrame", {}).get("drawArraysInstanced", {}).get("median")
              b_arrays = baseline.get("glPerFrame", {}).get("drawArrays", {}).get("median")
              c_arrays = candidate.get("glPerFrame", {}).get("drawArrays", {}).get("median")
              rows.append({
                  "name": scenario.get("name"),
                  "gpuRatio": gpu,
                  "instancedDrawDelta": c_instanced - b_instanced,
                  "arrayDrawDelta": c_arrays - b_arrays,
              })
          if len(rows) != 4:
              raise SystemExit(f"fail-closed: expected four CTA GPU scenarios, found {rows}")
          gpu_values = [row["gpuRatio"] for row in rows]
          if not all(isinstance(value, (int, float)) and value > 0 for value in gpu_values):
              raise SystemExit(f"incomplete GPU ratios: {gpu_values}")
          incremental_gpu = math.exp(
              sum(math.log(value) for value in gpu_values) / len(gpu_values)
          )
          wall_verdict = wall.get("verdict", {})
          wall_ratio = wall_verdict.get("wallRatio")
          submit_ratio = wall_verdict.get("submitRatio")
          drain_ratio = wall_verdict.get("drainRatio")
          if not all(
              isinstance(value, (int, float)) and value > 0
              for value in (wall_ratio, submit_ratio, drain_ratio)
          ):
              raise SystemExit(f"incomplete production-wall verdict: {wall_verdict}")
          estimated_original_gpu = incremental_gpu * 0.31
          result = {
              "incrementalGpuRatioVsSplitDots": incremental_gpu,
              "conservativeEstimatedGpuRatioVsOriginal": estimated_original_gpu,
              "wallRatioVsSplitDots": wall_ratio,
              "submitRatioVsSplitDots": submit_ratio,
              "drainRatioVsSplitDots": drain_ratio,
              "equivalentFpsMultiplierVsSplitDots": 1 / wall_ratio,
              "worstWallRatio": wall_verdict.get("worstWallRatio"),
              "scenarios": rows,
              "accepted": (
                  incremental_gpu <= 1.55
                  and estimated_original_gpu <= 0.5
                  and wall_ratio <= 0.97
                  and submit_ratio <= 0.97
                  and all(row["instancedDrawDelta"] <= -1 for row in rows)
                  and all(row["arrayDrawDelta"] <= -1 for row in rows)
              ),
          }
          Path("wall-results/inline-dots-tradeoff.json").write_text(
              json.dumps(result, indent=2) + "\n"
          )
          print(json.dumps(result, indent=2))
          if not result["accepted"]:
              raise SystemExit("inline-dot CPU/GPU tradeoff did not pass: " + json.dumps(result))
          PY

      - name: Publish summaries
        if: always()
        run: |
          test ! -f perf-results/benchmark.md || cat perf-results/benchmark.md >> "$GITHUB_STEP_SUMMARY"
          test ! -f perf-results/visual/visual-diff.md || cat perf-results/visual/visual-diff.md >> "$GITHUB_STEP_SUMMARY"
          test ! -f wall-results/production-wall.md || cat wall-results/production-wall.md >> "$GITHUB_STEP_SUMMARY"
          if [ -f wall-results/inline-dots-tradeoff.json ]; then
            printf '\n```json\n' >> "$GITHUB_STEP_SUMMARY"
            cat wall-results/inline-dots-tradeoff.json >> "$GITHUB_STEP_SUMMARY"
            printf '```\n' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Collect exact candidate evidence
        if: always()
        run: |
          mkdir -p perf-results/candidate perf-results/server-logs
          cp /tmp/final-temporal.patch perf-results/candidate/ 2>/dev/null || true
          cp perf/materialized-final-temporal-stack.txt perf-results/candidate/ 2>/dev/null || true
          cp /tmp/baseline.log perf-results/server-logs/ 2>/dev/null || true
          cp /tmp/candidate.log perf-results/server-logs/ 2>/dev/null || true
          cp -R src perf-results/candidate/materialized-src

      - name: Upload measurements, captures and exact source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inline-dots-wall-${{ github.sha }}
          path: |
            perf-results
            wall-results
          if-no-files-found: error
          retention-days: 30

      - name: Stop deterministic servers
        if: always()
        run: |
          test ! -f /tmp/baseline.pid || kill "$(cat /tmp/baseline.pid)" 2>/dev/null || true
          test ! -f /tmp/candidate.pid || kill "$(cat /tmp/candidate.pid)" 2>/dev/null || true

      - name: Enforce CPU/GPU tradeoff
        if: always() && steps.tradeoff.outcome == 'failure'
        run: exit 1

      - name: Enforce visual parity
        if: always() && steps.visual.outcome == 'failure'
        run: exit 1
