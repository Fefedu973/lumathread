name: Hero q4 varyings quick discovery

on:
  pull_request:
    branches:
      - perf/major-2x-final-consolidated
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hero-q4-quick-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Check out q4-varying experiment
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install candidate dependencies
        run: bun install --frozen-lockfile

      - name: Materialize current consolidated stack
        run: |
          bash perf/scripts/materialize-validated-stack.sh
          bunx biome format --write src
          git diff --binary \
            b3c926b88b4861d851075015c141c67f225517fb -- src \
            > /tmp/consolidated-stack.patch
          test -s /tmp/consolidated-stack.patch

      - name: Normalize generated constants and stack markers
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("perf/scripts/apply-hero-q4-varying-experiment.mjs")
          source = path.read_text(encoding="utf-8")
          source = source.replace("(1 / 1024).toFixed(10)", "(1 / 512).toFixed(10)")
          source = source.replace(
              "${HERO_PATH_K0_MAX_ARGUMENT.toFixed(8)}",
              "24.00000000",
          )
          source = source.replace(
              "${HERO_PATH_K0_MIN_ARGUMENT.toFixed(8)}",
              "0.00010000",
          )
          source = source.replace(
              "    for (const bundle of resources.sourceIntegralPrograms) {\\n"
              "      exactGl.deleteProgram(bundle.program);\\n"
              "    }",
              "    for (const program of resources.sourceIntegralPrograms) {\\n"
              "      exactGl.deleteProgram(program.program);\\n"
              "    }",
          )
          source = source.replace(
              "      for (const bundle of sourceIntegralPrograms) {\\n"
              "        exactGl.deleteProgram(bundle.program);\\n"
              "      }",
              "      for (const program of sourceIntegralPrograms) {\\n"
              "        exactGl.deleteProgram(program.program);\\n"
              "      }",
          )
          path.write_text(source, encoding="utf-8")
          PY
          node perf/scripts/apply-hero-q4-varying-experiment.mjs
          bunx biome format --write \
            src/rendering/shaders.ts \
            src/rendering/webgl-resources.ts \
            src/runtime/resource-manager.ts \
            src/runtime/path-renderer.ts \
            perf/scripts/apply-hero-q4-varying-experiment.mjs
          bun run check
          bun run build
          bunx tsc -p tsconfig.perf.json --noEmit

      - name: Check out stack-only baseline
        uses: actions/checkout@v4
        with:
          ref: b3c926b88b4861d851075015c141c67f225517fb
          path: baseline

      - name: Install and materialize stack-only baseline
        run: |
          cd baseline
          bun install --frozen-lockfile
          git apply --whitespace=nowarn /tmp/consolidated-stack.patch
          bunx biome format --write src
          bun run check
          bun run build
          cd ..
          mkdir -p baseline/perf
          rm -rf baseline/perf/harness
          cp -R perf/harness baseline/perf/harness
          cp vite.perf.config.ts baseline/vite.perf.config.ts
          cp tsconfig.perf.json baseline/tsconfig.perf.json

      - name: Build deterministic harnesses
        run: |
          bunx vite build --config vite.perf.config.ts \
            --outDir "$GITHUB_WORKSPACE/perf-dist-candidate"
          cd baseline
          bunx tsc -p tsconfig.perf.json --noEmit
          bunx vite build --config vite.perf.config.ts \
            --outDir "$GITHUB_WORKSPACE/perf-dist-baseline"

      - name: Install visual-diff dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy scikit-image

      - name: Start deterministic servers
        run: |
          python -m http.server 4173 --bind 127.0.0.1 \
            --directory perf-dist-baseline >/tmp/baseline.log 2>&1 &
          echo $! >/tmp/baseline.pid
          python -m http.server 4174 --bind 127.0.0.1 \
            --directory perf-dist-candidate >/tmp/candidate.log 2>&1 &
          echo $! >/tmp/candidate.pid
          for port in 4173 4174; do
            for attempt in $(seq 1 100); do
              curl --fail --silent "http://127.0.0.1:${port}/" >/dev/null && break
              sleep 0.1
            done
            curl --fail --silent "http://127.0.0.1:${port}/" >/dev/null
          done

      - name: Run quick paired Hero benchmark
        run: |
          bun perf/scripts/benchmark.mjs \
            --baseline http://127.0.0.1:4173 \
            --candidate http://127.0.0.1:4174 \
            --out perf-results \
            --focus hero \
            --repeats 1 \
            --frames 3 \
            --warmup-frames 2 \
            --profile-frames 3

      - name: Compare deterministic Hero screenshots
        id: visual
        continue-on-error: true
        run: |
          python perf/scripts/visual-diff.py \
            --baseline perf-results/screenshots/baseline \
            --candidate perf-results/screenshots/candidate \
            --out perf-results/visual

      - name: Calculate quick wall and GPU ratios
        if: always()
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          path = Path("perf-results/benchmark.json")
          if not path.exists():
              raise SystemExit(0)
          report = json.loads(path.read_text())
          wall = []
          gpu = []
          rows = []
          for scenario in report.get("scenarios", []):
              paired = scenario.get("paired", {})
              wr = paired.get("wallMeanMs", {}).get("geometricMeanRatio")
              gr = paired.get("gpuTotalFrameMs", {}).get("geometricMeanRatio")
              if isinstance(wr, (int, float)) and wr > 0:
                  wall.append(wr)
              if isinstance(gr, (int, float)) and gr > 0:
                  gpu.append(gr)
              rows.append({"name": scenario.get("name"), "wallRatio": wr, "gpuRatio": gr})
          geometric = lambda values: math.exp(sum(map(math.log, values)) / len(values))
          result = {
              "wallRatioVsConsolidatedStack": geometric(wall) if wall else None,
              "gpuRatioVsConsolidatedStack": geometric(gpu) if gpu else None,
              "scenarios": rows,
          }
          Path("perf-results/hero-q4-varyings-evaluation.json").write_text(
              json.dumps(result, indent=2) + "\n"
          )
          print(json.dumps(result, indent=2))
          PY

      - name: Publish summary
        if: always()
        run: |
          test ! -f perf-results/benchmark.md || cat perf-results/benchmark.md >> "$GITHUB_STEP_SUMMARY"
          test ! -f perf-results/visual/visual-diff.md || cat perf-results/visual/visual-diff.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload measurements and exact source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hero-q4-varyings-quick-${{ github.sha }}
          path: |
            perf-results
            src
            baseline/src
          if-no-files-found: error
          retention-days: 30

      - name: Stop servers
        if: always()
        run: |
          test ! -f /tmp/baseline.pid || kill "$(cat /tmp/baseline.pid)" 2>/dev/null || true
          test ! -f /tmp/candidate.pid || kill "$(cat /tmp/candidate.pid)" 2>/dev/null || true

      - name: Enforce visual parity
        if: always() && steps.visual.outcome == 'failure'
        run: exit 1
