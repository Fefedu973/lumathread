name: Hero temporal rate and steady-frame validation

on:
  push:
    branches:
      - perf/major-2x-hero-temporal-rate-validation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hero-temporal-rate-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Hero temporal cache (${{ matrix.rate }} Hz)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        rate:
          - 15
          - 20
          - 24
          - 30
          - 40
          - 60

    steps:
      - name: Check out temporal-rate candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install candidate dependencies
        run: bun install --frozen-lockfile

      - name: Materialize the consolidated renderer baseline
        run: |
          bash perf/scripts/materialize-validated-stack.sh
          bunx biome format --write src
          git diff --binary \
            b3c926b88b4861d851075015c141c67f225517fb -- src \
            > /tmp/consolidated-stack.patch
          test -s /tmp/consolidated-stack.patch

      - name: Apply active temporal cache and selected anchor rate
        env:
          TEMPORAL_RATE: ${{ matrix.rate }}
        run: |
          base64 --decode \
            perf/experiments/apply-hero-temporal-interpolation-experiment.mjs.gz.b64 \
            | gzip --decompress \
            > /tmp/apply-hero-temporal.mjs
          python - <<'PY'
          import os
          from pathlib import Path

          path = Path('/tmp/apply-hero-temporal.mjs')
          source = path.read_text(encoding='utf-8')
          before = 'root.filamentPlaybackRate) / 30,'
          after = f"root.filamentPlaybackRate) / {os.environ['TEMPORAL_RATE']},"
          count = source.count(before)
          if count != 1:
              raise SystemExit(f'expected one 30 Hz anchor literal, found {count}')
          path.write_text(source.replace(before, after), encoding='utf-8')
          PY
          node /tmp/apply-hero-temporal.mjs
          python - <<'PY'
          from pathlib import Path

          path = Path('src/runtime/path-renderer.ts')
          source = path.read_text(encoding='utf-8')
          before = 'root.quality.quadrature >= 4 &&'
          after = 'root.quality.quadrature >= 2 &&'
          count = source.count(before)
          if count != 1:
              raise SystemExit(f'expected one temporal quadrature selector, found {count}')
          path.write_text(source.replace(before, after), encoding='utf-8')
          PY
          grep -q "updateTemporalHeroCache" src/runtime/path-renderer.ts
          grep -q "root.quality.quadrature >= 2" src/runtime/path-renderer.ts

      - name: Add steady-state 60 Hz and 120 Hz visual captures
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          suite_path = Path('perf/scripts/benchmark-suite.mjs')
          suite = suite_path.read_text(encoding='utf-8')
          start = suite.index('async function captureSnapshot(')
          end = suite.index('\nfunction formatNumber', start)
          replacement = r'''async function captureSnapshot(chrome, baseUrl, snapshot, destination) {
            const steadySteps = Array.isArray(snapshot.steps) ? snapshot.steps : null;
            const query = new URLSearchParams({
              scenario: snapshot.scenario,
              theme: snapshot.theme,
              mode: steadySteps ? "benchmark" : "snapshot",
              variant: "full",
            });
            if (!steadySteps) query.set("time", String(snapshot.time));
            const page = await openPage(
              chrome,
              `${baseUrl}/?${query.toString()}`,
              snapshot.viewport,
            );
            try {
              await waitForHarness(page.client);
              await evaluate(page.client, `document.fonts?.ready ?? Promise.resolve()`);
              if (steadySteps) {
                await sleep(100);
                for (const seconds of steadySteps) {
                  await stepFrame(page.client, seconds);
                }
                await sleep(50);
              } else {
                await sleep(900);
              }
              const result = await page.client.call("Page.captureScreenshot", {
                format: "png",
                fromSurface: true,
                captureBeyondViewport: false,
              });
              await writeFile(destination, Buffer.from(result.data, "base64"));
              return await evaluate(
                page.client,
                `({
                  status: window.__LUMATHREAD_HARNESS__.rendererStatus,
                  errors: window.__LUMATHREAD_HARNESS__.rendererErrors,
                  gl: window.__LUMATHREAD_GL_STATS__,
                })`,
              );
            } finally {
              await page.close();
            }
          }
          '''
          suite_path.write_text(suite[:start] + replacement + suite[end:], encoding='utf-8')

          main_path = Path('perf/scripts/benchmark.mjs')
          main = main_path.read_text(encoding='utf-8')
          scenarios = r'''  const allScenarios = [
            {
              name: "hero-dark-desktop",
              scenario: "hero",
              theme: "dark",
              viewport: { width: 1600, height: 900, dpr: 1, mobile: false },
            },
            {
              name: "hero-light-desktop",
              scenario: "hero",
              theme: "light",
              viewport: { width: 1600, height: 900, dpr: 1, mobile: false },
            },
            {
              name: "hero-dark-mobile-2x",
              scenario: "hero",
              theme: "dark",
              viewport: { width: 412, height: 915, dpr: 2, mobile: true },
            },
            {
              name: "hero-light-mobile-2x",
              scenario: "hero",
              theme: "light",
              viewport: { width: 412, height: 915, dpr: 2, mobile: true },
            },
          ];
          const allProfileSurfaces = [];
          '''
          main, count = re.subn(
              r'  const allScenarios = \[.*?\n  \];\n  const allProfileSurfaces = \[.*?\n  \];\n',
              scenarios,
              main,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'expected one scenario/profile block, found {count}')

          snapshots = r'''  const allSnapshots = [
            {
              name: "hero-dark-desktop-steady-60hz-f7",
              scenario: "hero",
              theme: "dark",
              steps: Array.from({ length: 7 }, () => 1 / 60),
              viewport: { width: 1600, height: 900, dpr: 1, mobile: false },
            },
            {
              name: "hero-dark-desktop-steady-120hz-f7",
              scenario: "hero",
              theme: "dark",
              steps: Array.from({ length: 7 }, () => 1 / 120),
              viewport: { width: 1600, height: 900, dpr: 1, mobile: false },
            },
            {
              name: "hero-light-desktop-steady-60hz-f11",
              scenario: "hero",
              theme: "light",
              steps: Array.from({ length: 11 }, () => 1 / 60),
              viewport: { width: 1600, height: 900, dpr: 1, mobile: false },
            },
            {
              name: "hero-dark-mobile-2x-steady-120hz-f11",
              scenario: "hero",
              theme: "dark",
              steps: Array.from({ length: 11 }, () => 1 / 120),
              viewport: { width: 412, height: 915, dpr: 2, mobile: true },
            },
            {
              name: "hero-light-mobile-2x-steady-60hz-f7",
              scenario: "hero",
              theme: "light",
              steps: Array.from({ length: 7 }, () => 1 / 60),
              viewport: { width: 412, height: 915, dpr: 2, mobile: true },
            },
            {
              name: "hero-light-mobile-2x-steady-120hz-f7",
              scenario: "hero",
              theme: "light",
              steps: Array.from({ length: 7 }, () => 1 / 120),
              viewport: { width: 412, height: 915, dpr: 2, mobile: true },
            },
          ];
          '''
          main, count = re.subn(
              r'  const allSnapshots = \[.*?\n  \];\n  const matchesFocus',
              snapshots + '  const matchesFocus',
              main,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'expected one snapshot block, found {count}')
          main_path.write_text(main, encoding='utf-8')
          PY
          bunx biome format --write \
            perf/scripts/benchmark.mjs \
            perf/scripts/benchmark-suite.mjs

      - name: Validate candidate and harness
        run: |
          bunx biome format --write \
            src/rendering/shaders.ts \
            src/rendering/webgl-resources.ts \
            src/runtime/resource-manager.ts \
            src/runtime/draw-common.ts \
            src/runtime/path-renderer.ts
          bun run check
          bun run build
          bunx tsc -p tsconfig.perf.json --noEmit

      - name: Check out identical consolidated-stack baseline
        uses: actions/checkout@v4
        with:
          ref: b3c926b88b4861d851075015c141c67f225517fb
          path: baseline

      - name: Install and materialize baseline
        run: |
          cd baseline
          bun install --frozen-lockfile
          git apply --whitespace=nowarn /tmp/consolidated-stack.patch
          bunx biome format --write src
          bun run check
          bun run build
          cd ..
          mkdir -p baseline/perf
          rm -rf baseline/perf/harness
          cp -R perf/harness baseline/perf/harness
          cp -R perf/scripts baseline/perf/scripts
          cp vite.perf.config.ts baseline/vite.perf.config.ts
          cp tsconfig.perf.json baseline/tsconfig.perf.json

      - name: Build deterministic harnesses
        run: |
          bunx vite build --config vite.perf.config.ts \
            --outDir "$GITHUB_WORKSPACE/perf-dist-candidate"
          cd baseline
          bunx tsc -p tsconfig.perf.json --noEmit
          bunx vite build --config vite.perf.config.ts \
            --outDir "$GITHUB_WORKSPACE/perf-dist-baseline"

      - name: Install visual comparison dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy scikit-image

      - name: Start deterministic servers
        run: |
          python -m http.server 4173 --bind 127.0.0.1 \
            --directory perf-dist-baseline >/tmp/baseline.log 2>&1 &
          echo $! >/tmp/baseline.pid
          python -m http.server 4174 --bind 127.0.0.1 \
            --directory perf-dist-candidate >/tmp/candidate.log 2>&1 &
          echo $! >/tmp/candidate.pid
          for port in 4173 4174; do
            for attempt in $(seq 1 100); do
              curl --fail --silent "http://127.0.0.1:${port}/" >/dev/null && break
              sleep 0.1
            done
            curl --fail --silent "http://127.0.0.1:${port}/" >/dev/null
          done

      - name: Run paired Hero benchmark and steady-frame captures
        run: |
          bun perf/scripts/benchmark.mjs \
            --baseline http://127.0.0.1:4173 \
            --candidate http://127.0.0.1:4174 \
            --out perf-results \
            --focus hero \
            --repeats 2 \
            --frames 12 \
            --warmup-frames 8 \
            --profile-frames 1

      - name: Compare steady-state Hero screenshots
        id: visual
        continue-on-error: true
        run: |
          python perf/scripts/visual-diff.py \
            --baseline perf-results/screenshots/baseline \
            --candidate perf-results/screenshots/candidate \
            --out perf-results/visual

      - name: Evaluate rate, activation and per-surface ratios
        if: always()
        env:
          TEMPORAL_RATE: ${{ matrix.rate }}
        run: |
          python - <<'PY'
          import json, math, os
          from pathlib import Path

          report_path = Path('perf-results/benchmark.json')
          if not report_path.exists():
              raise SystemExit('benchmark report is missing')
          report = json.loads(report_path.read_text())
          wall = []
          gpu = []
          rows = []
          active = 0
          for scenario in report.get('scenarios', []):
              paired = scenario.get('paired', {})
              baseline = scenario.get('baseline', {})
              candidate = scenario.get('candidate', {})
              wr = paired.get('wallMeanMs', {}).get('geometricMeanRatio')
              gr = paired.get('gpuTotalFrameMs', {}).get('geometricMeanRatio')
              bq = baseline.get('gpuSampleCount', {}).get('median')
              cq = candidate.get('gpuSampleCount', {}).get('median')
              bd = baseline.get('glPerFrame', {}).get('drawArraysInstanced', {}).get('median')
              cd = candidate.get('glPerFrame', {}).get('drawArraysInstanced', {}).get('median')
              cache_active = (
                  isinstance(bq, (int, float)) and isinstance(cq, (int, float))
                  and cq < bq * 0.95
              ) or (
                  isinstance(bd, (int, float)) and isinstance(cd, (int, float))
                  and cd < bd
              )
              active += int(cache_active)
              if isinstance(wr, (int, float)) and wr > 0:
                  wall.append(wr)
              if isinstance(gr, (int, float)) and gr > 0:
                  gpu.append(gr)
              rows.append({
                  'name': scenario.get('name'),
                  'wallRatio': wr,
                  'gpuRatio': gr,
                  'baselineGpuQueries': bq,
                  'candidateGpuQueries': cq,
                  'baselineInstancedDraws': bd,
                  'candidateInstancedDraws': cd,
                  'cacheActive': cache_active,
              })
          geometric = lambda values: math.exp(sum(map(math.log, values)) / len(values))
          visual_path = Path('perf-results/visual/visual-diff.json')
          visual = json.loads(visual_path.read_text()) if visual_path.exists() else None
          result = {
              'rateHz': int(os.environ['TEMPORAL_RATE']),
              'cacheActiveScenarios': active,
              'scenarioCount': len(rows),
              'wallRatio': geometric(wall) if wall else None,
              'gpuRatio': geometric(gpu) if gpu else None,
              'visual': visual,
              'scenarios': rows,
          }
          Path('perf-results/temporal-rate-evaluation.json').write_text(
              json.dumps(result, indent=2) + '\n'
          )
          print(json.dumps(result, indent=2))
          if len(rows) != 4 or active != 4:
              raise SystemExit(f'fail-closed: temporal cache active in {active}/{len(rows)} scenarios')
          PY

      - name: Publish summary
        if: always()
        run: |
          printf '## Hero temporal anchors: %s Hz\n\n' "${{ matrix.rate }}" >> "$GITHUB_STEP_SUMMARY"
          test ! -f perf-results/benchmark.md || cat perf-results/benchmark.md >> "$GITHUB_STEP_SUMMARY"
          test ! -f perf-results/visual/visual-diff.md || cat perf-results/visual/visual-diff.md >> "$GITHUB_STEP_SUMMARY"
          if [ -f perf-results/temporal-rate-evaluation.json ]; then
            printf '\n```json\n' >> "$GITHUB_STEP_SUMMARY"
            cat perf-results/temporal-rate-evaluation.json >> "$GITHUB_STEP_SUMMARY"
            printf '```\n' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload measurements and exact source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hero-temporal-${{ matrix.rate }}hz-steady-${{ github.sha }}
          path: |
            perf-results
            src
            baseline/src
          if-no-files-found: error
          retention-days: 30

      - name: Stop servers
        if: always()
        run: |
          test ! -f /tmp/baseline.pid || kill "$(cat /tmp/baseline.pid)" 2>/dev/null || true
          test ! -f /tmp/candidate.pid || kill "$(cat /tmp/candidate.pid)" 2>/dev/null || true

      - name: Enforce steady-state visual parity
        if: always() && steps.visual.outcome == 'failure'
        run: exit 1
