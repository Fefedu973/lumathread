name: Final CTA pointer transition proof

on:
  push:
    branches:
      - perf/final-validated-renderer
    paths:
      - src/**
      - perf/final-renderer-provenance.md
      - .github/workflows/final-pointer-transition-proof.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: final-pointer-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Check out exact final candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and validate final candidate
        run: |
          bun install --frozen-lockfile
          grep -Fq 'root.motionMode === "anchored" ? 10 : 15' \
            src/runtime/path-renderer.ts
          grep -Fq 'pointerState.dotPointerActive' src/runtime/path-renderer.ts
          bun run check
          bun run build
          bunx tsc -p tsconfig.perf.json --noEmit

      - name: Import the corrected transition capture driver
        run: |
          readonly POINTER_PROOF_SHA="dc7e668ad0c1ae2712becaeb6b69c179894f480a"
          git fetch --no-tags origin "$POINTER_PROOF_SHA"
          git show \
            "$POINTER_PROOF_SHA:perf/scripts/capture-cta-pointer-transitions.mjs" \
            > perf/scripts/capture-final-cta-pointer-transitions.mjs
          grep -Fq 'SETTLING_FRAME_COUNT = 42' \
            perf/scripts/capture-final-cta-pointer-transitions.mjs
          grep -Fq 'RECOVERY_FRAME_COUNT = 12' \
            perf/scripts/capture-final-cta-pointer-transitions.mjs
          bunx biome format --write \
            perf/scripts/capture-final-cta-pointer-transitions.mjs

      - name: Check out frozen original renderer
        uses: actions/checkout@v4
        with:
          ref: 7f4289aa3ff640f479701ceec0b0d790af037692
          path: baseline

      - name: Install original and inject identical harness
        run: |
          cd baseline
          bun install --frozen-lockfile
          cd ..
          mkdir -p baseline/perf
          rm -rf baseline/perf/harness
          cp -R perf/harness baseline/perf/harness
          cp vite.perf.config.ts baseline/vite.perf.config.ts
          cp tsconfig.perf.json baseline/tsconfig.perf.json

      - name: Build candidate and original harnesses
        run: |
          bunx vite build --config vite.perf.config.ts \
            --outDir "$GITHUB_WORKSPACE/perf-dist-candidate"
          cd baseline
          bunx tsc -p tsconfig.perf.json --noEmit
          bunx vite build --config vite.perf.config.ts \
            --outDir "$GITHUB_WORKSPACE/perf-dist-baseline"

      - name: Install visual comparison dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy scikit-image

      - name: Start deterministic servers
        run: |
          python -m http.server 4173 --bind 127.0.0.1 \
            --directory perf-dist-baseline >/tmp/baseline.log 2>&1 &
          echo $! >/tmp/baseline.pid
          python -m http.server 4174 --bind 127.0.0.1 \
            --directory perf-dist-candidate >/tmp/candidate.log 2>&1 &
          echo $! >/tmp/candidate.pid
          for port in 4173 4174; do
            for attempt in $(seq 1 100); do
              curl --fail --silent "http://127.0.0.1:${port}/" >/dev/null && break
              sleep 0.1
            done
            curl --fail --silent "http://127.0.0.1:${port}/" >/dev/null
          done

      - name: Capture enter, move, leave, settling and recovered states
        run: |
          bun perf/scripts/capture-final-cta-pointer-transitions.mjs \
            --baseline http://127.0.0.1:4173 \
            --candidate http://127.0.0.1:4174 \
            --out pointer-results

      - name: Compare every pointer-transition capture
        id: visual
        continue-on-error: true
        run: |
          python perf/scripts/visual-diff.py \
            --baseline pointer-results/screenshots/baseline \
            --candidate pointer-results/screenshots/candidate \
            --out pointer-results/visual

      - name: Prove exact fallback and cache recovery
        id: recovery
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          report = json.loads(
              Path("pointer-results/pointer-transition-metadata.json").read_text()
          )
          candidate = [
              row for row in report.get("results", []) if row.get("side") == "candidate"
          ]
          expected = {
              "cta-dark-desktop",
              "cta-light-desktop",
              "cta-dark-mobile-2x",
              "cta-light-mobile-2x",
          }
          if {row.get("surface") for row in candidate} != expected or len(candidate) != 4:
              raise SystemExit(f"fail-closed: incomplete candidate surfaces: {candidate}")

          rows = []
          for row in candidate:
              active = row.get("activeCounters", {}).get("counters", {})
              recovered = row.get("leaveCounters", {}).get("counters", {})
              active_draws = active.get("drawArraysInstanced")
              recovered_draws = recovered.get("drawArraysInstanced")
              active_frames = 5
              recovered_frames = row.get("recoveryFrameCount", 12)
              if not all(
                  isinstance(value, (int, float)) and value >= 0
                  for value in (active_draws, recovered_draws)
              ):
                  raise SystemExit(f"missing draw counters for {row.get('surface')}")
              active_per_frame = active_draws / active_frames
              recovered_per_frame = recovered_draws / recovered_frames
              ratio = (
                  recovered_per_frame / active_per_frame
                  if active_per_frame > 0
                  else None
              )
              errors = row.get("errors") or []
              if errors:
                  raise SystemExit(f"renderer errors for {row.get('surface')}: {errors}")
              rows.append({
                  "surface": row.get("surface"),
                  "activeInstancedDrawsPerFrame": active_per_frame,
                  "recoveredInstancedDrawsPerFrame": recovered_per_frame,
                  "recoveredToActiveDrawRatio": ratio,
                  "settlingFrameCount": row.get("settlingFrameCount"),
                  "recoveryFrameCount": recovered_frames,
              })

          ratios = [row["recoveredToActiveDrawRatio"] for row in rows]
          if not all(isinstance(value, (int, float)) and value > 0 for value in ratios):
              raise SystemExit(f"invalid recovery ratios: {ratios}")
          geometric = math.exp(sum(math.log(value) for value in ratios) / len(ratios))
          result = {
              "passed": geometric <= 0.6 and max(ratios) <= 0.65,
              "geometricRecoveredToActiveDrawRatio": geometric,
              "worstRecoveredToActiveDrawRatio": max(ratios),
              "surfaces": rows,
          }
          Path("pointer-results/final-pointer-recovery.json").write_text(
              json.dumps(result, indent=2) + "\n"
          )
          print(json.dumps(result, indent=2))
          if not result["passed"]:
              raise SystemExit("temporal cache did not recover after pointer transition")
          PY

      - name: Publish pointer proof summary
        if: always()
        run: |
          if [ -f pointer-results/final-pointer-recovery.json ]; then
            printf '```json\n' >> "$GITHUB_STEP_SUMMARY"
            cat pointer-results/final-pointer-recovery.json >> "$GITHUB_STEP_SUMMARY"
            printf '```\n' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f pointer-results/visual/visual-diff.md ]; then
            printf '\n' >> "$GITHUB_STEP_SUMMARY"
            cat pointer-results/visual/visual-diff.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload transition captures and metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-pointer-proof-${{ github.sha }}
          path: pointer-results
          if-no-files-found: error
          retention-days: 30

      - name: Stop deterministic servers
        if: always()
        run: |
          test ! -f /tmp/baseline.pid || kill "$(cat /tmp/baseline.pid)" 2>/dev/null || true
          test ! -f /tmp/candidate.pid || kill "$(cat /tmp/candidate.pid)" 2>/dev/null || true

      - name: Enforce cache recovery
        if: always() && steps.recovery.outcome == 'failure'
        run: exit 1

      - name: Enforce pointer visual parity
        if: always() && steps.visual.outcome == 'failure'
        run: exit 1
