name: One-shot format paired benchmark

on:
  push:
    branches:
      - perf/visual-parity-renderer-optimization
    paths:
      - .github/workflows/one-shot-format-paired-benchmark.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out optimization branch
        uses: actions/checkout@v4
        with:
          ref: perf/visual-parity-renderer-optimization
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format paired benchmark and remove this workflow
        run: |
          bunx biome format --write perf/scripts/benchmark-suite.mjs
          rm .github/workflows/one-shot-format-paired-benchmark.yml

      - name: Commit the correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add perf/scripts/benchmark-suite.mjs .github/workflows/one-shot-format-paired-benchmark.yml
          git commit -m "style: format paired benchmark loop"
          git push origin HEAD:perf/visual-parity-renderer-optimization
