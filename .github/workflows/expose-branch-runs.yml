name: Expose branch performance runs

on:
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  expose:
    runs-on: ubuntu-latest
    steps:
      - name: List runs for the exact PR head
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${HEAD_SHA}&per_page=100" \
            | jq '{total_count, workflow_runs: [.workflow_runs[] | {id, name, event, status, conclusion, head_sha, html_url}]}'
