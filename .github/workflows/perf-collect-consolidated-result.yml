name: Collect latest consolidated renderer result

on:
  push:
    branches:
      - perf/major-2x-final-consolidated
    paths:
      - .github/workflows/perf-collect-consolidated-result.yml
      - .github/workflows/perf-final-consolidated.yml
      - perf/scripts/materialize-validated-stack.sh
      - perf/scripts/evaluate-consolidated-target.py
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: collect-final-consolidated
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 125
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BRANCH: perf/major-2x-final-consolidated
      WORKFLOW_NAME: Final exact renderer consolidation

    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/major-2x-final-consolidated
          fetch-depth: 0

      - name: Wait for the newest full validation run
        id: run
        run: |
          selected=""
          for attempt in $(seq 1 240); do
            selected="$(
              gh run list \
                --workflow "$WORKFLOW_NAME" \
                --branch "$BRANCH" \
                --limit 10 \
                --json databaseId,status,conclusion,headSha,createdAt,url \
                --jq '[.[] | select(.status == "completed")][0] // empty'
            )"
            if [ -n "$selected" ]; then
              break
            fi
            sleep 30
          done
          if [ -z "$selected" ]; then
            echo 'No completed consolidated run was found before timeout.' >&2
            exit 1
          fi
          echo "$selected" > /tmp/selected-run.json
          run_id="$(jq -r '.databaseId' /tmp/selected-run.json)"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download the exact run artifact
        run: |
          mkdir -p /tmp/consolidated-artifact
          gh run download "${{ steps.run.outputs.run_id }}" \
            --pattern 'final-consolidated-*' \
            --dir /tmp/consolidated-artifact

      - name: Materialize stable result snapshot
        run: |
          rm -rf perf/latest-consolidated
          mkdir -p perf/latest-consolidated
          find /tmp/consolidated-artifact -type f \
            \( -name 'benchmark.json' \
            -o -name 'benchmark.md' \
            -o -name 'consolidated-target.json' \
            -o -name 'consolidated-target.md' \
            -o -name 'visual-diff.json' \
            -o -name 'visual-diff.md' \
            -o -name 'consolidated-renderer.patch' \
            -o -name 'materialized-stack.txt' \) \
            -exec cp '{}' perf/latest-consolidated/ \;
          cp /tmp/selected-run.json perf/latest-consolidated/run.json
          test -f perf/latest-consolidated/benchmark.json

      - name: Commit result without retriggering CI
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add perf/latest-consolidated
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'perf: publish consolidated renderer result [skip ci]'
          git push origin HEAD:perf/major-2x-final-consolidated
