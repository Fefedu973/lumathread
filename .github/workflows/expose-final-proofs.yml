name: Expose final proof workflows on the delivery PR

on:
  push:
    branches:
      - perf/visual-parity-renderer-final
    paths:
      - .github/workflows/expose-final-proofs.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/visual-parity-renderer-final
          fetch-depth: 0

      - name: Add the delivery PR trigger fail-closed
        run: |
          python - <<'PY'
          from pathlib import Path

          for name in (
              '.github/workflows/perf-final-direct.yml',
              '.github/workflows/perf-final-wall.yml',
          ):
              path = Path(name)
              source = path.read_text()
              marker = '  workflow_dispatch:\n'
              replacement = (
                  '  pull_request:\n'
                  '    branches:\n'
                  '      - perf/visual-parity-renderer-optimization\n'
                  '  workflow_dispatch:\n'
              )
              if replacement in source:
                  continue
              if source.count(marker) != 1:
                  raise SystemExit(f'{name}: expected one workflow_dispatch marker')
              path.write_text(source.replace(marker, replacement))
          PY

      - name: Commit exposed proof workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/perf-final-direct.yml \
            .github/workflows/perf-final-wall.yml
          git diff --cached --quiet && exit 0
          git commit -m 'ci: expose final renderer proofs on the delivery PR'
          git push origin HEAD:perf/visual-parity-renderer-final
