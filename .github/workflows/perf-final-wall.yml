name: Final materialized production wall proof

on:
  push:
    branches:
      - perf/visual-parity-renderer-final
    paths:
      - src/**
      - .github/workflows/perf-final-wall.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: final-materialized-wall-${{ github.ref }}
  cancel-in-progress: true

env:
  ORIGINAL_SHA: 7f4289aa3ff640f479701ceec0b0d790af037692
  WALL_PROOF_SHA: f975c472d2791f27ce1f0ed9f8c40fae71cd9efe
  SOURCE_TREE_SHA256: 205dfcef3e5f73dd8e0dd27bafadf12a04f6ee244587616d42c82ab3dbd91728

jobs:
  benchmark:
    name: Wall ${{ matrix.surface }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        surface:
          - hero-dark-desktop
          - hero-light-desktop
          - cta-dark-desktop
          - cta-light-desktop
          - hero-dark-mobile-2x
          - hero-light-mobile-2x
          - cta-dark-mobile-2x
          - cta-light-mobile-2x

    steps:
      - name: Check out exact materialized candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile

      - name: Verify source and import pinned uninstrumented harness
        run: |
          actual=$(cd src && find . -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          test "$actual" = "$SOURCE_TREE_SHA256"
          git fetch --no-tags origin "$WALL_PROOF_SHA"
          git show "$WALL_PROOF_SHA:perf/scripts/apply-production-wall-harness.mjs" \
            > perf/scripts/apply-production-wall-harness.mjs
          git show "$WALL_PROOF_SHA:perf/scripts/benchmark-production-wall.mjs" \
            > perf/scripts/benchmark-production-wall.mjs
          node perf/scripts/apply-production-wall-harness.mjs
          bunx biome format --write \
            perf/harness/index.html \
            perf/harness/gl-profiler.js \
            perf/scripts/benchmark-suite.mjs \
            perf/scripts/apply-production-wall-harness.mjs \
            perf/scripts/benchmark-production-wall.mjs
          bun run check
          bun run build
          bunx tsc -p tsconfig.perf.json --noEmit

      - name: Check out frozen original renderer
        uses: actions/checkout@v4
        with:
          ref: ${{ env.ORIGINAL_SHA }}
          path: baseline

      - name: Install original and inject identical uninstrumented harness
        run: |
          cd baseline
          bun install --frozen-lockfile
          cd ..
          python perf/scripts/patch-original-debug-stepping.py baseline/src/runtime/use-hero-wave-renderer.ts
          cd baseline
          bunx biome format --write src/runtime/use-hero-wave-renderer.ts
          bun run check
          cd ..
          mkdir -p baseline/perf
          rm -rf baseline/perf/harness
          cp -R perf/harness baseline/perf/harness
          cp vite.perf.config.ts baseline/vite.perf.config.ts
          cp tsconfig.perf.json baseline/tsconfig.perf.json

      - name: Build candidate and original harnesses
        run: |
          bunx vite build --config vite.perf.config.ts --outDir "$GITHUB_WORKSPACE/candidate-dist"
          cd baseline
          bunx tsc -p tsconfig.perf.json --noEmit
          bunx vite build --config vite.perf.config.ts --outDir "$GITHUB_WORKSPACE/baseline-dist"

      - name: Start deterministic servers
        run: |
          python -m http.server 4173 --bind 127.0.0.1 --directory baseline-dist >/tmp/baseline.log 2>&1 &
          echo $! >/tmp/baseline.pid
          python -m http.server 4174 --bind 127.0.0.1 --directory candidate-dist >/tmp/candidate.log 2>&1 &
          echo $! >/tmp/candidate.pid
          for port in 4173 4174; do
            for attempt in $(seq 1 100); do
              curl --fail --silent "http://127.0.0.1:${port}/" >/dev/null && break
              sleep 0.1
            done
            curl --fail --silent "http://127.0.0.1:${port}/" >/dev/null
          done

      - name: Run uninstrumented surface benchmark
        run: |
          bun perf/scripts/benchmark-production-wall.mjs \
            --baseline http://127.0.0.1:4173 \
            --candidate http://127.0.0.1:4174 \
            --out wall-results \
            --surface "${{ matrix.surface }}" \
            --repeats 4 \
            --frames 60 \
            --warmup-frames 30 \
            --profile-frames 1

      - name: Verify all profiler overhead is absent
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("wall-results/production-wall.json").read_text())
          scenarios = report.get("scenarios", [])
          if len(scenarios) != 1:
              raise SystemExit(f"expected one surface, found {len(scenarios)}")
          runs = scenarios[0].get("raw", {}).get("baseline", []) + scenarios[0].get("raw", {}).get("candidate", [])
          if not runs:
              raise SystemExit("no raw wall runs")
          errors = []
          for index, run in enumerate(runs):
              profile = run.get("gl", {}).get("gpuProfile")
              if profile and profile.get("supported"):
                  errors.append(f"run {index}: per-draw GPU timer queries enabled")
              nonzero = {
                  key: value for key, value in run.get("glPerFrame", {}).items()
                  if isinstance(value, (int, float)) and abs(value) > 1e-12
              }
              if nonzero:
                  errors.append(f"run {index}: GL wrappers active: {nonzero}")
          if errors:
              raise SystemExit("\n".join(errors))
          PY

      - name: Upload wall surface evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-wall-${{ matrix.surface }}-${{ github.sha }}
          path: wall-results
          if-no-files-found: error
          retention-days: 30

      - name: Stop deterministic servers
        if: always()
        run: |
          test ! -f /tmp/baseline.pid || kill "$(cat /tmp/baseline.pid)" 2>/dev/null || true
          test ! -f /tmp/candidate.pid || kill "$(cat /tmp/candidate.pid)" 2>/dev/null || true

  aggregate:
    name: Production wall verdict
    needs: benchmark
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: final-wall-*-${{ github.sha }}
          path: downloaded

      - name: Aggregate eight surfaces fail-closed
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path

          expected = {
              "hero-dark-desktop", "hero-light-desktop",
              "cta-dark-desktop", "cta-light-desktop",
              "hero-dark-mobile-2x", "hero-light-mobile-2x",
              "cta-dark-mobile-2x", "cta-light-mobile-2x",
          }
          paths = list(Path("downloaded").rglob("production-wall.json"))
          if len(paths) != 8:
              raise SystemExit(f"expected eight wall reports, found {paths}")
          rows = []
          for path in paths:
              report = json.loads(path.read_text())
              scenarios = report.get("scenarios", [])
              if len(scenarios) != 1:
                  raise SystemExit(f"{path}: expected one scenario")
              scenario = scenarios[0]
              paired = scenario.get("paired", {})
              rows.append({
                  "name": scenario.get("name"),
                  "wallRatio": paired.get("wallMeanMs", {}).get("geometricMeanRatio"),
                  "submitRatio": paired.get("submitMeanMs", {}).get("geometricMeanRatio"),
                  "drainRatio": paired.get("drainMeanMs", {}).get("geometricMeanRatio"),
                  "baselineFps": scenario.get("baseline", {}).get("fps", {}).get("median"),
                  "candidateFps": scenario.get("candidate", {}).get("fps", {}).get("median"),
              })
          if {row["name"] for row in rows} != expected:
              raise SystemExit(f"incomplete wall matrix: {rows}")
          def geometric(key):
              values = [row[key] for row in rows]
              if not all(isinstance(value, (int, float)) and value > 0 for value in values):
                  raise SystemExit(f"incomplete positive {key}: {values}")
              return math.exp(sum(math.log(value) for value in values) / len(values))
          wall = geometric("wallRatio")
          submit = geometric("submitRatio")
          drain = geometric("drainRatio")
          worst = max(row["wallRatio"] for row in rows)
          result = {
              "productionWallAccepted": wall <= 0.9 and worst <= 1.05,
              "aspirationalTwoXTargetReached": wall <= 0.5,
              "wallRatio": wall,
              "equivalentUncappedFpsMultiplier": 1 / wall,
              "submitRatio": submit,
              "drainRatio": drain,
              "worstWallRatio": worst,
              "scenarios": sorted(rows, key=lambda row: row["name"]),
          }
          Path("final-wall-verdict.json").write_text(json.dumps(result, indent=2) + "\n")
          lines = [
              "# Final uninstrumented wall proof",
              "",
              f"- Production wall gate: **{'PASS' if result['productionWallAccepted'] else 'FAIL'}**",
              f"- Wall ratio: **{wall:.4f}**",
              f"- Equivalent uncapped FPS multiplier: **{1 / wall:.2f}×**",
              f"- Aspirational 2× target: **{'PASS' if result['aspirationalTwoXTargetReached'] else 'NOT REACHED'}**",
              f"- Submit ratio: **{submit:.4f}**",
              f"- Drain ratio: **{drain:.4f}**",
              f"- Worst surface ratio: **{worst:.4f}**",
              "",
              "| Scenario | Wall ratio | FPS multiplier | Submit | Drain | Baseline FPS | Candidate FPS |",
              "|---|---:|---:|---:|---:|---:|---:|",
          ]
          for row in result["scenarios"]:
              lines.append(
                  f"| {row['name']} | {row['wallRatio']:.4f} | {1 / row['wallRatio']:.2f}× | "
                  f"{row['submitRatio']:.4f} | {row['drainRatio']:.4f} | "
                  f"{row['baselineFps']:.1f} | {row['candidateFps']:.1f} |"
              )
          Path("final-wall-verdict.md").write_text("\n".join(lines) + "\n")
          print("\n".join(lines))
          if not result["productionWallAccepted"]:
              raise SystemExit("materialized renderer failed the production wall gate")
          PY

      - name: Publish wall report
        if: always()
        run: |
          test ! -f final-wall-verdict.md || cat final-wall-verdict.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload combined wall proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-wall-proof-${{ github.sha }}
          path: |
            final-wall-verdict.json
            final-wall-verdict.md
            downloaded
          if-no-files-found: error
          retention-days: 30

      - name: Enforce all surface jobs
        if: always() && needs.benchmark.result != 'success'
        run: exit 1
