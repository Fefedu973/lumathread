name: CTA temporal anchor-rate matrix

on:
  push:
    branches:
      - perf/major-2x-cta-temporal-rate-matrix
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cta-temporal-rates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: CTA idle cache (${{ matrix.rate }} Hz)
    runs-on: ubuntu-latest
    timeout-minutes: 95
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        rate:
          - 8
          - 10
          - 12
          - 15

    steps:
      - name: Check out rate-matrix candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install candidate dependencies
        run: bun install --frozen-lockfile

      - name: Materialize final stack and idle CTA matrix
        run: |
          bash perf/scripts/materialize-final-temporal-stack.sh
          node perf/scripts/add-temporal-parity-snapshots.mjs
          node perf/scripts/add-cta-temporal-parity-snapshots.mjs
          bunx biome format --write \
            src \
            perf/scripts/benchmark.mjs \
            perf/scripts/benchmark-suite.mjs
          git diff --binary \
            b3c926b88b4861d851075015c141c67f225517fb -- src \
            > /tmp/final-stack.patch
          test -s /tmp/final-stack.patch

      - name: Apply idle selector at ${{ matrix.rate }} Hz
        env:
          CTA_TEMPORAL_RATE: ${{ matrix.rate }}
        run: |
          node perf/scripts/apply-cta-temporal-idle-experiment.mjs
          python - <<'PY'
          import os
          from pathlib import Path

          rate = os.environ["CTA_TEMPORAL_RATE"]
          path = Path("src/runtime/path-renderer.ts")
          source = path.read_text(encoding="utf-8")
          before = "Math.abs(root.speed * root.filamentPlaybackRate) / 15,"
          after = (
              "Math.abs(root.speed * root.filamentPlaybackRate) / "
              f'(root.motionMode === "anchored" ? {rate} : 15),'
          )
          count = source.count(before)
          if count != 1:
              raise SystemExit(f"expected one 15 Hz anchor expression, found {count}")
          path.write_text(source.replace(before, after), encoding="utf-8")
          PY
          grep -Fq 'root.motionMode === "anchored" ? ${{ matrix.rate }} : 15' \
            src/runtime/path-renderer.ts
          bunx biome format --write \
            src/runtime/path-renderer.ts \
            perf/scripts/apply-cta-temporal-idle-experiment.mjs
          bun run check
          bun run build
          bunx tsc -p tsconfig.perf.json --noEmit

      - name: Check out identical exact final-stack baseline
        uses: actions/checkout@v4
        with:
          ref: b3c926b88b4861d851075015c141c67f225517fb
          path: baseline

      - name: Install and materialize baseline
        run: |
          cd baseline
          bun install --frozen-lockfile
          git apply --whitespace=nowarn /tmp/final-stack.patch
          bunx biome format --write src
          bun run check
          bun run build
          cd ..
          mkdir -p baseline/perf
          rm -rf baseline/perf/harness
          cp -R perf/harness baseline/perf/harness
          cp vite.perf.config.ts baseline/vite.perf.config.ts
          cp tsconfig.perf.json baseline/tsconfig.perf.json

      - name: Build candidate and baseline harnesses
        run: |
          bunx vite build --config vite.perf.config.ts \
            --outDir "$GITHUB_WORKSPACE/perf-dist-candidate"
          cd baseline
          bunx tsc -p tsconfig.perf.json --noEmit
          bunx vite build --config vite.perf.config.ts \
            --outDir "$GITHUB_WORKSPACE/perf-dist-baseline"

      - name: Install visual comparison dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy scikit-image

      - name: Start deterministic servers
        run: |
          python -m http.server 4173 --bind 127.0.0.1 \
            --directory perf-dist-baseline >/tmp/baseline.log 2>&1 &
          echo $! >/tmp/baseline.pid
          python -m http.server 4174 --bind 127.0.0.1 \
            --directory perf-dist-candidate >/tmp/candidate.log 2>&1 &
          echo $! >/tmp/candidate.pid
          for port in 4173 4174; do
            for attempt in $(seq 1 100); do
              curl --fail --silent "http://127.0.0.1:${port}/" >/dev/null && break
              sleep 0.1
            done
            curl --fail --silent "http://127.0.0.1:${port}/" >/dev/null
          done

      - name: Run paired idle CTA discovery
        run: |
          bun perf/scripts/benchmark.mjs \
            --baseline http://127.0.0.1:4173 \
            --candidate http://127.0.0.1:4174 \
            --out perf-results \
            --focus cta \
            --repeats 1 \
            --frames 12 \
            --warmup-frames 8 \
            --profile-frames 4

      - name: Compare direct and sequential CTA captures
        id: visual
        continue-on-error: true
        run: |
          python perf/scripts/visual-diff.py \
            --baseline perf-results/screenshots/baseline \
            --candidate perf-results/screenshots/candidate \
            --out perf-results/visual

      - name: Summarize rate candidate
        if: always()
        env:
          CTA_TEMPORAL_RATE: ${{ matrix.rate }}
        run: |
          python - <<'PY'
          import json, math, os
          from pathlib import Path

          path = Path("perf-results/benchmark.json")
          if not path.exists():
              raise SystemExit(0)
          report = json.loads(path.read_text())
          rows = []
          for scenario in report.get("scenarios", []):
              baseline = scenario.get("baseline", {})
              candidate = scenario.get("candidate", {})
              paired = scenario.get("paired", {})
              bd = baseline.get("glPerFrame", {}).get("drawArraysInstanced", {}).get("median")
              cd = candidate.get("glPerFrame", {}).get("drawArraysInstanced", {}).get("median")
              rows.append({
                  "name": scenario.get("name"),
                  "wallRatio": paired.get("wallMeanMs", {}).get("geometricMeanRatio"),
                  "gpuRatio": paired.get("gpuTotalFrameMs", {}).get("geometricMeanRatio"),
                  "drawRatio": cd / bd if isinstance(cd, (int, float)) and isinstance(bd, (int, float)) and bd > 0 else None,
              })
          if len(rows) != 4:
              raise SystemExit(f"fail-closed: expected four CTA scenarios, found {rows}")
          def geometric(key):
              values = [row[key] for row in rows]
              if not all(isinstance(value, (int, float)) and value > 0 for value in values):
                  raise SystemExit(f"incomplete {key} values: {values}")
              return math.exp(sum(math.log(value) for value in values) / len(values))
          result = {
              "rateHz": float(os.environ["CTA_TEMPORAL_RATE"]),
              "wallRatioVsExactFinalStack": geometric("wallRatio"),
              "gpuRatioVsExactFinalStack": geometric("gpuRatio"),
              "drawRatio": geometric("drawRatio"),
              "worstWallRatio": max(row["wallRatio"] for row in rows),
              "scenarios": rows,
          }
          Path("perf-results/cta-temporal-rate-evaluation.json").write_text(
              json.dumps(result, indent=2) + "\n"
          )
          print(json.dumps(result, indent=2))
          PY
          if [ -f perf-results/cta-temporal-rate-evaluation.json ]; then
            printf '```json\n' >> "$GITHUB_STEP_SUMMARY"
            cat perf-results/cta-temporal-rate-evaluation.json >> "$GITHUB_STEP_SUMMARY"
            printf '```\n' >> "$GITHUB_STEP_SUMMARY"
          fi
          test ! -f perf-results/visual/visual-diff.md \
            || cat perf-results/visual/visual-diff.md >> "$GITHUB_STEP_SUMMARY"

      - name: Collect exact candidate evidence
        if: always()
        run: |
          mkdir -p perf-results/candidate perf-results/server-logs
          cp /tmp/final-stack.patch perf-results/candidate/ 2>/dev/null || true
          cp perf/materialized-final-temporal-stack.txt perf-results/candidate/ 2>/dev/null || true
          cp /tmp/baseline.log perf-results/server-logs/ 2>/dev/null || true
          cp /tmp/candidate.log perf-results/server-logs/ 2>/dev/null || true
          cp -R src perf-results/candidate/materialized-src

      - name: Upload rate result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cta-temporal-${{ matrix.rate }}hz-${{ github.sha }}
          path: perf-results
          if-no-files-found: error
          retention-days: 30

      - name: Stop deterministic servers
        if: always()
        run: |
          test ! -f /tmp/baseline.pid || kill "$(cat /tmp/baseline.pid)" 2>/dev/null || true
          test ! -f /tmp/candidate.pid || kill "$(cat /tmp/candidate.pid)" 2>/dev/null || true

      - name: Enforce visual parity
        if: always() && steps.visual.outcome == 'failure'
        run: exit 1
