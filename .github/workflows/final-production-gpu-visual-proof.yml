name: Final production GPU and visual proof

on:
  push:
    branches:
      - perf/final-production-renderer
    paths:
      - src/**
      - perf/final-production-renderer.json
      - perf/scripts/add-final-parity-snapshots.mjs
      - .github/workflows/final-production-gpu-visual-proof.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: final-production-gpu-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: GPU and visual (${{ matrix.focus }})
    runs-on: ubuntu-latest
    timeout-minutes: 105
    strategy:
      fail-fast: false
      matrix:
        focus: [hero, cta]

    steps:
      - name: Check out exact materialized candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Assert this is the materialized production tree
        run: |
          test -f perf/final-production-renderer.json
          grep -Fq 'temporalAnchorRateHz = root.motionMode === "anchored" ? 10 : 15' \
            src/runtime/path-renderer.ts
          grep -Fq 'shouldUseTemporalPathCache' src/runtime/path-renderer.ts
          grep -Fq 'PATH_INTEGRAL_STATIC_COMPOSITE_FRAGMENT_SHADER' src/rendering/shaders.ts

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and validate candidate
        run: |
          bun install --frozen-lockfile
          node perf/scripts/add-final-parity-snapshots.mjs
          bunx biome format --write \
            perf/scripts/benchmark.mjs \
            perf/scripts/add-final-parity-snapshots.mjs
          bun run check
          bun run build
          bunx tsc -p tsconfig.perf.json --noEmit

      - name: Check out frozen original renderer
        uses: actions/checkout@v4
        with:
          ref: 7f4289aa3ff640f479701ceec0b0d790af037692
          path: baseline

      - name: Patch original with identical deterministic debug stepping
        run: |
          readonly WALL_PROOF_SHA="f975c472d2791f27ce1f0ed9f8c40fae71cd9efe"
          git fetch --no-tags origin "$WALL_PROOF_SHA"
          git show \
            "$WALL_PROOF_SHA:perf/scripts/patch-original-debug-stepping.py" \
            > /tmp/patch-original-debug-stepping.py
          cd baseline
          bun install --frozen-lockfile
          python /tmp/patch-original-debug-stepping.py \
            src/runtime/use-hero-wave-renderer.ts
          bunx biome format --write src/runtime/use-hero-wave-renderer.ts
          bun run check
          cd ..
          mkdir -p baseline/perf
          rm -rf baseline/perf/harness
          cp -R perf/harness baseline/perf/harness
          cp vite.perf.config.ts baseline/vite.perf.config.ts
          cp tsconfig.perf.json baseline/tsconfig.perf.json

      - name: Build candidate and original harnesses
        run: |
          bunx vite build --config vite.perf.config.ts \
            --outDir "$GITHUB_WORKSPACE/perf-dist-candidate"
          cd baseline
          bunx tsc -p tsconfig.perf.json --noEmit
          bunx vite build --config vite.perf.config.ts \
            --outDir "$GITHUB_WORKSPACE/perf-dist-baseline"

      - name: Install visual comparison dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy scikit-image

      - name: Start deterministic servers
        run: |
          python -m http.server 4173 --bind 127.0.0.1 \
            --directory perf-dist-baseline >/tmp/baseline.log 2>&1 &
          echo $! >/tmp/baseline.pid
          python -m http.server 4174 --bind 127.0.0.1 \
            --directory perf-dist-candidate >/tmp/candidate.log 2>&1 &
          echo $! >/tmp/candidate.pid
          for port in 4173 4174; do
            for attempt in $(seq 1 100); do
              curl --fail --silent "http://127.0.0.1:${port}/" >/dev/null && break
              sleep 0.1
            done
            curl --fail --silent "http://127.0.0.1:${port}/" >/dev/null
          done

      - name: Run paired GPU benchmark and deterministic captures
        run: |
          bun perf/scripts/benchmark.mjs \
            --baseline http://127.0.0.1:4173 \
            --candidate http://127.0.0.1:4174 \
            --out perf-results \
            --focus "${{ matrix.focus }}" \
            --repeats 3 \
            --frames 24 \
            --warmup-frames 12 \
            --profile-frames 8

      - name: Compare direct, off-anchor and sequential captures
        id: visual
        continue-on-error: true
        run: |
          python perf/scripts/visual-diff.py \
            --baseline perf-results/screenshots/baseline \
            --candidate perf-results/screenshots/candidate \
            --out perf-results/visual

      - name: Validate focus report completeness
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          focus = "${{ matrix.focus }}"
          expected = {
              "hero": {
                  "hero-dark-desktop",
                  "hero-light-desktop",
                  "hero-dark-mobile-2x",
                  "hero-light-mobile-2x",
              },
              "cta": {
                  "cta-dark-desktop",
                  "cta-light-desktop",
                  "cta-dark-mobile-2x",
                  "cta-light-mobile-2x",
              },
          }[focus]
          report = json.loads(Path("perf-results/benchmark.json").read_text())
          scenarios = report.get("scenarios", [])
          names = {scenario.get("name") for scenario in scenarios}
          if names != expected or len(scenarios) != 4:
              raise SystemExit(
                  f"fail-closed: expected {sorted(expected)}, received {sorted(names)}"
              )
          for scenario in scenarios:
              paired = scenario.get("paired", {})
              gpu = paired.get("gpuTotalFrameMs", {}).get("geometricMeanRatio")
              wall = paired.get("wallMeanMs", {}).get("geometricMeanRatio")
              if not isinstance(gpu, (int, float)) or gpu <= 0:
                  raise SystemExit(f"missing GPU ratio for {scenario.get('name')}")
              if not isinstance(wall, (int, float)) or wall <= 0:
                  raise SystemExit(f"missing wall ratio for {scenario.get('name')}")
          PY

      - name: Publish focus summaries
        if: always()
        run: |
          test ! -f perf-results/benchmark.md \
            || cat perf-results/benchmark.md >> "$GITHUB_STEP_SUMMARY"
          test ! -f perf-results/visual/visual-diff.md \
            || cat perf-results/visual/visual-diff.md >> "$GITHUB_STEP_SUMMARY"

      - name: Collect exact evidence
        if: always()
        run: |
          mkdir -p perf-results/server-logs perf-results/candidate
          cp /tmp/baseline.log perf-results/server-logs/ 2>/dev/null || true
          cp /tmp/candidate.log perf-results/server-logs/ 2>/dev/null || true
          cp perf/final-production-renderer.json perf-results/candidate/
          git diff --binary 7f4289aa3ff640f479701ceec0b0d790af037692 -- src \
            > perf-results/candidate/final-production-renderer.patch

      - name: Upload focus proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-gpu-visual-${{ matrix.focus }}-${{ github.sha }}
          path: perf-results
          if-no-files-found: error
          retention-days: 30

      - name: Stop deterministic servers
        if: always()
        run: |
          test ! -f /tmp/baseline.pid || kill "$(cat /tmp/baseline.pid)" 2>/dev/null || true
          test ! -f /tmp/candidate.pid || kill "$(cat /tmp/candidate.pid)" 2>/dev/null || true

      - name: Enforce strict visual parity
        if: always() && steps.visual.outcome == 'failure'
        run: exit 1

  aggregate:
    name: Aggregate final GPU target
    needs: benchmark
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Download Hero and CTA proofs
        uses: actions/download-artifact@v4
        with:
          pattern: final-gpu-visual-*-${{ github.sha }}
          path: focus-results
          merge-multiple: false

      - name: Aggregate eight surfaces fail-closed
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path

          expected = {
              "hero-dark-desktop",
              "hero-light-desktop",
              "cta-dark-desktop",
              "cta-light-desktop",
              "hero-dark-mobile-2x",
              "hero-light-mobile-2x",
              "cta-dark-mobile-2x",
              "cta-light-mobile-2x",
          }
          rows = []
          for path in Path("focus-results").rglob("benchmark.json"):
              report = json.loads(path.read_text())
              for scenario in report.get("scenarios", []):
                  paired = scenario.get("paired", {})
                  baseline = scenario.get("baseline", {})
                  candidate = scenario.get("candidate", {})
                  gpu_ratio = paired.get("gpuTotalFrameMs", {}).get("geometricMeanRatio")
                  wall_ratio = paired.get("wallMeanMs", {}).get("geometricMeanRatio")
                  baseline_gpu = baseline.get("gpuTotalFrameMs", {}).get("median")
                  candidate_gpu = candidate.get("gpuTotalFrameMs", {}).get("median")
                  if not all(
                      isinstance(value, (int, float)) and value > 0
                      for value in (gpu_ratio, wall_ratio, baseline_gpu, candidate_gpu)
                  ):
                      raise SystemExit(f"incomplete metrics in {scenario.get('name')}")
                  rows.append({
                      "name": scenario.get("name"),
                      "gpuRatio": gpu_ratio,
                      "instrumentedWallRatio": wall_ratio,
                      "baselineGpuMs": baseline_gpu,
                      "candidateGpuMs": candidate_gpu,
                  })

          names = {row["name"] for row in rows}
          if names != expected or len(rows) != 8:
              raise SystemExit(
                  f"fail-closed: expected {sorted(expected)}, received {sorted(names)} from {len(rows)} rows"
              )

          geometric = lambda key: math.exp(
              sum(math.log(row[key]) for row in rows) / len(rows)
          )
          geometric_gpu = geometric("gpuRatio")
          weighted_gpu = sum(row["candidateGpuMs"] for row in rows) / sum(
              row["baselineGpuMs"] for row in rows
          )
          geometric_wall = geometric("instrumentedWallRatio")
          worst_gpu = max(row["gpuRatio"] for row in rows)
          result = {
              "accepted": (
                  geometric_gpu <= 0.5
                  and weighted_gpu <= 0.5
                  and worst_gpu <= 1.03
              ),
              "geometricGpuRatio": geometric_gpu,
              "baselineWeightedGpuRatio": weighted_gpu,
              "geometricInstrumentedWallRatio": geometric_wall,
              "worstSurfaceGpuRatio": worst_gpu,
              "targetGpuRatio": 0.5,
              "scenarioCount": len(rows),
              "scenarios": sorted(rows, key=lambda row: row["name"]),
          }
          Path("final-gpu-proof.json").write_text(json.dumps(result, indent=2) + "\n")
          lines = [
              "# Final production GPU proof",
              "",
              f"- Verdict: **{'ACCEPT' if result['accepted'] else 'REJECT'}**",
              f"- Geometric GPU ratio: **{geometric_gpu:.4f}**",
              f"- Baseline-time-weighted GPU ratio: **{weighted_gpu:.4f}**",
              f"- GPU work reduction: **{(1 - weighted_gpu) * 100:.2f}%**",
              f"- Instrumented wall ratio: **{geometric_wall:.4f}**",
              f"- Worst surface GPU ratio: **{worst_gpu:.4f}**",
              "",
              "| Scenario | GPU ratio | Instrumented wall ratio | Baseline GPU ms | Candidate GPU ms |",
              "|---|---:|---:|---:|---:|",
          ]
          for row in result["scenarios"]:
              lines.append(
                  f"| {row['name']} | {row['gpuRatio']:.4f} | "
                  f"{row['instrumentedWallRatio']:.4f} | "
                  f"{row['baselineGpuMs']:.3f} | {row['candidateGpuMs']:.3f} |"
              )
          Path("final-gpu-proof.md").write_text("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY

      - name: Publish aggregate GPU proof
        if: always()
        run: |
          test ! -f final-gpu-proof.md \
            || cat final-gpu-proof.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload aggregate GPU proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-gpu-proof-${{ github.sha }}
          path: |
            final-gpu-proof.json
            final-gpu-proof.md
            focus-results
          if-no-files-found: error
          retention-days: 30

      - name: Enforce half-GPU target
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("final-gpu-proof.json")
          if not path.exists():
              raise SystemExit("final GPU proof is missing")
          result = json.loads(path.read_text())
          if result.get("accepted") is not True:
              raise SystemExit("half-GPU target not reached: " + json.dumps(result))
          PY
