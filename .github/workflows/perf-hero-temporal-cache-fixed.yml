name: Hero temporal cache with stable invalidation

on:
  push:
    branches:
      - perf/major-2x-hero-temporal-cache-fixed
  pull_request:
    branches:
      - perf/major-2x-hero-temporal-cache
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hero-temporal-cache-fixed-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 100

    steps:
      - name: Check out fixed temporal-cache experiment
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install candidate dependencies
        run: bun install --frozen-lockfile

      - name: Materialize current consolidated stack
        run: |
          bash perf/scripts/materialize-validated-stack.sh
          bunx biome format --write src
          git diff --binary \
            b3c926b88b4861d851075015c141c67f225517fb -- src \
            > /tmp/consolidated-stack.patch
          test -s /tmp/consolidated-stack.patch

      - name: Apply temporal cache and stable invalidation fix
        run: |
          base64 --decode \
            perf/experiments/apply-hero-temporal-interpolation-experiment.mjs.gz.b64 \
            | gzip --decompress \
            > /tmp/apply-hero-temporal-interpolation-experiment.mjs
          node /tmp/apply-hero-temporal-interpolation-experiment.mjs
          node perf/scripts/fix-hero-temporal-cache-state.mjs
          grep -q "temporalHeroSettingsKey" src/runtime/path-renderer.ts
          grep -q "temporalSettingsKey" src/rendering/webgl-resources.ts
          bunx biome format --write \
            perf/scripts/fix-hero-temporal-cache-state.mjs \
            src/rendering/shaders.ts \
            src/rendering/webgl-resources.ts \
            src/runtime/resource-manager.ts \
            src/runtime/draw-common.ts \
            src/runtime/path-renderer.ts
          bun run check
          bun run build
          bunx tsc -p tsconfig.perf.json --noEmit

      - name: Check out stack-only baseline
        uses: actions/checkout@v4
        with:
          ref: b3c926b88b4861d851075015c141c67f225517fb
          path: baseline

      - name: Install and materialize stack-only baseline
        run: |
          cd baseline
          bun install --frozen-lockfile
          git apply --whitespace=nowarn /tmp/consolidated-stack.patch
          bunx biome format --write src
          bun run check
          bun run build
          cd ..
          mkdir -p baseline/perf
          rm -rf baseline/perf/harness
          cp -R perf/harness baseline/perf/harness
          cp vite.perf.config.ts baseline/vite.perf.config.ts
          cp tsconfig.perf.json baseline/tsconfig.perf.json

      - name: Build deterministic harnesses
        run: |
          bunx vite build --config vite.perf.config.ts \
            --outDir "$GITHUB_WORKSPACE/perf-dist-candidate"
          cd baseline
          bunx tsc -p tsconfig.perf.json --noEmit
          bunx vite build --config vite.perf.config.ts \
            --outDir "$GITHUB_WORKSPACE/perf-dist-baseline"

      - name: Install visual-diff dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy scikit-image

      - name: Start deterministic servers
        run: |
          python -m http.server 4173 --bind 127.0.0.1 \
            --directory perf-dist-baseline >/tmp/baseline.log 2>&1 &
          echo $! >/tmp/baseline.pid
          python -m http.server 4174 --bind 127.0.0.1 \
            --directory perf-dist-candidate >/tmp/candidate.log 2>&1 &
          echo $! >/tmp/candidate.pid
          for port in 4173 4174; do
            for attempt in $(seq 1 100); do
              curl --fail --silent "http://127.0.0.1:${port}/" >/dev/null && break
              sleep 0.1
            done
            curl --fail --silent "http://127.0.0.1:${port}/" >/dev/null
          done

      - name: Run incremental paired Hero benchmark
        run: |
          bun perf/scripts/benchmark.mjs \
            --baseline http://127.0.0.1:4173 \
            --candidate http://127.0.0.1:4174 \
            --out perf-results \
            --focus hero \
            --repeats 2 \
            --frames 12 \
            --warmup-frames 8 \
            --profile-frames 8

      - name: Compare deterministic Hero screenshots
        id: visual
        continue-on-error: true
        run: |
          python perf/scripts/visual-diff.py \
            --baseline perf-results/screenshots/baseline \
            --candidate perf-results/screenshots/candidate \
            --out perf-results/visual

      - name: Evaluate wall, GPU and actual cache activation
        id: evaluation
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path

          report = json.loads(Path("perf-results/benchmark.json").read_text())
          wall = []
          gpu = []
          draws = []
          rows = []
          for scenario in report.get("scenarios", []):
              paired = scenario.get("paired", {})
              wr = paired.get("wallMeanMs", {}).get("geometricMeanRatio")
              gr = paired.get("gpuTotalFrameMs", {}).get("geometricMeanRatio")
              baseline_draws = scenario.get("baseline", {}).get("glPerFrame", {}).get("drawArrays", {}).get("median")
              candidate_draws = scenario.get("candidate", {}).get("glPerFrame", {}).get("drawArrays", {}).get("median")
              draw_ratio = (
                  candidate_draws / baseline_draws
                  if isinstance(candidate_draws, (int, float))
                  and isinstance(baseline_draws, (int, float))
                  and baseline_draws > 0
                  else None
              )
              if isinstance(wr, (int, float)) and wr > 0:
                  wall.append(wr)
              if isinstance(gr, (int, float)) and gr > 0:
                  gpu.append(gr)
              if isinstance(draw_ratio, (int, float)) and draw_ratio > 0:
                  draws.append(draw_ratio)
              rows.append({
                  "name": scenario.get("name"),
                  "wallRatio": wr,
                  "gpuRatio": gr,
                  "drawArraysRatio": draw_ratio,
                  "baselineDrawArrays": baseline_draws,
                  "candidateDrawArrays": candidate_draws,
                  "baselineGpuByStage": scenario.get("baseline", {}).get("gpuByStage", {}),
                  "candidateGpuByStage": scenario.get("candidate", {}).get("gpuByStage", {}),
              })

          geometric = lambda values: math.exp(sum(map(math.log, values)) / len(values))
          result = {
              "wallRatioVsConsolidatedStack": geometric(wall) if wall else None,
              "gpuRatioVsConsolidatedStack": geometric(gpu) if gpu else None,
              "drawArraysRatioVsConsolidatedStack": geometric(draws) if draws else None,
              "cacheActivated": bool(draws) and geometric(draws) < 0.95,
              "estimatedAdditionalPathMemoryMiBDesktop": 14.5,
              "temporalAnchorRateHz": 30,
              "scenarios": rows,
          }
          Path("perf-results/hero-temporal-cache-fixed-evaluation.json").write_text(
              json.dumps(result, indent=2) + "\n"
          )
          print(json.dumps(result, indent=2))
          if not result["cacheActivated"]:
              raise SystemExit("Temporal cache still did not reduce recurring draw calls")
          PY

      - name: Publish summary
        if: always()
        run: |
          test ! -f perf-results/benchmark.md || cat perf-results/benchmark.md >> "$GITHUB_STEP_SUMMARY"
          test ! -f perf-results/visual/visual-diff.md || cat perf-results/visual/visual-diff.md >> "$GITHUB_STEP_SUMMARY"
          if [ -f perf-results/hero-temporal-cache-fixed-evaluation.json ]; then
            printf '\n```json\n' >> "$GITHUB_STEP_SUMMARY"
            cat perf-results/hero-temporal-cache-fixed-evaluation.json >> "$GITHUB_STEP_SUMMARY"
            printf '```\n' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload measurements and exact source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hero-temporal-cache-fixed-${{ github.sha }}
          path: |
            perf-results
            src
            baseline/src
          if-no-files-found: error
          retention-days: 30

      - name: Stop servers
        if: always()
        run: |
          test ! -f /tmp/baseline.pid || kill "$(cat /tmp/baseline.pid)" 2>/dev/null || true
          test ! -f /tmp/candidate.pid || kill "$(cat /tmp/candidate.pid)" 2>/dev/null || true

      - name: Enforce cache activation
        if: always() && steps.evaluation.outcome == 'failure'
        run: exit 1

      - name: Enforce visual parity
        if: always() && steps.visual.outcome == 'failure'
        run: exit 1
