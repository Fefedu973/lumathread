name: Materialize validated final renderer

on:
  push:
    branches:
      - perf/visual-parity-renderer-final
    paths:
      - .github/workflows/materialize-final-renderer.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: materialize-final-renderer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out final branch
        uses: actions/checkout@v4
        with:
          ref: perf/visual-parity-renderer-final
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download exact validated 10 Hz candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/final-evidence
          mkdir -p /tmp/final-evidence
          gh run download 32371973397 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'cta-rate-selection-*' \
            --dir /tmp/final-evidence
          source_dir=$(find /tmp/final-evidence \
            -type d -path '*/cta-temporal-10hz-*/candidate/materialized-src' \
            -print -quit)
          test -n "$source_dir"
          test -f "$source_dir/runtime/path-renderer.ts"
          test -f "$source_dir/rendering/shaders.ts"
          rm -rf src
          cp -R "$source_dir" src

      - name: Verify exact selected source tree
        run: |
          actual=$(cd src \
            && find . -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sha256sum \
            | cut -d' ' -f1)
          expected='205dfcef3e5f73dd8e0dd27bafadf12a04f6ee244587616d42c82ab3dbd91728'
          printf 'actual=%s\nexpected=%s\n' "$actual" "$expected"
          test "$actual" = "$expected"

      - name: Validate materialized production source
        run: |
          bun run check
          bun run build
          bunx tsc -p tsconfig.perf.json --noEmit

      - name: Commit the benchmarked renderer source
        run: |
          if git diff --quiet -- src; then
            echo 'Validated source is already materialized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          git commit -m 'perf: materialize validated final renderer source'
          git push origin HEAD:perf/visual-parity-renderer-final
