name: Final production wall and FPS proof

on:
  push:
    branches:
      - perf/final-production-renderer
    paths:
      - src/**
      - perf/final-production-renderer.json
      - .github/workflows/final-production-wall-proof.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: final-production-wall-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Uninstrumented wall (${{ matrix.surface }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        surface:
          - hero-dark-desktop
          - hero-light-desktop
          - cta-dark-desktop
          - cta-light-desktop
          - hero-dark-mobile-2x
          - hero-light-mobile-2x
          - cta-dark-mobile-2x
          - cta-light-mobile-2x

    steps:
      - name: Check out exact materialized candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Assert final renderer markers
        run: |
          test -f perf/final-production-renderer.json
          grep -Fq 'temporalAnchorRateHz = root.motionMode === "anchored" ? 10 : 15' \
            src/runtime/path-renderer.ts
          grep -Fq 'shouldUseTemporalPathCache' src/runtime/path-renderer.ts

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install and validate candidate
        run: |
          bun install --frozen-lockfile
          bun run check
          bun run build
          bunx tsc -p tsconfig.perf.json --noEmit

      - name: Import pinned uninstrumented benchmark harness
        run: |
          readonly WALL_PROOF_SHA="f975c472d2791f27ce1f0ed9f8c40fae71cd9efe"
          git fetch --no-tags origin "$WALL_PROOF_SHA"
          git show "$WALL_PROOF_SHA:perf/scripts/apply-production-wall-harness.mjs" \
            > perf/scripts/apply-production-wall-harness.mjs
          git show "$WALL_PROOF_SHA:perf/scripts/benchmark-production-wall.mjs" \
            > perf/scripts/benchmark-production-wall.mjs
          git show "$WALL_PROOF_SHA:perf/scripts/patch-original-debug-stepping.py" \
            > /tmp/patch-original-debug-stepping.py
          node perf/scripts/apply-production-wall-harness.mjs
          bunx biome format --write \
            perf/harness/index.html \
            perf/harness/gl-profiler.js \
            perf/scripts/benchmark-suite.mjs \
            perf/scripts/apply-production-wall-harness.mjs \
            perf/scripts/benchmark-production-wall.mjs

      - name: Check out frozen original renderer
        uses: actions/checkout@v4
        with:
          ref: 7f4289aa3ff640f479701ceec0b0d790af037692
          path: baseline

      - name: Install original and inject the identical uninstrumented harness
        run: |
          cd baseline
          bun install --frozen-lockfile
          python /tmp/patch-original-debug-stepping.py \
            src/runtime/use-hero-wave-renderer.ts
          bunx biome format --write src/runtime/use-hero-wave-renderer.ts
          bun run check
          cd ..
          mkdir -p baseline/perf
          rm -rf baseline/perf/harness
          cp -R perf/harness baseline/perf/harness
          cp vite.perf.config.ts baseline/vite.perf.config.ts
          cp tsconfig.perf.json baseline/tsconfig.perf.json

      - name: Build candidate and original harnesses
        run: |
          bunx vite build --config vite.perf.config.ts \
            --outDir "$GITHUB_WORKSPACE/perf-dist-candidate"
          cd baseline
          bunx tsc -p tsconfig.perf.json --noEmit
          bunx vite build --config vite.perf.config.ts \
            --outDir "$GITHUB_WORKSPACE/perf-dist-baseline"

      - name: Start deterministic servers
        run: |
          python -m http.server 4173 --bind 127.0.0.1 \
            --directory perf-dist-baseline >/tmp/baseline.log 2>&1 &
          echo $! >/tmp/baseline.pid
          python -m http.server 4174 --bind 127.0.0.1 \
            --directory perf-dist-candidate >/tmp/candidate.log 2>&1 &
          echo $! >/tmp/candidate.pid
          for port in 4173 4174; do
            for attempt in $(seq 1 100); do
              curl --fail --silent "http://127.0.0.1:${port}/" >/dev/null && break
              sleep 0.1
            done
            curl --fail --silent "http://127.0.0.1:${port}/" >/dev/null
          done

      - name: Run long paired production-wall benchmark
        run: |
          bun perf/scripts/benchmark-production-wall.mjs \
            --baseline http://127.0.0.1:4173 \
            --candidate http://127.0.0.1:4174 \
            --out perf-results \
            --surface "${{ matrix.surface }}" \
            --repeats 4 \
            --frames 60 \
            --warmup-frames 30 \
            --profile-frames 1

      - name: Verify all profiler overhead is absent
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("perf-results/production-wall.json").read_text())
          scenarios = report.get("scenarios", [])
          if len(scenarios) != 1:
              raise SystemExit(f"expected one scenario, found {len(scenarios)}")
          runs = []
          for side in ("baseline", "candidate"):
              runs.extend(scenarios[0].get("raw", {}).get(side, []))
          if len(runs) != 8:
              raise SystemExit(f"expected eight paired side-runs, found {len(runs)}")
          errors = []
          for index, run in enumerate(runs):
              profile = run.get("gl", {}).get("gpuProfile")
              if profile and profile.get("supported"):
                  errors.append(f"run {index}: per-draw GPU queries remained enabled")
              nonzero = {
                  key: value
                  for key, value in run.get("glPerFrame", {}).items()
                  if isinstance(value, (int, float)) and abs(value) > 1e-12
              }
              if nonzero:
                  errors.append(f"run {index}: GL wrappers remained active: {nonzero}")
          if errors:
              raise SystemExit("\n".join(errors))
          print(json.dumps({"runs": len(runs), "profilerOverhead": False}, indent=2))
          PY

      - name: Publish surface result
        if: always()
        run: |
          test ! -f perf-results/production-wall.md \
            || cat perf-results/production-wall.md >> "$GITHUB_STEP_SUMMARY"

      - name: Collect exact evidence
        if: always()
        run: |
          mkdir -p perf-results/server-logs perf-results/candidate
          cp /tmp/baseline.log perf-results/server-logs/ 2>/dev/null || true
          cp /tmp/candidate.log perf-results/server-logs/ 2>/dev/null || true
          cp perf/final-production-renderer.json perf-results/candidate/
          git diff --binary 7f4289aa3ff640f479701ceec0b0d790af037692 -- src \
            > perf-results/candidate/final-production-renderer.patch

      - name: Upload surface proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-wall-${{ matrix.surface }}-${{ github.sha }}
          path: perf-results
          if-no-files-found: error
          retention-days: 30

      - name: Stop deterministic servers
        if: always()
        run: |
          test ! -f /tmp/baseline.pid || kill "$(cat /tmp/baseline.pid)" 2>/dev/null || true
          test ! -f /tmp/candidate.pid || kill "$(cat /tmp/candidate.pid)" 2>/dev/null || true

  aggregate:
    name: Aggregate final uncapped FPS target
    needs: benchmark
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Download all eight surface proofs
        uses: actions/download-artifact@v4
        with:
          pattern: final-wall-*-${{ github.sha }}
          path: surface-results
          merge-multiple: false

      - name: Aggregate production wall ratios fail-closed
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path

          expected = {
              "hero-dark-desktop",
              "hero-light-desktop",
              "cta-dark-desktop",
              "cta-light-desktop",
              "hero-dark-mobile-2x",
              "hero-light-mobile-2x",
              "cta-dark-mobile-2x",
              "cta-light-mobile-2x",
          }
          rows = []
          for report_path in Path("surface-results").rglob("production-wall.json"):
              report = json.loads(report_path.read_text())
              scenarios = report.get("scenarios", [])
              if len(scenarios) != 1:
                  raise SystemExit(f"{report_path}: expected one scenario")
              scenario = scenarios[0]
              paired = scenario.get("paired", {})
              wall = paired.get("wallMeanMs", {}).get("geometricMeanRatio")
              submit = paired.get("submitMeanMs", {}).get("geometricMeanRatio")
              drain = paired.get("drainMeanMs", {}).get("geometricMeanRatio")
              baseline_wall = scenario.get("baseline", {}).get("wallMeanMs", {}).get("median")
              candidate_wall = scenario.get("candidate", {}).get("wallMeanMs", {}).get("median")
              if not all(
                  isinstance(value, (int, float)) and value > 0
                  for value in (wall, submit, drain, baseline_wall, candidate_wall)
              ):
                  raise SystemExit(f"{report_path}: incomplete positive wall metrics")
              rows.append({
                  "name": scenario.get("name"),
                  "wallRatio": wall,
                  "fpsMultiplier": 1 / wall,
                  "submitRatio": submit,
                  "drainRatio": drain,
                  "baselineWallMs": baseline_wall,
                  "candidateWallMs": candidate_wall,
                  "baselineFps": scenario.get("baseline", {}).get("fps", {}).get("median"),
                  "candidateFps": scenario.get("candidate", {}).get("fps", {}).get("median"),
              })

          names = {row["name"] for row in rows}
          if names != expected or len(rows) != 8:
              raise SystemExit(
                  f"fail-closed: expected {sorted(expected)}, received {sorted(names)} from {len(rows)} reports"
              )

          geometric = lambda key: math.exp(
              sum(math.log(row[key]) for row in rows) / len(rows)
          )
          wall_ratio = geometric("wallRatio")
          weighted_wall = sum(row["candidateWallMs"] for row in rows) / sum(
              row["baselineWallMs"] for row in rows
          )
          submit_ratio = geometric("submitRatio")
          drain_ratio = geometric("drainRatio")
          worst_wall = max(row["wallRatio"] for row in rows)
          result = {
              "accepted": (
                  wall_ratio <= 0.5
                  and weighted_wall <= 0.5
                  and worst_wall <= 0.75
              ),
              "geometricWallRatio": wall_ratio,
              "baselineTimeWeightedWallRatio": weighted_wall,
              "equivalentGeometricFpsMultiplier": 1 / wall_ratio,
              "equivalentWeightedFpsMultiplier": 1 / weighted_wall,
              "geometricSubmitRatio": submit_ratio,
              "geometricDrainRatio": drain_ratio,
              "worstSurfaceWallRatio": worst_wall,
              "targetWallRatio": 0.5,
              "scenarioCount": len(rows),
              "scenarios": sorted(rows, key=lambda row: row["name"]),
          }
          Path("final-wall-proof.json").write_text(json.dumps(result, indent=2) + "\n")
          lines = [
              "# Final production wall/FPS proof",
              "",
              f"- Verdict: **{'ACCEPT' if result['accepted'] else 'REJECT'}**",
              f"- Geometric wall ratio: **{wall_ratio:.4f}**",
              f"- Baseline-time-weighted wall ratio: **{weighted_wall:.4f}**",
              f"- Equivalent geometric FPS multiplier: **{1 / wall_ratio:.2f}×**",
              f"- Equivalent weighted FPS multiplier: **{1 / weighted_wall:.2f}×**",
              f"- Submit ratio: **{submit_ratio:.4f}**",
              f"- Drain ratio: **{drain_ratio:.4f}**",
              f"- Worst surface wall ratio: **{worst_wall:.4f}**",
              "",
              "| Scenario | Wall ratio | FPS multiplier | Submit ratio | Drain ratio | Baseline FPS | Candidate FPS |",
              "|---|---:|---:|---:|---:|---:|---:|",
          ]
          for row in result["scenarios"]:
              lines.append(
                  f"| {row['name']} | {row['wallRatio']:.4f} | {row['fpsMultiplier']:.2f}× | "
                  f"{row['submitRatio']:.4f} | {row['drainRatio']:.4f} | "
                  f"{row['baselineFps']:.1f} | {row['candidateFps']:.1f} |"
              )
          Path("final-wall-proof.md").write_text("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY

      - name: Publish aggregate FPS proof
        if: always()
        run: |
          test ! -f final-wall-proof.md \
            || cat final-wall-proof.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload aggregate FPS proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-wall-proof-${{ github.sha }}
          path: |
            final-wall-proof.json
            final-wall-proof.md
            surface-results
          if-no-files-found: error
          retention-days: 30

      - name: Enforce two-times uncapped FPS target
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("final-wall-proof.json")
          if not path.exists():
              raise SystemExit("final wall proof is missing")
          result = json.loads(path.read_text())
          if result.get("accepted") is not True:
              raise SystemExit("2x FPS target not reached: " + json.dumps(result))
          PY
