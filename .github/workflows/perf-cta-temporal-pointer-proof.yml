name: CTA temporal cache pointer-transition proof

on:
  push:
    branches:
      - perf/major-2x-cta-temporal-pointer-proof
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cta-temporal-pointer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Check out pointer-transition candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install candidate dependencies
        run: bun install --frozen-lockfile

      - name: Materialize final stack and candidate selector
        run: |
          bash perf/scripts/materialize-final-temporal-stack.sh
          git diff --binary \
            b3c926b88b4861d851075015c141c67f225517fb -- src \
            > /tmp/final-stack.patch
          test -s /tmp/final-stack.patch
          node perf/scripts/apply-cta-temporal-idle-experiment.mjs
          bunx biome format --write \
            src/runtime/path-renderer.ts \
            perf/scripts/apply-cta-temporal-idle-experiment.mjs \
            perf/scripts/capture-cta-pointer-transitions.mjs
          bun run check
          bun run build
          bunx tsc -p tsconfig.perf.json --noEmit

      - name: Check out identical final-stack baseline
        uses: actions/checkout@v4
        with:
          ref: b3c926b88b4861d851075015c141c67f225517fb
          path: baseline

      - name: Install and materialize baseline
        run: |
          cd baseline
          bun install --frozen-lockfile
          git apply --whitespace=nowarn /tmp/final-stack.patch
          bunx biome format --write src
          bun run check
          bun run build
          cd ..
          mkdir -p baseline/perf
          rm -rf baseline/perf/harness
          cp -R perf/harness baseline/perf/harness
          cp vite.perf.config.ts baseline/vite.perf.config.ts
          cp tsconfig.perf.json baseline/tsconfig.perf.json

      - name: Build deterministic harnesses
        run: |
          bunx vite build --config vite.perf.config.ts \
            --outDir "$GITHUB_WORKSPACE/perf-dist-candidate"
          cd baseline
          bunx tsc -p tsconfig.perf.json --noEmit
          bunx vite build --config vite.perf.config.ts \
            --outDir "$GITHUB_WORKSPACE/perf-dist-baseline"

      - name: Install visual comparison dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy scikit-image

      - name: Start deterministic servers
        run: |
          python -m http.server 4173 --bind 127.0.0.1 \
            --directory perf-dist-baseline >/tmp/baseline.log 2>&1 &
          echo $! >/tmp/baseline.pid
          python -m http.server 4174 --bind 127.0.0.1 \
            --directory perf-dist-candidate >/tmp/candidate.log 2>&1 &
          echo $! >/tmp/candidate.pid
          for port in 4173 4174; do
            for attempt in $(seq 1 100); do
              curl --fail --silent "http://127.0.0.1:${port}/" >/dev/null && break
              sleep 0.1
            done
            curl --fail --silent "http://127.0.0.1:${port}/" >/dev/null
          done

      - name: Capture idle, pointer-enter, movement and recovery frames
        run: |
          bun perf/scripts/capture-cta-pointer-transitions.mjs \
            --baseline http://127.0.0.1:4173 \
            --candidate http://127.0.0.1:4174 \
            --out pointer-results

      - name: Compare all pointer-transition captures
        id: visual
        continue-on-error: true
        run: |
          python perf/scripts/visual-diff.py \
            --baseline pointer-results/screenshots/baseline \
            --candidate pointer-results/screenshots/candidate \
            --out pointer-results/visual

      - name: Verify immediate exact fallback and cache recovery
        id: behavior
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("pointer-results/pointer-transition-metadata.json").read_text()
          )
          by_key = {
              (entry["surface"], entry["side"]): entry
              for entry in payload.get("results", [])
          }
          surfaces = {
              "cta-dark-desktop",
              "cta-light-desktop",
              "cta-dark-mobile-2x",
              "cta-light-mobile-2x",
          }
          rows = []
          errors = []
          def counter(entry, phase, name):
              return (
                  entry.get(phase, {})
                  .get("counters", {})
                  .get(name, 0)
              )
          for surface in sorted(surfaces):
              baseline = by_key.get((surface, "baseline"))
              candidate = by_key.get((surface, "candidate"))
              if not baseline or not candidate:
                  errors.append(f"missing baseline/candidate metadata for {surface}")
                  continue
              if baseline.get("errors") or candidate.get("errors"):
                  errors.append(
                      f"renderer errors for {surface}: {baseline.get('errors')} / {candidate.get('errors')}"
                  )
              b_enter = counter(baseline, "enterCounters", "drawArraysInstanced")
              c_enter = counter(candidate, "enterCounters", "drawArraysInstanced")
              b_active = counter(baseline, "activeCounters", "drawArraysInstanced")
              c_active = counter(candidate, "activeCounters", "drawArraysInstanced")
              b_leave = counter(baseline, "leaveCounters", "drawArraysInstanced")
              c_leave = counter(candidate, "leaveCounters", "drawArraysInstanced")
              enter_ratio = c_enter / b_enter if b_enter > 0 else None
              active_ratio = c_active / b_active if b_active > 0 else None
              leave_ratio = c_leave / b_leave if b_leave > 0 else None
              rows.append({
                  "surface": surface,
                  "enterDrawRatio": enter_ratio,
                  "activeDrawRatio": active_ratio,
                  "recoveryDrawRatio": leave_ratio,
              })
              if enter_ratio is None or enter_ratio < 0.8:
                  errors.append(
                      f"{surface}: cache did not fall back immediately on pointer enter ({enter_ratio})"
                  )
              if active_ratio is None or active_ratio < 0.8:
                  errors.append(
                      f"{surface}: cache remained active during pointer movement ({active_ratio})"
                  )
              if leave_ratio is None or leave_ratio > 0.85:
                  errors.append(
                      f"{surface}: cache did not resume after pointer exit ({leave_ratio})"
                  )
          result = {"rows": rows, "errors": errors}
          Path("pointer-results/pointer-transition-behavior.json").write_text(
              json.dumps(result, indent=2) + "\n"
          )
          print(json.dumps(result, indent=2))
          if errors:
              raise SystemExit("\n".join(errors))
          PY

      - name: Publish pointer-transition summary
        if: always()
        run: |
          test ! -f pointer-results/visual/visual-diff.md \
            || cat pointer-results/visual/visual-diff.md >> "$GITHUB_STEP_SUMMARY"
          if [ -f pointer-results/pointer-transition-behavior.json ]; then
            printf '\n```json\n' >> "$GITHUB_STEP_SUMMARY"
            cat pointer-results/pointer-transition-behavior.json >> "$GITHUB_STEP_SUMMARY"
            printf '```\n' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Collect exact evidence
        if: always()
        run: |
          mkdir -p pointer-results/candidate pointer-results/server-logs
          cp /tmp/final-stack.patch pointer-results/candidate/ 2>/dev/null || true
          cp perf/materialized-final-temporal-stack.txt pointer-results/candidate/ 2>/dev/null || true
          cp /tmp/baseline.log pointer-results/server-logs/ 2>/dev/null || true
          cp /tmp/candidate.log pointer-results/server-logs/ 2>/dev/null || true
          cp -R src pointer-results/candidate/materialized-src

      - name: Upload pointer-transition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cta-temporal-pointer-proof-${{ github.sha }}
          path: pointer-results
          if-no-files-found: error
          retention-days: 30

      - name: Stop deterministic servers
        if: always()
        run: |
          test ! -f /tmp/baseline.pid || kill "$(cat /tmp/baseline.pid)" 2>/dev/null || true
          test ! -f /tmp/candidate.pid || kill "$(cat /tmp/candidate.pid)" 2>/dev/null || true

      - name: Enforce pointer behavior
        if: always() && steps.behavior.outcome == 'failure'
        run: exit 1

      - name: Enforce visual parity
        if: always() && steps.visual.outcome == 'failure'
        run: exit 1
