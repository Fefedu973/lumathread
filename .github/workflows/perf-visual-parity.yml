name: Renderer performance and visual parity

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renderer-perf-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  source-export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4

      - name: Upload candidate source tree
        uses: actions/upload-artifact@v4
        with:
          name: candidate-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: .
          include-hidden-files: true
          retention-days: 1

  benchmark:
    name: benchmark (${{ matrix.experiment }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        experiment:
          - noop
          - specialized-viewport
          - persistent-framebuffers
          - persistent-framebuffers-specialized-viewport
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install candidate dependencies
        run: bun install --frozen-lockfile

      - name: Apply paired protocol and isolated renderer experiment
        shell: bash
        run: |
          cat perf/experiments/persistent-framebuffers-paired-benchmark.patch.b64.* \
            | tr -d "\n" \
            | base64 --decode \
            > /tmp/persistent-framebuffers-paired-benchmark.patch
          git apply --whitespace=nowarn \
            /tmp/persistent-framebuffers-paired-benchmark.patch
          experiment="${{ matrix.experiment }}"
          case "$experiment" in
            persistent-framebuffers)
              node perf/scripts/apply-persistent-glass-framebuffers-experiment.mjs
              ;;
            persistent-framebuffers-specialized-viewport)
              node perf/scripts/apply-persistent-glass-framebuffers-experiment.mjs
              node perf/scripts/apply-renderer-experiment.mjs specialized-viewport
              ;;
            *)
              node perf/scripts/apply-renderer-experiment.mjs "$experiment"
              ;;
          esac
          bunx biome format --write \
            perf/harness/gl-profiler.js \
            perf/scripts/apply-renderer-experiment.mjs \
            perf/scripts/apply-persistent-glass-framebuffers-experiment.mjs \
            perf/scripts/benchmark.mjs \
            perf/scripts/benchmark-suite.mjs \
            src/rendering/shaders.ts \
            src/rendering/glass-mask.ts \
            src/rendering/webgl-resources.ts \
            src/runtime/resource-manager.ts \
            src/runtime/glass-terrain-renderer.ts

      - name: Validate candidate and harness types
        run: |
          bun run check
          bun run build
          bunx tsc -p tsconfig.perf.json --noEmit

      - name: Check out frozen baseline
        uses: actions/checkout@v4
        with:
          ref: 7f4289aa3ff640f479701ceec0b0d790af037692
          path: baseline

      - name: Install baseline dependencies and inject the same harness
        run: |
          mkdir -p baseline/perf
          rm -rf baseline/perf/harness
          cp -R perf/harness baseline/perf/harness
          cp vite.perf.config.ts baseline/vite.perf.config.ts
          cp tsconfig.perf.json baseline/tsconfig.perf.json
          cd baseline
          bun install --frozen-lockfile

      - name: Build baseline and candidate harnesses
        run: |
          bunx vite build \
            --config vite.perf.config.ts \
            --outDir "$GITHUB_WORKSPACE/perf-dist-candidate"
          cd baseline
          bunx tsc -p tsconfig.perf.json --noEmit
          bunx vite build \
            --config vite.perf.config.ts \
            --outDir "$GITHUB_WORKSPACE/perf-dist-baseline"

      - name: Install visual diff dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy scikit-image

      - name: Start deterministic static servers
        run: |
          python -m http.server 4173 \
            --bind 127.0.0.1 \
            --directory perf-dist-baseline > /tmp/lumathread-baseline-server.log 2>&1 &
          echo $! > /tmp/lumathread-baseline-server.pid
          python -m http.server 4174 \
            --bind 127.0.0.1 \
            --directory perf-dist-candidate > /tmp/lumathread-candidate-server.log 2>&1 &
          echo $! > /tmp/lumathread-candidate-server.pid
          for port in 4173 4174; do
            for attempt in $(seq 1 50); do
              if curl --fail --silent "http://127.0.0.1:${port}/" >/dev/null; then
                break
              fi
              sleep 0.1
            done
            curl --fail --silent "http://127.0.0.1:${port}/" >/dev/null
          done

      - name: Run fixed-frame A/B renderer benchmarks and captures
        run: |
          bun perf/scripts/benchmark.mjs \
            --baseline http://127.0.0.1:4173 \
            --candidate http://127.0.0.1:4174 \
            --out perf-results \
            --focus cta \
            --repeats 5 \
            --frames 36 \
            --warmup-frames 20 \
            --profile-frames 8

      - name: Compare deterministic screenshots
        id: visual
        continue-on-error: true
        run: |
          python perf/scripts/visual-diff.py \
            --baseline perf-results/screenshots/baseline \
            --candidate perf-results/screenshots/candidate \
            --out perf-results/visual

      - name: Publish benchmark summary
        if: always()
        run: |
          printf '## Experiment: %s\n\n' "${{ matrix.experiment }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f perf-results/benchmark.md ]; then
            cat perf-results/benchmark.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f perf-results/visual/visual-diff.md ]; then
            printf '\n' >> "$GITHUB_STEP_SUMMARY"
            cat perf-results/visual/visual-diff.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Collect server logs
        if: always()
        run: |
          mkdir -p perf-results/server-logs
          cp /tmp/lumathread-baseline-server.log perf-results/server-logs/ 2>/dev/null || true
          cp /tmp/lumathread-candidate-server.log perf-results/server-logs/ 2>/dev/null || true

      - name: Upload raw metrics, captures, diffs and candidate sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renderer-perf-${{ matrix.experiment }}-${{ github.sha }}
          path: |
            perf-results
            perf/harness/gl-profiler.js
            perf/scripts/apply-persistent-glass-framebuffers-experiment.mjs
            perf/scripts/benchmark.mjs
            perf/scripts/benchmark-suite.mjs
            src/rendering/shaders.ts
            src/rendering/glass-mask.ts
            src/rendering/webgl-resources.ts
            src/runtime/resource-manager.ts
            src/runtime/glass-terrain-renderer.ts
          if-no-files-found: warn
          retention-days: 30

      - name: Stop static servers
        if: always()
        run: |
          for pidfile in \
            /tmp/lumathread-baseline-server.pid \
            /tmp/lumathread-candidate-server.pid; do
            if [ -f "$pidfile" ]; then
              kill "$(cat "$pidfile")" 2>/dev/null || true
            fi
          done

      - name: Enforce visual parity gate
        if: always() && steps.visual.outcome == 'failure'
        run: exit 1
