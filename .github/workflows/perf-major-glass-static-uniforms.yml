name: Incremental glass static-uniform cache on final stack

on:
  push:
    branches:
      - perf/major-2x-glass-static-uniforms
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glass-static-uniforms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 100

    steps:
      - name: Check out glass-uniform experiment
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install candidate dependencies
        run: bun install --frozen-lockfile

      - name: Fetch and apply the exact final stack to candidate
        run: |
          git fetch origin \
            perf/major-2x-final-stack-direct:refs/remotes/origin/perf/major-2x-final-stack-direct
          git show \
            origin/perf/major-2x-final-stack-direct:perf/scripts/apply-final-stack-experiment.sh \
            > /tmp/apply-final-stack-experiment.sh
          bash /tmp/apply-final-stack-experiment.sh .
          node perf/scripts/apply-glass-static-uniform-cache.mjs

      - name: Format and validate candidate
        run: |
          bunx biome format --write \
            src/rendering/glass-mask.ts \
            src/rendering/profile-textures.ts \
            src/rendering/shaders.ts \
            src/rendering/webgl-resources.ts \
            src/runtime/path-renderer.ts \
            src/runtime/use-hero-wave-renderer.ts \
            src/runtime/glass-terrain-renderer.ts \
            src/runtime/resource-manager.ts \
            src/runtime/draw-common.ts \
            perf/harness/gl-profiler.js \
            perf/scripts/apply-glass-static-uniform-cache.mjs \
            perf/scripts/benchmark-core.mjs \
            perf/scripts/benchmark-suite.mjs \
            perf/scripts/benchmark.mjs
          bun run check
          bun run build
          bunx tsc -p tsconfig.perf.json --noEmit

      - name: Check out the exact original renderer baseline
        uses: actions/checkout@v4
        with:
          ref: b3c926b88b4861d851075015c141c67f225517fb
          path: baseline

      - name: Install baseline dependencies
        working-directory: baseline
        run: bun install --frozen-lockfile

      - name: Apply the exact final stack without glass-uniform caching
        run: |
          mkdir -p baseline/perf/scripts
          cp perf/scripts/apply-glass-effect-bounds-experiment.mjs \
            baseline/perf/scripts/apply-glass-effect-bounds-experiment.mjs
          bash /tmp/apply-final-stack-experiment.sh baseline
          rm -rf baseline/perf/harness
          cp -R perf/harness baseline/perf/harness
          cp vite.perf.config.ts baseline/vite.perf.config.ts
          cp tsconfig.perf.json baseline/tsconfig.perf.json

      - name: Format and validate final-stack baseline
        working-directory: baseline
        run: |
          bunx biome format --write \
            src/rendering/glass-mask.ts \
            src/rendering/profile-textures.ts \
            src/rendering/shaders.ts \
            src/rendering/webgl-resources.ts \
            src/runtime/path-renderer.ts \
            src/runtime/use-hero-wave-renderer.ts \
            src/runtime/glass-terrain-renderer.ts \
            src/runtime/resource-manager.ts \
            src/runtime/draw-common.ts
          bun run check
          bun run build
          bunx tsc -p tsconfig.perf.json --noEmit

      - name: Build baseline and candidate harnesses
        run: |
          bunx vite build --config vite.perf.config.ts \
            --outDir "$GITHUB_WORKSPACE/perf-dist-candidate"
          cd baseline
          bunx vite build --config vite.perf.config.ts \
            --outDir "$GITHUB_WORKSPACE/perf-dist-baseline"

      - name: Install visual-diff dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy scikit-image

      - name: Start deterministic servers
        run: |
          python -m http.server 4173 --bind 127.0.0.1 \
            --directory perf-dist-baseline >/tmp/baseline.log 2>&1 &
          echo $! >/tmp/baseline.pid
          python -m http.server 4174 --bind 127.0.0.1 \
            --directory perf-dist-candidate >/tmp/candidate.log 2>&1 &
          echo $! >/tmp/candidate.pid
          for port in 4173 4174; do
            for attempt in $(seq 1 100); do
              curl --fail --silent "http://127.0.0.1:${port}/" >/dev/null && break
              sleep 0.1
            done
            curl --fail --silent "http://127.0.0.1:${port}/" >/dev/null
          done

      - name: Run incremental paired CTA benchmark
        run: |
          bun perf/scripts/benchmark.mjs \
            --baseline http://127.0.0.1:4173 \
            --candidate http://127.0.0.1:4174 \
            --out perf-results \
            --focus cta \
            --repeats 3 \
            --frames 12 \
            --warmup-frames 7 \
            --profile-frames 6

      - name: Prove exactly one full renderer frame
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("perf-results/benchmark.json").read_text())
          failures = []
          for scenario in report.get("scenarios", []):
              name = scenario.get("name", "unknown")
              for build in ("baseline", "candidate"):
                  for index, run in enumerate(scenario.get("raw", {}).get(build, [])):
                      stages = run.get("gpu", {}).get("byStage", {})
                      for stage in ("path-composite", "glass-composite"):
                          value = stages.get(stage, {}).get("countPerFrame")
                          if value is None or abs(value - 1) > 1e-9:
                              failures.append(
                                  f"{name}/{build}/{index}/{stage}: expected 1, got {value}"
                              )
                      finish = run.get("glPerFrame", {}).get("finish")
                      if finish is None or abs(finish - 1) > 1e-9:
                          failures.append(
                              f"{name}/{build}/{index}/finish: expected 1, got {finish}"
                          )
          output = {"passed": not failures, "failures": failures}
          Path("perf-results/glass-uniform-validation.json").write_text(
              json.dumps(output, indent=2) + "\n"
          )
          if failures:
              raise SystemExit("\n".join(failures))
          PY

      - name: Compare glass-uniform output against final stack
        id: visual
        continue-on-error: true
        run: |
          python perf/scripts/visual-diff.py \
            --baseline perf-results/screenshots/baseline \
            --candidate perf-results/screenshots/candidate \
            --out perf-results/visual

      - name: Calculate incremental ratios
        if: always()
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          path = Path("perf-results/benchmark.json")
          if not path.exists():
              raise SystemExit(0)
          report = json.loads(path.read_text())
          wall = []
          gpu = []
          rows = []
          for scenario in report.get("scenarios", []):
              paired = scenario.get("paired", {})
              wr = paired.get("wallMeanMs", {}).get("geometricMeanRatio")
              gr = paired.get("gpuTotalFrameMs", {}).get("geometricMeanRatio")
              if isinstance(wr, (int, float)) and wr > 0:
                  wall.append(wr)
              if isinstance(gr, (int, float)) and gr > 0:
                  gpu.append(gr)
              rows.append({"name": scenario.get("name"), "wallRatio": wr, "gpuRatio": gr})
          geometric = lambda values: math.exp(sum(map(math.log, values)) / len(values))
          output = {
              "wallRatioVsFinalStack": geometric(wall),
              "gpuRatioVsFinalStack": geometric(gpu),
              "scenarios": rows,
          }
          Path("perf-results/incremental-evaluation.json").write_text(
              json.dumps(output, indent=2) + "\n"
          )
          print(json.dumps(output, indent=2))
          PY

      - name: Publish summary
        if: always()
        run: |
          test ! -f perf-results/benchmark.md || cat perf-results/benchmark.md >> "$GITHUB_STEP_SUMMARY"
          test ! -f perf-results/visual/visual-diff.md || cat perf-results/visual/visual-diff.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exact sources and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glass-static-uniforms-${{ github.sha }}
          path: |
            perf-results
            src
            baseline/src
          if-no-files-found: error
          retention-days: 30

      - name: Stop servers
        if: always()
        run: |
          test ! -f /tmp/baseline.pid || kill "$(cat /tmp/baseline.pid)" 2>/dev/null || true
          test ! -f /tmp/candidate.pid || kill "$(cat /tmp/candidate.pid)" 2>/dev/null || true

      - name: Enforce visual parity
        if: always() && steps.visual.outcome == 'failure'
        run: exit 1
