name: CTA pixel-space plus split dots and compact support

on:
  push:
    branches:
      - perf/major-2x-pixel-dot-padding
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pixel-dot-padding-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 80

    steps:
      - name: Check out combined experiment
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install candidate dependencies
        run: bun install --frozen-lockfile

      - name: Fetch exact q4-support and split-dot assets
        run: |
          git fetch origin \
            perf/major-2x-local-support-bounds:refs/remotes/origin/perf/major-2x-local-support-bounds \
            perf/major-2x-dot-split:refs/remotes/origin/perf/major-2x-dot-split
          git show \
            origin/perf/major-2x-local-support-bounds:perf/scripts/apply-benchmark-reliability-fixes.mjs \
            > /tmp/apply-benchmark-reliability-fixes.mjs
          git show \
            origin/perf/major-2x-local-support-bounds:perf/scripts/apply-single-frame-paired-harness-fix.mjs \
            > /tmp/apply-single-frame-paired-harness-fix.mjs
          git show \
            origin/perf/major-2x-local-support-bounds:perf/experiments/local-support-bounds.patch \
            > /tmp/local-support-bounds.patch
          git show \
            origin/perf/major-2x-dot-split:perf/experiments/dot-split-incremental.patch.gz.b64 \
            | tr -d "\n" | base64 --decode | gzip --decompress \
            > /tmp/dot-split.patch
          cat perf/experiments/major-2x-specializations.patch.gz.b64.* \
            | tr -d "\n" | base64 --decode | gzip --decompress \
            > /tmp/major.patch

      - name: Apply combined CTA candidate
        run: |
          git apply --whitespace=nowarn /tmp/major.patch
          python - <<'PY'
          from pathlib import Path
          path = Path("src/runtime/path-renderer.ts")
          source = path.read_text(encoding="utf-8")
          if source.count("useSourceInstancedQuadrature") != 2:
              raise SystemExit("unexpected source-instanced helper count")
          source = source.replace(
              "useSourceInstancedQuadrature",
              "shouldUseSourceInstancedQuadrature",
          )
          if source.count("settings.headTaper <= 0.000001") != 1:
              raise SystemExit("unexpected taper threshold count")
          source = source.replace(
              "settings.headTaper <= 0.000001",
              "settings.headTaper <= 0.001001",
          )
          path.write_text(source, encoding="utf-8")
          PY
          git apply --whitespace=nowarn /tmp/dot-split.patch
          python - <<'PY'
          from pathlib import Path
          path = Path("src/rendering/shaders.ts")
          source = path.read_text(encoding="utf-8")
          marker = "export const PATH_DOTS_POINTER_FRAGMENT_SHADER"
          start = source.find(marker)
          anchor = "uniform float uDotPointerMagnification;\n\n${COMMON_THEME_GLSL}"
          position = source.find(anchor, start)
          if start < 0 or position < 0:
              raise SystemExit("pointer-dot luminance anchor missing")
          replacement = (
              "uniform float uDotPointerMagnification;\n\n"
              "const vec3 LUMA = vec3(0.2126, 0.7152, 0.0722);\n\n"
              "${COMMON_THEME_GLSL}"
          )
          source = source[:position] + source[position:].replace(anchor, replacement, 1)
          path.write_text(source, encoding="utf-8")
          PY
          git apply --whitespace=nowarn /tmp/local-support-bounds.patch
          node perf/scripts/apply-pixel-space-source-experiment.mjs
          python - <<'PY'
          from pathlib import Path
          path = Path("src/rendering/shaders.ts")
          source = path.read_text(encoding="utf-8")
          start = source.index("  float positiveRadius = min(")
          end = source.index("  float alongRadius =", start)
          block = source[start:end]
          if block.count("+ 2.0,") != 2:
              raise SystemExit("unexpected source-support padding anchors")
          block = block.replace("+ 2.0,", "+ 0.5,")
          path.write_text(source[:start] + block + source[end:], encoding="utf-8")
          PY
          node /tmp/apply-benchmark-reliability-fixes.mjs
          node /tmp/apply-single-frame-paired-harness-fix.mjs

      - name: Format and validate candidate
        run: |
          bunx biome format --write \
            src/rendering/profile-textures.ts \
            src/rendering/shaders.ts \
            src/rendering/webgl-resources.ts \
            src/runtime/path-renderer.ts \
            src/runtime/use-hero-wave-renderer.ts \
            src/runtime/glass-terrain-renderer.ts \
            src/runtime/resource-manager.ts \
            src/runtime/draw-common.ts \
            perf/harness/gl-profiler.js \
            perf/scripts/apply-pixel-space-source-experiment.mjs \
            perf/scripts/benchmark-core.mjs \
            perf/scripts/benchmark-suite.mjs \
            perf/scripts/benchmark.mjs \
            perf/scripts/evaluate-major-target.mjs
          bun run check
          bun run build
          bunx tsc -p tsconfig.perf.json --noEmit

      - name: Check out exact original renderer baseline
        uses: actions/checkout@v4
        with:
          ref: b3c926b88b4861d851075015c141c67f225517fb
          path: baseline

      - name: Install and patch baseline benchmark hook
        run: |
          cd baseline
          bun install --frozen-lockfile
          cd ..
          node /tmp/apply-single-frame-paired-harness-fix.mjs baseline
          rm -rf baseline/perf/harness
          cp -R perf/harness baseline/perf/harness
          cp vite.perf.config.ts baseline/vite.perf.config.ts
          cp tsconfig.perf.json baseline/tsconfig.perf.json

      - name: Build baseline and candidate harnesses
        run: |
          bunx vite build --config vite.perf.config.ts \
            --outDir "$GITHUB_WORKSPACE/perf-dist-candidate"
          cd baseline
          bunx tsc -p tsconfig.perf.json --noEmit
          bunx vite build --config vite.perf.config.ts \
            --outDir "$GITHUB_WORKSPACE/perf-dist-baseline"

      - name: Install visual diff dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy scikit-image

      - name: Start deterministic servers
        run: |
          python -m http.server 4173 --bind 127.0.0.1 \
            --directory perf-dist-baseline >/tmp/baseline.log 2>&1 &
          echo $! >/tmp/baseline.pid
          python -m http.server 4174 --bind 127.0.0.1 \
            --directory perf-dist-candidate >/tmp/candidate.log 2>&1 &
          echo $! >/tmp/candidate.pid
          for port in 4173 4174; do
            for attempt in $(seq 1 80); do
              curl --fail --silent "http://127.0.0.1:${port}/" >/dev/null && break
              sleep 0.1
            done
            curl --fail --silent "http://127.0.0.1:${port}/" >/dev/null
          done

      - name: Run direct paired CTA benchmark
        run: |
          bun perf/scripts/benchmark.mjs \
            --baseline http://127.0.0.1:4173 \
            --candidate http://127.0.0.1:4174 \
            --out perf-results \
            --focus cta \
            --repeats 3 \
            --frames 12 \
            --warmup-frames 7 \
            --profile-frames 6

      - name: Prove exactly one full renderer frame per sample
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("perf-results/benchmark.json").read_text())
          failures = []
          checks = 0
          for scenario in report.get("scenarios", []):
              name = scenario.get("name", "unknown")
              for build in ("baseline", "candidate"):
                  for index, run in enumerate(scenario.get("raw", {}).get(build, [])):
                      stages = run.get("gpu", {}).get("byStage", {})
                      for stage in ("path-composite", "glass-composite"):
                          value = stages.get(stage, {}).get("countPerFrame")
                          checks += 1
                          if value is None or abs(value - 1) > 1e-9:
                              failures.append(
                                  f"{name}/{build}/{index}/{stage}: expected 1, got {value}"
                              )
                      finish = run.get("glPerFrame", {}).get("finish")
                      if finish is None or abs(finish - 1) > 1e-9:
                          failures.append(
                              f"{name}/{build}/{index}/finish: expected 1, got {finish}"
                          )
          Path("perf-results/single-frame-validation.json").write_text(
              json.dumps({"passed": not failures, "checks": checks, "failures": failures}, indent=2) + "\n"
          )
          if failures:
              raise SystemExit("\n".join(failures))
          print(f"Validated {checks} stage counters.")
          PY

      - name: Compare combined output against original
        id: visual
        continue-on-error: true
        run: |
          python perf/scripts/visual-diff.py \
            --baseline perf-results/screenshots/baseline \
            --candidate perf-results/screenshots/candidate \
            --out perf-results/visual

      - name: Evaluate direct target progress
        if: always()
        run: |
          if [ -f perf-results/benchmark.json ]; then
            node perf/scripts/evaluate-major-target.mjs \
              --input perf-results/benchmark.json \
              --output perf-results/major-target-evaluation.json \
              --markdown perf-results/major-target-evaluation.md \
              --target-ratio 0.5 \
              --maximum-regression 0.03
          fi

      - name: Publish summary
        if: always()
        run: |
          test ! -f perf-results/benchmark.md || cat perf-results/benchmark.md >> "$GITHUB_STEP_SUMMARY"
          test ! -f perf-results/major-target-evaluation.md || cat perf-results/major-target-evaluation.md >> "$GITHUB_STEP_SUMMARY"
          test ! -f perf-results/visual/visual-diff.md || cat perf-results/visual/visual-diff.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exact candidate and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixel-dot-padding-${{ github.sha }}
          path: |
            perf-results
            src
          if-no-files-found: error
          retention-days: 30

      - name: Stop servers
        if: always()
        run: |
          test ! -f /tmp/baseline.pid || kill "$(cat /tmp/baseline.pid)" 2>/dev/null || true
          test ! -f /tmp/candidate.pid || kill "$(cat /tmp/candidate.pid)" 2>/dev/null || true

      - name: Enforce visual parity
        if: always() && steps.visual.outcome == 'failure'
        run: exit 1
