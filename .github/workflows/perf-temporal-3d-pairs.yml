name: Hero temporal 3D pair textures

on:
  push:
    branches: [perf/major-2x-temporal-3d-pairs]
  pull_request:
    branches: [perf/major-2x-final-temporal]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporal-3d-pairs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install candidate dependencies
        run: bun install --frozen-lockfile

      - name: Materialize selected 15 Hz stack and identical capture suite
        run: |
          bash perf/scripts/materialize-final-temporal-stack.sh
          node perf/scripts/add-temporal-parity-snapshots.mjs
          bunx biome format --write src perf/scripts/benchmark.mjs perf/scripts/benchmark-suite.mjs
          git diff --binary \
            b3c926b88b4861d851075015c141c67f225517fb -- src \
            > /tmp/final-temporal-stack.patch
          test -s /tmp/final-temporal-stack.patch

      - name: Apply structural hardware-interpolation transform
        run: |
          base64 --decode \
            perf/experiments/apply-temporal-3d-pairs.py.gz.b64 \
            | gzip --decompress > /tmp/apply-temporal-3d-pairs.py
          python /tmp/apply-temporal-3d-pairs.py
          grep -Fq "temporalPairTextures" src/rendering/webgl-resources.ts
          grep -Fq "copyTexSubImage3D" src/runtime/path-renderer.ts
          grep -Fq "sampler3D uFarWave" src/rendering/shaders.ts

      - name: Format and validate candidate
        run: |
          bunx biome format --write \
            src/rendering/shaders.ts \
            src/rendering/webgl-resources.ts \
            src/runtime/draw-common.ts \
            src/runtime/path-renderer.ts \
            src/runtime/resource-manager.ts
          bun run check
          bun run build
          bunx tsc -p tsconfig.perf.json --noEmit

      - name: Check out identical 15 Hz stack baseline
        uses: actions/checkout@v4
        with:
          ref: b3c926b88b4861d851075015c141c67f225517fb
          path: baseline
      - name: Install and materialize baseline
        run: |
          cd baseline
          bun install --frozen-lockfile
          git apply --whitespace=nowarn /tmp/final-temporal-stack.patch
          bunx biome format --write src
          bun run check
          bun run build
          cd ..
          mkdir -p baseline/perf
          rm -rf baseline/perf/harness baseline/perf/scripts
          cp -R perf/harness baseline/perf/harness
          cp -R perf/scripts baseline/perf/scripts
          cp vite.perf.config.ts baseline/vite.perf.config.ts
          cp tsconfig.perf.json baseline/tsconfig.perf.json

      - name: Build deterministic harnesses
        run: |
          bunx vite build --config vite.perf.config.ts \
            --outDir "$GITHUB_WORKSPACE/perf-dist-candidate"
          cd baseline
          bunx tsc -p tsconfig.perf.json --noEmit
          bunx vite build --config vite.perf.config.ts \
            --outDir "$GITHUB_WORKSPACE/perf-dist-baseline"
      - name: Install visual comparison dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy scikit-image
      - name: Start deterministic servers
        run: |
          python -m http.server 4173 --bind 127.0.0.1 --directory perf-dist-baseline >/tmp/baseline.log 2>&1 &
          echo $! >/tmp/baseline.pid
          python -m http.server 4174 --bind 127.0.0.1 --directory perf-dist-candidate >/tmp/candidate.log 2>&1 &
          echo $! >/tmp/candidate.pid
          for port in 4173 4174; do
            for attempt in $(seq 1 100); do
              curl --fail --silent "http://127.0.0.1:${port}/" >/dev/null && break
              sleep 0.1
            done
            curl --fail --silent "http://127.0.0.1:${port}/" >/dev/null
          done

      - name: Run paired Hero benchmark and interpolation captures
        run: |
          bun perf/scripts/benchmark.mjs \
            --baseline http://127.0.0.1:4173 \
            --candidate http://127.0.0.1:4174 \
            --out perf-results \
            --focus hero \
            --repeats 2 \
            --frames 12 \
            --warmup-frames 8 \
            --profile-frames 8
      - name: Compare all Hero captures
        id: visual
        continue-on-error: true
        run: |
          python perf/scripts/visual-diff.py \
            --baseline perf-results/screenshots/baseline \
            --candidate perf-results/screenshots/candidate \
            --out perf-results/visual

      - name: Evaluate incremental composite and frame ratios
        id: target
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          report = json.loads(Path('perf-results/benchmark.json').read_text())
          rows, wall, gpu, composite = [], [], [], []
          for scenario in report.get('scenarios', []):
              paired = scenario.get('paired', {})
              baseline = scenario.get('baseline', {})
              candidate = scenario.get('candidate', {})
              wr = paired.get('wallMeanMs', {}).get('geometricMeanRatio')
              gr = paired.get('gpuTotalFrameMs', {}).get('geometricMeanRatio')
              bp = baseline.get('gpuByStage', {}).get('path-composite', {}).get('median')
              cp = candidate.get('gpuByStage', {}).get('path-composite', {}).get('median')
              cr = cp / bp if isinstance(bp, (int, float)) and bp > 0 and isinstance(cp, (int, float)) else None
              if isinstance(wr, (int, float)) and wr > 0: wall.append(wr)
              if isinstance(gr, (int, float)) and gr > 0: gpu.append(gr)
              if isinstance(cr, (int, float)) and cr > 0: composite.append(cr)
              rows.append({'name': scenario.get('name'), 'wallRatio': wr, 'gpuRatio': gr,
                           'pathCompositeRatio': cr, 'baselinePathCompositeMs': bp,
                           'candidatePathCompositeMs': cp})
          geometric = lambda values: math.exp(sum(map(math.log, values)) / len(values))
          result = {
              'scenarioCount': len(rows),
              'wallRatioVs15HzStack': geometric(wall) if wall else None,
              'gpuRatioVs15HzStack': geometric(gpu) if gpu else None,
              'pathCompositeRatio': geometric(composite) if composite else None,
              'textureInstructionsPerTemporalComposite': {'baseline': 10, 'candidate': 5},
              'scenarios': rows,
          }
          Path('perf-results/temporal-3d-pairs-evaluation.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result, indent=2))
          if len(rows) != 4 or len(gpu) != 4 or len(composite) != 4:
              raise SystemExit('fail-closed: incomplete four-surface result')
          if result['gpuRatioVs15HzStack'] > 0.98:
              raise SystemExit(f"GPU ratio did not improve: {result['gpuRatioVs15HzStack']}")
          if result['pathCompositeRatio'] > 0.90:
              raise SystemExit(f"Composite ratio did not improve enough: {result['pathCompositeRatio']}")
          if max(row['wallRatio'] for row in rows if row['wallRatio'] is not None) > 1.02:
              raise SystemExit('At least one wall-time scenario regressed over 2%')
          PY

      - name: Publish result
        if: always()
        run: |
          test ! -f perf-results/benchmark.md || cat perf-results/benchmark.md >> "$GITHUB_STEP_SUMMARY"
          test ! -f perf-results/visual/visual-diff.md || cat perf-results/visual/visual-diff.md >> "$GITHUB_STEP_SUMMARY"
          test ! -f perf-results/temporal-3d-pairs-evaluation.json || cat perf-results/temporal-3d-pairs-evaluation.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload measurements and exact source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temporal-3d-pairs-${{ github.sha }}
          path: |
            perf-results
            src
            baseline/src
          if-no-files-found: error
          retention-days: 30
      - name: Stop servers
        if: always()
        run: |
          test ! -f /tmp/baseline.pid || kill "$(cat /tmp/baseline.pid)" 2>/dev/null || true
          test ! -f /tmp/candidate.pid || kill "$(cat /tmp/candidate.pid)" 2>/dev/null || true
      - name: Enforce visual parity
        if: always() && steps.visual.outcome == 'failure'
        run: exit 1
      - name: Enforce incremental target
        if: always() && steps.target.outcome == 'failure'
        run: exit 1
