name: Hero interpolated HDR path cache

on:
  push:
    branches:
      - perf/major-2x-hero-temporal-cache
  pull_request:
    branches:
      - perf/major-2x-final-consolidated
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hero-temporal-cache-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 100

    steps:
      - name: Check out temporal-cache experiment
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install candidate dependencies
        run: bun install --frozen-lockfile

      - name: Materialize current consolidated stack
        run: |
          bash perf/scripts/materialize-validated-stack.sh
          bunx biome format --write src
          git diff --binary \
            b3c926b88b4861d851075015c141c67f225517fb -- src \
            > /tmp/consolidated-stack.patch
          test -s /tmp/consolidated-stack.patch

      - name: Apply active 30 Hz interpolated HDR path cache
        run: |
          base64 --decode \
            perf/experiments/apply-hero-temporal-interpolation-experiment.mjs.gz.b64 \
            | gzip --decompress \
            > /tmp/apply-hero-temporal-interpolation-experiment.mjs
          node /tmp/apply-hero-temporal-interpolation-experiment.mjs
          python - <<'PY'
          from pathlib import Path

          path = Path("src/runtime/path-renderer.ts")
          source = path.read_text(encoding="utf-8")
          before = 'root.quality.quadrature >= 4 &&'
          after = 'root.quality.quadrature >= 2 &&'
          count = source.count(before)
          if count != 1:
              raise SystemExit(
                  f"expected exactly one temporal quadrature selector, found {count}"
              )
          path.write_text(source.replace(before, after), encoding="utf-8")
          PY
          grep -q "updateTemporalHeroCache" src/runtime/path-renderer.ts
          grep -q "root.quality.quadrature >= 2" src/runtime/path-renderer.ts
          grep -q "temporalWaveTextures" src/rendering/webgl-resources.ts
          bunx biome format --write \
            src/rendering/shaders.ts \
            src/rendering/webgl-resources.ts \
            src/runtime/resource-manager.ts \
            src/runtime/draw-common.ts \
            src/runtime/path-renderer.ts
          bun run check
          bun run build
          bunx tsc -p tsconfig.perf.json --noEmit

      - name: Check out stack-only baseline
        uses: actions/checkout@v4
        with:
          ref: b3c926b88b4861d851075015c141c67f225517fb
          path: baseline

      - name: Install and materialize stack-only baseline
        run: |
          cd baseline
          bun install --frozen-lockfile
          git apply --whitespace=nowarn /tmp/consolidated-stack.patch
          bunx biome format --write src
          bun run check
          bun run build
          cd ..
          mkdir -p baseline/perf
          rm -rf baseline/perf/harness
          cp -R perf/harness baseline/perf/harness
          cp vite.perf.config.ts baseline/vite.perf.config.ts
          cp tsconfig.perf.json baseline/tsconfig.perf.json

      - name: Build deterministic harnesses
        run: |
          bunx vite build --config vite.perf.config.ts \
            --outDir "$GITHUB_WORKSPACE/perf-dist-candidate"
          cd baseline
          bunx tsc -p tsconfig.perf.json --noEmit
          bunx vite build --config vite.perf.config.ts \
            --outDir "$GITHUB_WORKSPACE/perf-dist-baseline"

      - name: Install visual-diff dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy scikit-image

      - name: Start deterministic servers
        run: |
          python -m http.server 4173 --bind 127.0.0.1 \
            --directory perf-dist-baseline >/tmp/baseline.log 2>&1 &
          echo $! >/tmp/baseline.pid
          python -m http.server 4174 --bind 127.0.0.1 \
            --directory perf-dist-candidate >/tmp/candidate.log 2>&1 &
          echo $! >/tmp/candidate.pid
          for port in 4173 4174; do
            for attempt in $(seq 1 100); do
              curl --fail --silent "http://127.0.0.1:${port}/" >/dev/null && break
              sleep 0.1
            done
            curl --fail --silent "http://127.0.0.1:${port}/" >/dev/null
          done

      - name: Run incremental paired Hero benchmark
        run: |
          bun perf/scripts/benchmark.mjs \
            --baseline http://127.0.0.1:4173 \
            --candidate http://127.0.0.1:4174 \
            --out perf-results \
            --focus hero \
            --repeats 2 \
            --frames 12 \
            --warmup-frames 8 \
            --profile-frames 8

      - name: Compare deterministic Hero screenshots
        id: visual
        continue-on-error: true
        run: |
          python perf/scripts/visual-diff.py \
            --baseline perf-results/screenshots/baseline \
            --candidate perf-results/screenshots/candidate \
            --out perf-results/visual

      - name: Evaluate incremental wall, GPU, draw and activation ratios
        if: always()
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path

          path = Path("perf-results/benchmark.json")
          if not path.exists():
              raise SystemExit("benchmark report is missing")
          report = json.loads(path.read_text())
          wall = []
          gpu = []
          rows = []
          active_scenarios = 0
          for scenario in report.get("scenarios", []):
              paired = scenario.get("paired", {})
              baseline = scenario.get("baseline", {})
              candidate = scenario.get("candidate", {})
              wr = paired.get("wallMeanMs", {}).get("geometricMeanRatio")
              gr = paired.get("gpuTotalFrameMs", {}).get("geometricMeanRatio")
              baseline_queries = baseline.get("gpuSampleCount", {}).get("median")
              candidate_queries = candidate.get("gpuSampleCount", {}).get("median")
              baseline_draws = (
                  baseline.get("glPerFrame", {})
                  .get("drawArraysInstanced", {})
                  .get("median")
              )
              candidate_draws = (
                  candidate.get("glPerFrame", {})
                  .get("drawArraysInstanced", {})
                  .get("median")
              )
              cache_active = (
                  isinstance(baseline_queries, (int, float))
                  and isinstance(candidate_queries, (int, float))
                  and candidate_queries < baseline_queries * 0.9
              ) or (
                  isinstance(baseline_draws, (int, float))
                  and isinstance(candidate_draws, (int, float))
                  and candidate_draws < baseline_draws
              )
              if cache_active:
                  active_scenarios += 1
              if isinstance(wr, (int, float)) and wr > 0:
                  wall.append(wr)
              if isinstance(gr, (int, float)) and gr > 0:
                  gpu.append(gr)
              rows.append({
                  "name": scenario.get("name"),
                  "wallRatio": wr,
                  "gpuRatio": gr,
                  "baselineGpuQueries": baseline_queries,
                  "candidateGpuQueries": candidate_queries,
                  "baselineInstancedDraws": baseline_draws,
                  "candidateInstancedDraws": candidate_draws,
                  "cacheActive": cache_active,
                  "baseline": baseline,
                  "candidate": candidate,
              })
          geometric = lambda values: math.exp(sum(map(math.log, values)) / len(values))
          result = {
              "cacheActiveScenarios": active_scenarios,
              "scenarioCount": len(rows),
              "wallRatioVsConsolidatedStack": geometric(wall) if wall else None,
              "gpuRatioVsConsolidatedStack": geometric(gpu) if gpu else None,
              "estimatedAdditionalPathMemoryMiBDesktop": 14.5,
              "temporalAnchorRateHz": 30,
              "scenarios": rows,
          }
          Path("perf-results/hero-temporal-cache-evaluation.json").write_text(
              json.dumps(result, indent=2) + "\n"
          )
          print(json.dumps(result, indent=2))
          if len(rows) < 4 or active_scenarios < 4:
              raise SystemExit(
                  f"fail-closed: temporal cache active in only {active_scenarios}/{len(rows)} scenarios"
              )
          PY

      - name: Publish summary
        if: always()
        run: |
          test ! -f perf-results/benchmark.md || cat perf-results/benchmark.md >> "$GITHUB_STEP_SUMMARY"
          test ! -f perf-results/visual/visual-diff.md || cat perf-results/visual/visual-diff.md >> "$GITHUB_STEP_SUMMARY"
          if [ -f perf-results/hero-temporal-cache-evaluation.json ]; then
            printf '\n```json\n' >> "$GITHUB_STEP_SUMMARY"
            cat perf-results/hero-temporal-cache-evaluation.json >> "$GITHUB_STEP_SUMMARY"
            printf '```\n' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload measurements and exact source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hero-temporal-cache-${{ github.sha }}
          path: |
            perf-results
            src
            baseline/src
          if-no-files-found: error
          retention-days: 30

      - name: Stop servers
        if: always()
        run: |
          test ! -f /tmp/baseline.pid || kill "$(cat /tmp/baseline.pid)" 2>/dev/null || true
          test ! -f /tmp/candidate.pid || kill "$(cat /tmp/candidate.pid)" 2>/dev/null || true

      - name: Enforce visual parity
        if: always() && steps.visual.outcome == 'failure'
        run: exit 1
