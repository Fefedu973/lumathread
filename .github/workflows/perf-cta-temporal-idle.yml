name: CTA idle temporal path cache

on:
  push:
    branches:
      - perf/major-2x-cta-temporal-idle
  pull_request:
    branches:
      - perf/major-2x-final-temporal-static-cta
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cta-temporal-idle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 105

    steps:
      - name: Check out CTA temporal-cache candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install candidate dependencies
        run: bun install --frozen-lockfile

      - name: Materialize selected final stack and parity matrix
        run: |
          bash perf/scripts/materialize-final-temporal-stack.sh
          node perf/scripts/add-temporal-parity-snapshots.mjs
          node perf/scripts/add-cta-temporal-parity-snapshots.mjs
          bunx biome format --write \
            src \
            perf/scripts/benchmark.mjs \
            perf/scripts/benchmark-suite.mjs \
            perf/scripts/add-temporal-parity-snapshots.mjs \
            perf/scripts/add-cta-temporal-parity-snapshots.mjs
          git diff --binary \
            b3c926b88b4861d851075015c141c67f225517fb -- src \
            > /tmp/final-stack.patch
          test -s /tmp/final-stack.patch

      - name: Apply idle anchored CTA temporal selector
        run: |
          node perf/scripts/apply-cta-temporal-idle-experiment.mjs
          grep -Fq "shouldUseTemporalPathCache" src/runtime/path-renderer.ts
          grep -Fq "anchoredSceneIsStable" src/runtime/path-renderer.ts
          bunx biome format --write \
            src/runtime/path-renderer.ts \
            perf/scripts/apply-cta-temporal-idle-experiment.mjs
          bun run check
          bun run build
          bunx tsc -p tsconfig.perf.json --noEmit

      - name: Check out identical final-stack baseline
        uses: actions/checkout@v4
        with:
          ref: b3c926b88b4861d851075015c141c67f225517fb
          path: baseline

      - name: Install and materialize baseline
        run: |
          cd baseline
          bun install --frozen-lockfile
          git apply --whitespace=nowarn /tmp/final-stack.patch
          bunx biome format --write src
          bun run check
          bun run build
          cd ..
          mkdir -p baseline/perf
          rm -rf baseline/perf/harness
          cp -R perf/harness baseline/perf/harness
          cp vite.perf.config.ts baseline/vite.perf.config.ts
          cp tsconfig.perf.json baseline/tsconfig.perf.json

      - name: Build deterministic candidate and baseline harnesses
        run: |
          bunx vite build --config vite.perf.config.ts \
            --outDir "$GITHUB_WORKSPACE/perf-dist-candidate"
          cd baseline
          bunx tsc -p tsconfig.perf.json --noEmit
          bunx vite build --config vite.perf.config.ts \
            --outDir "$GITHUB_WORKSPACE/perf-dist-baseline"

      - name: Install visual comparison dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy scikit-image

      - name: Start deterministic servers
        run: |
          python -m http.server 4173 --bind 127.0.0.1 \
            --directory perf-dist-baseline >/tmp/baseline.log 2>&1 &
          echo $! >/tmp/baseline.pid
          python -m http.server 4174 --bind 127.0.0.1 \
            --directory perf-dist-candidate >/tmp/candidate.log 2>&1 &
          echo $! >/tmp/candidate.pid
          for port in 4173 4174; do
            for attempt in $(seq 1 100); do
              curl --fail --silent "http://127.0.0.1:${port}/" >/dev/null && break
              sleep 0.1
            done
            curl --fail --silent "http://127.0.0.1:${port}/" >/dev/null
          done

      - name: Run incremental paired CTA benchmark
        run: |
          bun perf/scripts/benchmark.mjs \
            --baseline http://127.0.0.1:4173 \
            --candidate http://127.0.0.1:4174 \
            --out perf-results \
            --focus cta \
            --repeats 3 \
            --frames 24 \
            --warmup-frames 12 \
            --profile-frames 8

      - name: Compare direct and sequential CTA captures
        id: visual
        continue-on-error: true
        run: |
          python perf/scripts/visual-diff.py \
            --baseline perf-results/screenshots/baseline \
            --candidate perf-results/screenshots/candidate \
            --out perf-results/visual

      - name: Evaluate cache activation, wall and GPU ratios
        id: activation
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path

          report = json.loads(Path("perf-results/benchmark.json").read_text())
          rows = []
          for scenario in report.get("scenarios", []):
              baseline = scenario.get("baseline", {})
              candidate = scenario.get("candidate", {})
              paired = scenario.get("paired", {})
              bd = baseline.get("glPerFrame", {}).get("drawArraysInstanced", {}).get("median")
              cd = candidate.get("glPerFrame", {}).get("drawArraysInstanced", {}).get("median")
              bq = baseline.get("gpuSampleCount", {}).get("median")
              cq = candidate.get("gpuSampleCount", {}).get("median")
              draw_ratio = cd / bd if isinstance(cd, (int, float)) and isinstance(bd, (int, float)) and bd > 0 else None
              query_ratio = cq / bq if isinstance(cq, (int, float)) and isinstance(bq, (int, float)) and bq > 0 else None
              rows.append({
                  "name": scenario.get("name"),
                  "wallRatio": paired.get("wallMeanMs", {}).get("geometricMeanRatio"),
                  "gpuRatio": paired.get("gpuTotalFrameMs", {}).get("geometricMeanRatio"),
                  "drawRatio": draw_ratio,
                  "gpuQueryRatio": query_ratio,
                  "baselineInstancedDraws": bd,
                  "candidateInstancedDraws": cd,
                  "baselineGpuQueries": bq,
                  "candidateGpuQueries": cq,
              })

          expected = {
              "cta-dark-desktop",
              "cta-light-desktop",
              "cta-dark-mobile-2x",
              "cta-light-mobile-2x",
          }
          if {row["name"] for row in rows} != expected or len(rows) != 4:
              raise SystemExit(f"fail-closed: incomplete CTA scenario matrix: {rows}")

          def geometric(key):
              values = [row[key] for row in rows]
              if not all(isinstance(value, (int, float)) and value > 0 for value in values):
                  raise SystemExit(f"fail-closed: incomplete positive {key} ratios: {values}")
              return math.exp(sum(math.log(value) for value in values) / len(values))

          result = {
              "wallRatioVsFinalStack": geometric("wallRatio"),
              "gpuRatioVsFinalStack": geometric("gpuRatio"),
              "instancedDrawRatio": geometric("drawRatio"),
              "gpuQueryRatio": geometric("gpuQueryRatio"),
              "worstWallRatio": max(row["wallRatio"] for row in rows),
              "scenarios": sorted(rows, key=lambda row: row["name"]),
          }
          Path("perf-results/cta-temporal-idle-evaluation.json").write_text(
              json.dumps(result, indent=2) + "\n"
          )
          print(json.dumps(result, indent=2))
          if result["instancedDrawRatio"] > 0.6:
              raise SystemExit("idle CTA temporal cache did not remove enough recurring integration draws")
          if result["gpuQueryRatio"] > 0.65:
              raise SystemExit("idle CTA temporal cache did not reduce enough recurring GPU path queries")
          PY

      - name: Publish incremental summary
        if: always()
        run: |
          test ! -f perf-results/benchmark.md || cat perf-results/benchmark.md >> "$GITHUB_STEP_SUMMARY"
          if [ -f perf-results/cta-temporal-idle-evaluation.json ]; then
            printf '\n```json\n' >> "$GITHUB_STEP_SUMMARY"
            cat perf-results/cta-temporal-idle-evaluation.json >> "$GITHUB_STEP_SUMMARY"
            printf '```\n' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f perf-results/visual/visual-diff.md ]; then
            printf '\n' >> "$GITHUB_STEP_SUMMARY"
            cat perf-results/visual/visual-diff.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Collect exact candidate and server logs
        if: always()
        run: |
          mkdir -p perf-results/candidate perf-results/server-logs
          cp /tmp/final-stack.patch perf-results/candidate/ 2>/dev/null || true
          cp perf/materialized-final-temporal-stack.txt perf-results/candidate/ 2>/dev/null || true
          cp /tmp/baseline.log perf-results/server-logs/ 2>/dev/null || true
          cp /tmp/candidate.log perf-results/server-logs/ 2>/dev/null || true
          cp -R src perf-results/candidate/materialized-src

      - name: Upload measurements, captures and exact source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cta-temporal-idle-${{ github.sha }}
          path: perf-results
          if-no-files-found: error
          retention-days: 30

      - name: Stop deterministic servers
        if: always()
        run: |
          test ! -f /tmp/baseline.pid || kill "$(cat /tmp/baseline.pid)" 2>/dev/null || true
          test ! -f /tmp/candidate.pid || kill "$(cat /tmp/candidate.pid)" 2>/dev/null || true

      - name: Enforce cache activation
        if: always() && steps.activation.outcome == 'failure'
        run: exit 1

      - name: Enforce visual parity
        if: always() && steps.visual.outcome == 'failure'
        run: exit 1
