name: Final exact renderer consolidation

on:
  push:
    branches:
      - perf/major-2x-final-consolidated
  pull_request:
    branches:
      - perf/visual-parity-renderer-optimization
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: final-consolidated-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out consolidation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install candidate dependencies
        run: bun install --frozen-lockfile

      - name: Materialize all directly validated transforms
        run: bash perf/scripts/materialize-validated-stack.sh

      - name: Format and validate candidate source
        run: |
          bunx biome format --write \
            src \
            perf/scripts/materialize-validated-stack.sh \
            perf/scripts/evaluate-consolidated-target.py
          bun run check
          bun run build
          bunx tsc -p tsconfig.perf.json --noEmit

      - name: Capture exact candidate patch
        run: |
          git diff --binary \
            b3c926b88b4861d851075015c141c67f225517fb -- src \
            > /tmp/consolidated-renderer.patch
          test -s /tmp/consolidated-renderer.patch

      - name: Check out frozen original renderer
        uses: actions/checkout@v4
        with:
          ref: 7f4289aa3ff640f479701ceec0b0d790af037692
          path: baseline

      - name: Install baseline dependencies and identical harness
        run: |
          cd baseline
          bun install --frozen-lockfile
          cd ..
          mkdir -p baseline/perf
          rm -rf baseline/perf/harness
          cp -R perf/harness baseline/perf/harness
          cp vite.perf.config.ts baseline/vite.perf.config.ts
          cp tsconfig.perf.json baseline/tsconfig.perf.json

      - name: Apply symmetric one-frame debug stepping to baseline
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("baseline/src/runtime/use-hero-wave-renderer.ts")
          source = path.read_text(encoding="utf-8")
          request_before = '''      if (
        !running ||
        frameScheduled ||
        document.visibilityState === "hidden" ||'''
          request_after = '''      if (
        !running ||
        frameScheduled ||
        settings.paused ||
        manualPausedRef.current ||
        document.visibilityState === "hidden" ||'''
          step_before = '''      step: (seconds: number) => {
        const safeSeconds = finite(seconds, 0);'''
          step_after = '''      step: (seconds: number) => {
        if (frameScheduled) {
          cancelAnimationFrame(raf);
          frameScheduled = false;
        }
        const safeSeconds = finite(seconds, 0);'''
          if source.count(request_before) != 1:
              raise SystemExit("baseline requestFrame selector was not uniquely found")
          source = source.replace(request_before, request_after)
          if source.count(step_before) != 1:
              raise SystemExit("baseline debug.step block was not uniquely found")
          source = source.replace(step_before, step_after)
          path.write_text(source, encoding="utf-8")
          PY
          cd baseline
          bunx biome format --write src/runtime/use-hero-wave-renderer.ts
          bun run check
          cd ..

      - name: Build baseline and candidate harnesses
        run: |
          bunx vite build \
            --config vite.perf.config.ts \
            --outDir "$GITHUB_WORKSPACE/perf-dist-candidate"
          cd baseline
          bunx tsc -p tsconfig.perf.json --noEmit
          bunx vite build \
            --config vite.perf.config.ts \
            --outDir "$GITHUB_WORKSPACE/perf-dist-baseline"

      - name: Install visual comparison dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy scikit-image

      - name: Start deterministic servers
        run: |
          python -m http.server 4173 --bind 127.0.0.1 \
            --directory perf-dist-baseline >/tmp/lumathread-baseline.log 2>&1 &
          echo $! >/tmp/lumathread-baseline.pid
          python -m http.server 4174 --bind 127.0.0.1 \
            --directory perf-dist-candidate >/tmp/lumathread-candidate.log 2>&1 &
          echo $! >/tmp/lumathread-candidate.pid
          for port in 4173 4174; do
            for attempt in $(seq 1 100); do
              if curl --fail --silent "http://127.0.0.1:${port}/" >/dev/null; then
                break
              fi
              sleep 0.1
            done
            curl --fail --silent "http://127.0.0.1:${port}/" >/dev/null
          done

      - name: Run direct balanced full-surface paired benchmark
        run: |
          bun perf/scripts/benchmark.mjs \
            --baseline http://127.0.0.1:4173 \
            --candidate http://127.0.0.1:4174 \
            --out perf-results \
            --repeats 4 \
            --frames 12 \
            --warmup-frames 8 \
            --profile-frames 6

      - name: Compare deterministic screenshots
        id: visual
        continue-on-error: true
        run: |
          python perf/scripts/visual-diff.py \
            --baseline perf-results/screenshots/baseline \
            --candidate perf-results/screenshots/candidate \
            --out perf-results/visual

      - name: Evaluate direct 2x wall and half-GPU target
        id: target
        continue-on-error: true
        run: |
          python perf/scripts/evaluate-consolidated-target.py \
            --input perf-results/benchmark.json \
            --output perf-results/consolidated-target.json \
            --markdown perf-results/consolidated-target.md \
            --target-ratio 0.5 \
            --maximum-regression 0.02 \
            --minimum-scenarios 5 \
            --minimum-gpu-scenarios 4

      - name: Publish direct benchmark summary
        if: always()
        run: |
          test ! -f perf-results/benchmark.md || cat perf-results/benchmark.md >> "$GITHUB_STEP_SUMMARY"
          if [ -f perf-results/consolidated-target.md ]; then
            printf '\n' >> "$GITHUB_STEP_SUMMARY"
            cat perf-results/consolidated-target.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f perf-results/visual/visual-diff.md ]; then
            printf '\n' >> "$GITHUB_STEP_SUMMARY"
            cat perf-results/visual/visual-diff.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Collect logs and candidate patch
        if: always()
        run: |
          mkdir -p perf-results/server-logs perf-results/candidate
          cp /tmp/lumathread-baseline.log perf-results/server-logs/ 2>/dev/null || true
          cp /tmp/lumathread-candidate.log perf-results/server-logs/ 2>/dev/null || true
          cp /tmp/consolidated-renderer.patch perf-results/candidate/ 2>/dev/null || true
          cp perf/materialized-stack.txt perf-results/candidate/ 2>/dev/null || true

      - name: Upload exact measurements, captures and source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-consolidated-${{ github.sha }}
          path: |
            perf-results
            src
          if-no-files-found: error
          retention-days: 30

      - name: Stop deterministic servers
        if: always()
        run: |
          test ! -f /tmp/lumathread-baseline.pid || kill "$(cat /tmp/lumathread-baseline.pid)" 2>/dev/null || true
          test ! -f /tmp/lumathread-candidate.pid || kill "$(cat /tmp/lumathread-candidate.pid)" 2>/dev/null || true

      - name: Enforce visual parity
        if: always() && steps.visual.outcome == 'failure'
        run: exit 1

      - name: Enforce direct 2x target
        if: always() && steps.target.outcome == 'failure'
        run: exit 1
