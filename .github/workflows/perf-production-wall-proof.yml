name: Production wall and uncapped FPS proof

on:
  push:
    branches:
      - perf/major-2x-production-wall-proof
  pull_request:
    branches:
      - perf/major-2x-final-temporal
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-wall-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Production wall (${{ matrix.surface }})
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        surface:
          - hero-dark-desktop
          - hero-light-desktop
          - cta-dark-desktop
          - cta-light-desktop
          - hero-dark-mobile-2x
          - hero-light-mobile-2x
          - cta-dark-mobile-2x
          - cta-light-mobile-2x

    steps:
      - name: Check out final renderer candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install candidate dependencies
        run: bun install --frozen-lockfile

      - name: Materialize exact final renderer
        run: |
          bash perf/scripts/materialize-final-temporal-stack.sh
          node perf/scripts/apply-production-wall-harness.mjs
          bunx biome format --write \
            src \
            perf/harness/index.html \
            perf/harness/gl-profiler.js \
            perf/scripts/benchmark-suite.mjs \
            perf/scripts/benchmark-production-wall.mjs \
            perf/scripts/apply-production-wall-harness.mjs
          bun run check
          bun run build
          bunx tsc -p tsconfig.perf.json --noEmit

      - name: Capture exact renderer patch
        run: |
          git diff --binary \
            b3c926b88b4861d851075015c141c67f225517fb -- src \
            > /tmp/final-temporal-renderer.patch
          test -s /tmp/final-temporal-renderer.patch

      - name: Check out frozen original renderer
        uses: actions/checkout@v4
        with:
          ref: 7f4289aa3ff640f479701ceec0b0d790af037692
          path: baseline

      - name: Install original and inject identical uninstrumented harness
        run: |
          cd baseline
          bun install --frozen-lockfile
          cd ..
          python perf/scripts/patch-original-debug-stepping.py \
            baseline/src/runtime/use-hero-wave-renderer.ts
          cd baseline
          bunx biome format --write src/runtime/use-hero-wave-renderer.ts
          bun run check
          cd ..
          mkdir -p baseline/perf
          rm -rf baseline/perf/harness
          cp -R perf/harness baseline/perf/harness
          cp vite.perf.config.ts baseline/vite.perf.config.ts
          cp tsconfig.perf.json baseline/tsconfig.perf.json

      - name: Build candidate and original harnesses
        run: |
          bunx vite build --config vite.perf.config.ts \
            --outDir "$GITHUB_WORKSPACE/perf-dist-candidate"
          cd baseline
          bunx tsc -p tsconfig.perf.json --noEmit
          bunx vite build --config vite.perf.config.ts \
            --outDir "$GITHUB_WORKSPACE/perf-dist-baseline"

      - name: Start deterministic servers
        run: |
          python -m http.server 4173 --bind 127.0.0.1 \
            --directory perf-dist-baseline >/tmp/baseline.log 2>&1 &
          echo $! >/tmp/baseline.pid
          python -m http.server 4174 --bind 127.0.0.1 \
            --directory perf-dist-candidate >/tmp/candidate.log 2>&1 &
          echo $! >/tmp/candidate.pid
          for port in 4173 4174; do
            for attempt in $(seq 1 100); do
              curl --fail --silent "http://127.0.0.1:${port}/" >/dev/null && break
              sleep 0.1
            done
            curl --fail --silent "http://127.0.0.1:${port}/" >/dev/null
          done

      - name: Run paired production-wall surface benchmark
        run: |
          bun perf/scripts/benchmark-production-wall.mjs \
            --baseline http://127.0.0.1:4173 \
            --candidate http://127.0.0.1:4174 \
            --out perf-results \
            --surface "${{ matrix.surface }}" \
            --repeats 4 \
            --frames 60 \
            --warmup-frames 30 \
            --profile-frames 1

      - name: Verify profiler overhead is absent
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("perf-results/production-wall.json").read_text())
          errors = []
          runs = []
          for scenario in report.get("scenarios", []):
              runs.extend(scenario.get("raw", {}).get("baseline", []))
              runs.extend(scenario.get("raw", {}).get("candidate", []))
          if len(report.get("scenarios", [])) != 1:
              errors.append("surface job did not record exactly one scenario")
          if not runs:
              errors.append("no raw runs were recorded")
          for index, run in enumerate(runs):
              gpu_profile = run.get("gl", {}).get("gpuProfile")
              if gpu_profile and gpu_profile.get("supported"):
                  errors.append(f"run {index}: per-draw GPU profiler remained enabled")
              nonzero = {
                  key: value
                  for key, value in run.get("glPerFrame", {}).items()
                  if isinstance(value, (int, float)) and abs(value) > 1e-12
              }
              if nonzero:
                  errors.append(f"run {index}: GL wrappers remained active: {nonzero}")
          print(json.dumps({"runCount": len(runs), "errors": errors}, indent=2))
          if errors:
              raise SystemExit("\n".join(errors))
          PY

      - name: Publish surface summary
        if: always()
        run: |
          test ! -f perf-results/production-wall.md \
            || cat perf-results/production-wall.md >> "$GITHUB_STEP_SUMMARY"

      - name: Collect exact surface evidence
        if: always()
        run: |
          mkdir -p perf-results/candidate perf-results/server-logs
          cp /tmp/final-temporal-renderer.patch perf-results/candidate/ 2>/dev/null || true
          cp perf/materialized-final-temporal-stack.txt perf-results/candidate/ 2>/dev/null || true
          cp /tmp/baseline.log perf-results/server-logs/ 2>/dev/null || true
          cp /tmp/candidate.log perf-results/server-logs/ 2>/dev/null || true

      - name: Upload surface result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-wall-surface-${{ matrix.surface }}-${{ github.sha }}
          path: perf-results
          if-no-files-found: error
          retention-days: 30

      - name: Stop deterministic servers
        if: always()
        run: |
          test ! -f /tmp/baseline.pid || kill "$(cat /tmp/baseline.pid)" 2>/dev/null || true
          test ! -f /tmp/candidate.pid || kill "$(cat /tmp/candidate.pid)" 2>/dev/null || true

  aggregate:
    name: Aggregate production wall target
    needs: benchmark
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Download all surface artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: production-wall-surface-*-${{ github.sha }}
          path: surface-results
          merge-multiple: false

      - name: Aggregate all eight surfaces fail-closed
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          expected = {
              "hero-dark-desktop",
              "hero-light-desktop",
              "cta-dark-desktop",
              "cta-light-desktop",
              "hero-dark-mobile-2x",
              "hero-light-mobile-2x",
              "cta-dark-mobile-2x",
              "cta-light-mobile-2x",
          }
          rows = []
          for report_path in Path("surface-results").rglob("production-wall.json"):
              report = json.loads(report_path.read_text())
              scenarios = report.get("scenarios", [])
              if len(scenarios) != 1:
                  raise SystemExit(f"{report_path}: expected one scenario, found {len(scenarios)}")
              scenario = scenarios[0]
              paired = scenario.get("paired", {})
              wall = paired.get("wallMeanMs", {}).get("geometricMeanRatio")
              submit = paired.get("submitMeanMs", {}).get("geometricMeanRatio")
              drain = paired.get("drainMeanMs", {}).get("geometricMeanRatio")
              if not all(isinstance(value, (int, float)) and value > 0 for value in (wall, submit, drain)):
                  raise SystemExit(f"{report_path}: missing positive wall/submit/drain ratios")
              rows.append({
                  "name": scenario.get("name"),
                  "wallRatio": wall,
                  "fpsMultiplier": 1 / wall,
                  "submitRatio": submit,
                  "drainRatio": drain,
                  "baselineFps": scenario.get("baseline", {}).get("fps", {}).get("median"),
                  "candidateFps": scenario.get("candidate", {}).get("fps", {}).get("median"),
              })

          names = {row["name"] for row in rows}
          if names != expected or len(rows) != len(expected):
              raise SystemExit(
                  f"fail-closed: expected {sorted(expected)}, received {sorted(names)} from {len(rows)} reports"
              )

          geometric = lambda key: math.exp(
              sum(math.log(row[key]) for row in rows) / len(rows)
          )
          wall_ratio = geometric("wallRatio")
          submit_ratio = geometric("submitRatio")
          drain_ratio = geometric("drainRatio")
          worst_wall_ratio = max(row["wallRatio"] for row in rows)
          result = {
              "accepted": wall_ratio <= 0.5 and worst_wall_ratio <= 0.75,
              "wallRatio": wall_ratio,
              "equivalentFpsMultiplier": 1 / wall_ratio,
              "submitRatio": submit_ratio,
              "drainRatio": drain_ratio,
              "worstWallRatio": worst_wall_ratio,
              "targetWallRatio": 0.5,
              "maximumScenarioWallRatio": 0.75,
              "scenarioCount": len(rows),
              "scenarios": sorted(rows, key=lambda row: row["name"]),
          }
          Path("production-wall-matrix.json").write_text(json.dumps(result, indent=2) + "\n")

          lines = [
              "# Production wall/FPS matrix",
              "",
              f"- Verdict: **{'ACCEPT' if result['accepted'] else 'REJECT'}**",
              f"- Geometric wall ratio: **{wall_ratio:.4f}**",
              f"- Equivalent uncapped FPS multiplier: **{1 / wall_ratio:.2f}×**",
              f"- Geometric submit ratio: **{submit_ratio:.4f}**",
              f"- Geometric drain ratio: **{drain_ratio:.4f}**",
              f"- Worst surface wall ratio: **{worst_wall_ratio:.4f}**",
              "",
              "| Scenario | Wall ratio | FPS multiplier | Submit ratio | Drain ratio | Baseline FPS | Candidate FPS |",
              "|---|---:|---:|---:|---:|---:|---:|",
          ]
          for row in result["scenarios"]:
              baseline_fps = row["baselineFps"]
              candidate_fps = row["candidateFps"]
              lines.append(
                  f"| {row['name']} | {row['wallRatio']:.4f} | {row['fpsMultiplier']:.2f}× | "
                  f"{row['submitRatio']:.4f} | {row['drainRatio']:.4f} | "
                  f"{baseline_fps:.1f} | {candidate_fps:.1f} |"
              )
          Path("production-wall-matrix.md").write_text("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY

      - name: Publish aggregate summary
        if: always()
        run: |
          test ! -f production-wall-matrix.md \
            || cat production-wall-matrix.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload aggregate proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-wall-matrix-${{ github.sha }}
          path: |
            production-wall-matrix.json
            production-wall-matrix.md
            surface-results
          if-no-files-found: error
          retention-days: 30

      - name: Enforce 2x uncapped FPS target
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("production-wall-matrix.json")
          if not path.exists():
              raise SystemExit("production-wall matrix report is missing")
          result = json.loads(path.read_text())
          if result.get("accepted") is not True:
              raise SystemExit("production wall target not reached: " + json.dumps(result))
          PY
