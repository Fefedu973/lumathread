name: Final exact renderer stack versus original

on:
  push:
    branches:
      - perf/major-2x-final-stack-direct
  pull_request:
    branches:
      - perf/major-2x-glass-bounds-incremental
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: final-exact-stack-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Check out final-stack branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install candidate dependencies
        run: bun install --frozen-lockfile

      - name: Apply the complete exact optimization stack
        run: bash perf/scripts/apply-final-stack-experiment.sh

      - name: Format and validate candidate
        run: |
          bunx biome format --write \
            src/rendering/glass-mask.ts \
            src/rendering/profile-textures.ts \
            src/rendering/shaders.ts \
            src/rendering/webgl-resources.ts \
            src/runtime/path-renderer.ts \
            src/runtime/use-hero-wave-renderer.ts \
            src/runtime/glass-terrain-renderer.ts \
            src/runtime/resource-manager.ts \
            src/runtime/draw-common.ts \
            perf/harness/gl-profiler.js \
            perf/scripts/benchmark-core.mjs \
            perf/scripts/benchmark-suite.mjs \
            perf/scripts/benchmark.mjs \
            perf/scripts/evaluate-major-target.mjs \
            perf/scripts/evaluate-final-stack.py
          bun run check
          bun run build
          bunx tsc -p tsconfig.perf.json --noEmit

      - name: Check out the exact original renderer baseline
        uses: actions/checkout@v4
        with:
          ref: b3c926b88b4861d851075015c141c67f225517fb
          path: baseline

      - name: Install and patch baseline benchmark hook
        run: |
          cd baseline
          bun install --frozen-lockfile
          cd ..
          node /tmp/apply-single-frame-paired-harness-fix.mjs baseline
          rm -rf baseline/perf/harness
          cp -R perf/harness baseline/perf/harness
          cp vite.perf.config.ts baseline/vite.perf.config.ts
          cp tsconfig.perf.json baseline/tsconfig.perf.json

      - name: Build baseline and candidate harnesses
        run: |
          bunx vite build --config vite.perf.config.ts \
            --outDir "$GITHUB_WORKSPACE/perf-dist-candidate"
          cd baseline
          bunx tsc -p tsconfig.perf.json --noEmit
          bunx vite build --config vite.perf.config.ts \
            --outDir "$GITHUB_WORKSPACE/perf-dist-baseline"

      - name: Install visual-diff dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy scikit-image

      - name: Start deterministic servers
        run: |
          python -m http.server 4173 --bind 127.0.0.1 \
            --directory perf-dist-baseline >/tmp/baseline.log 2>&1 &
          echo $! >/tmp/baseline.pid
          python -m http.server 4174 --bind 127.0.0.1 \
            --directory perf-dist-candidate >/tmp/candidate.log 2>&1 &
          echo $! >/tmp/candidate.pid
          for port in 4173 4174; do
            for attempt in $(seq 1 100); do
              curl --fail --silent "http://127.0.0.1:${port}/" >/dev/null && break
              sleep 0.1
            done
            curl --fail --silent "http://127.0.0.1:${port}/" >/dev/null
          done

      - name: Run direct CTA benchmark
        run: |
          bun perf/scripts/benchmark.mjs \
            --baseline http://127.0.0.1:4173 \
            --candidate http://127.0.0.1:4174 \
            --out perf-results-cta \
            --focus cta \
            --repeats 3 \
            --frames 12 \
            --warmup-frames 7 \
            --profile-frames 6

      - name: Run direct Hero benchmark
        run: |
          bun perf/scripts/benchmark.mjs \
            --baseline http://127.0.0.1:4173 \
            --candidate http://127.0.0.1:4174 \
            --out perf-results-hero \
            --focus hero \
            --repeats 3 \
            --frames 12 \
            --warmup-frames 7 \
            --profile-frames 6

      - name: Prove one renderer frame and optimized command counts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          failures = []
          rows = []
          for report_path in (
              Path("perf-results-cta/benchmark.json"),
              Path("perf-results-hero/benchmark.json"),
          ):
              report = json.loads(report_path.read_text())
              for scenario in report.get("scenarios", []):
                  name = scenario.get("name", "unknown")
                  for build in ("baseline", "candidate"):
                      for index, run in enumerate(scenario.get("raw", {}).get(build, [])):
                          stages = run.get("gpu", {}).get("byStage", {})
                          for stage in ("path-composite", "glass-composite"):
                              value = stages.get(stage, {}).get("countPerFrame")
                              if value is None or abs(value - 1) > 1e-9:
                                  failures.append(
                                      f"{name}/{build}/{index}/{stage}: expected 1, got {value}"
                                  )
                          gl = run.get("glPerFrame", {})
                          finish = gl.get("finish")
                          if finish is None or abs(finish - 1) > 1e-9:
                              failures.append(
                                  f"{name}/{build}/{index}/finish: expected 1, got {finish}"
                              )
                          rows.append({
                              "scenario": name,
                              "build": build,
                              "bufferData": gl.get("bufferData"),
                              "framebufferTexture2D": gl.get("framebufferTexture2D"),
                          })
          cta_candidate = [
              row for row in rows
              if row["build"] == "candidate" and row["scenario"].startswith("cta-")
          ]
          if not cta_candidate:
              failures.append("no candidate CTA command rows were recognized")
          if any((row["bufferData"] or 0) > 1 for row in cta_candidate):
              failures.append(f"CTA candidate still performs multiple bufferData calls: {cta_candidate}")
          if any((row["framebufferTexture2D"] or 0) > 0 for row in cta_candidate):
              failures.append(f"CTA candidate still attaches framebuffer textures: {cta_candidate}")
          output = {"passed": not failures, "failures": failures, "rows": rows}
          Path("command-validation.json").write_text(
              json.dumps(output, indent=2) + "\n"
          )
          if failures:
              raise SystemExit("\n".join(failures))
          print(json.dumps(output, indent=2))
          PY

      - name: Compare CTA screenshots
        id: visual_cta
        continue-on-error: true
        run: |
          python perf/scripts/visual-diff.py \
            --baseline perf-results-cta/screenshots/baseline \
            --candidate perf-results-cta/screenshots/candidate \
            --out perf-results-cta/visual

      - name: Compare Hero screenshots
        id: visual_hero
        continue-on-error: true
        run: |
          python perf/scripts/visual-diff.py \
            --baseline perf-results-hero/screenshots/baseline \
            --candidate perf-results-hero/screenshots/candidate \
            --out perf-results-hero/visual

      - name: Combine reports and evaluate the direct target
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cta = json.loads(Path("perf-results-cta/benchmark.json").read_text())
          hero = json.loads(Path("perf-results-hero/benchmark.json").read_text())
          combined = dict(cta)
          combined["generatedAt"] = max(cta.get("generatedAt", ""), hero.get("generatedAt", ""))
          combined["scenarios"] = cta.get("scenarios", []) + hero.get("scenarios", [])
          combined["profiles"] = cta.get("profiles", []) + hero.get("profiles", [])
          combined["snapshots"] = cta.get("snapshots", []) + hero.get("snapshots", [])
          Path("final-combined-benchmark.json").write_text(
              json.dumps(combined, indent=2) + "\n"
          )
          PY
          python perf/scripts/evaluate-final-stack.py \
            --input final-combined-benchmark.json \
            --output final-stack-evaluation.json \
            --markdown final-stack-evaluation.md \
            --target-ratio 0.5 \
            --maximum-regression 0.03

      - name: Publish final-stack summary
        if: always()
        run: |
          test ! -f final-stack-evaluation.md || cat final-stack-evaluation.md >> "$GITHUB_STEP_SUMMARY"
          if [ -f perf-results-cta/visual/visual-diff.md ]; then
            printf '\n## CTA visual parity\n\n' >> "$GITHUB_STEP_SUMMARY"
            cat perf-results-cta/visual/visual-diff.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f perf-results-hero/visual/visual-diff.md ]; then
            printf '\n## Hero visual parity\n\n' >> "$GITHUB_STEP_SUMMARY"
            cat perf-results-hero/visual/visual-diff.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload exact candidate, reports and visual diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-exact-stack-${{ github.sha }}
          path: |
            perf-results-cta
            perf-results-hero
            final-combined-benchmark.json
            final-stack-evaluation.json
            final-stack-evaluation.md
            command-validation.json
            src
          if-no-files-found: error
          retention-days: 30

      - name: Stop servers
        if: always()
        run: |
          test ! -f /tmp/baseline.pid || kill "$(cat /tmp/baseline.pid)" 2>/dev/null || true
          test ! -f /tmp/candidate.pid || kill "$(cat /tmp/candidate.pid)" 2>/dev/null || true

      - name: Enforce visual parity
        if: always() && (steps.visual_cta.outcome == 'failure' || steps.visual_hero.outcome == 'failure')
        run: exit 1

      - name: Enforce direct 2x wall and GPU target
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("final-stack-evaluation.json")
          if not path.exists():
              raise SystemExit("final-stack evaluation is missing")
          result = json.loads(path.read_text())
          if not result.get("accepted"):
              raise SystemExit("direct 2x wall/GPU target was not reached")
          PY
