name: Final temporal renderer proof

on:
  push:
    branches:
      - perf/major-2x-final-temporal
  pull_request:
    branches:
      - perf/major-2x-final-consolidated
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: final-temporal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: ${{ matrix.focus }} direct A/B
    runs-on: ubuntu-latest
    timeout-minutes: 105
    strategy:
      fail-fast: false
      matrix:
        focus:
          - hero
          - cta

    steps:
      - name: Check out final temporal candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install candidate dependencies
        run: bun install --frozen-lockfile

      - name: Materialize consolidated CTA and temporal Hero stack
        run: |
          bash perf/scripts/materialize-final-temporal-stack.sh
          node perf/scripts/add-temporal-parity-snapshots.mjs
          bunx biome format --write \
            src \
            perf/scripts/benchmark.mjs \
            perf/scripts/materialize-final-temporal-stack.sh \
            perf/scripts/add-temporal-parity-snapshots.mjs \
            perf/scripts/evaluate-consolidated-target.py
          bun run check
          bun run build
          bunx tsc -p tsconfig.perf.json --noEmit

      - name: Capture exact materialized candidate patch
        run: |
          git diff --binary \
            b3c926b88b4861d851075015c141c67f225517fb -- src \
            > /tmp/final-temporal-renderer.patch
          test -s /tmp/final-temporal-renderer.patch

      - name: Check out frozen original renderer
        uses: actions/checkout@v4
        with:
          ref: 7f4289aa3ff640f479701ceec0b0d790af037692
          path: baseline

      - name: Install original dependencies and inject identical harness
        run: |
          cd baseline
          bun install --frozen-lockfile
          cd ..
          mkdir -p baseline/perf
          rm -rf baseline/perf/harness
          cp -R perf/harness baseline/perf/harness
          cp vite.perf.config.ts baseline/vite.perf.config.ts
          cp tsconfig.perf.json baseline/tsconfig.perf.json

      - name: Make original renderer obey the same one-frame debug protocol
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("baseline/src/runtime/use-hero-wave-renderer.ts")
          source = path.read_text(encoding="utf-8")
          request_before = '''      if (
        !running ||
        frameScheduled ||
        document.visibilityState === "hidden" ||'''
          request_after = '''      if (
        !running ||
        frameScheduled ||
        settings.paused ||
        manualPausedRef.current ||
        document.visibilityState === "hidden" ||'''
          step_before = '''      step: (seconds: number) => {
        const safeSeconds = finite(seconds, 0);'''
          step_after = '''      step: (seconds: number) => {
        if (frameScheduled) {
          cancelAnimationFrame(raf);
          frameScheduled = false;
        }
        const safeSeconds = finite(seconds, 0);'''
          if source.count(request_before) != 1:
              raise SystemExit("original requestFrame selector was not uniquely found")
          source = source.replace(request_before, request_after)
          if source.count(step_before) != 1:
              raise SystemExit("original debug.step block was not uniquely found")
          source = source.replace(step_before, step_after)
          path.write_text(source, encoding="utf-8")
          PY
          cd baseline
          bunx biome format --write src/runtime/use-hero-wave-renderer.ts
          bun run check
          cd ..

      - name: Build candidate and original harnesses
        run: |
          bunx vite build --config vite.perf.config.ts \
            --outDir "$GITHUB_WORKSPACE/perf-dist-candidate"
          cd baseline
          bunx tsc -p tsconfig.perf.json --noEmit
          bunx vite build --config vite.perf.config.ts \
            --outDir "$GITHUB_WORKSPACE/perf-dist-baseline"

      - name: Install visual comparison dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy scikit-image

      - name: Start deterministic servers
        run: |
          python -m http.server 4173 --bind 127.0.0.1 \
            --directory perf-dist-baseline >/tmp/baseline.log 2>&1 &
          echo $! >/tmp/baseline.pid
          python -m http.server 4174 --bind 127.0.0.1 \
            --directory perf-dist-candidate >/tmp/candidate.log 2>&1 &
          echo $! >/tmp/candidate.pid
          for port in 4173 4174; do
            for attempt in $(seq 1 100); do
              curl --fail --silent "http://127.0.0.1:${port}/" >/dev/null && break
              sleep 0.1
            done
            curl --fail --silent "http://127.0.0.1:${port}/" >/dev/null
          done

      - name: Run direct paired ${{ matrix.focus }} benchmark
        run: |
          bun perf/scripts/benchmark.mjs \
            --baseline http://127.0.0.1:4173 \
            --candidate http://127.0.0.1:4174 \
            --out perf-results \
            --focus ${{ matrix.focus }} \
            --repeats 4 \
            --frames 24 \
            --warmup-frames 12 \
            --profile-frames 10

      - name: Compare deterministic ${{ matrix.focus }} captures
        id: visual
        continue-on-error: true
        run: |
          python perf/scripts/visual-diff.py \
            --baseline perf-results/screenshots/baseline \
            --candidate perf-results/screenshots/candidate \
            --out perf-results/visual

      - name: Verify temporal cache activation in Hero job
        if: matrix.focus == 'hero'
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path

          report = json.loads(Path("perf-results/benchmark.json").read_text())
          ratios = []
          query_ratios = []
          rows = []
          for scenario in report.get("scenarios", []):
              baseline = scenario.get("baseline", {})
              candidate = scenario.get("candidate", {})
              bd = baseline.get("glPerFrame", {}).get("drawArraysInstanced", {}).get("median")
              cd = candidate.get("glPerFrame", {}).get("drawArraysInstanced", {}).get("median")
              bq = baseline.get("gpuSampleCount", {}).get("median")
              cq = candidate.get("gpuSampleCount", {}).get("median")
              draw_ratio = cd / bd if isinstance(cd, (int, float)) and isinstance(bd, (int, float)) and bd > 0 else None
              query_ratio = cq / bq if isinstance(cq, (int, float)) and isinstance(bq, (int, float)) and bq > 0 else None
              if draw_ratio is not None:
                  ratios.append(draw_ratio)
              if query_ratio is not None:
                  query_ratios.append(query_ratio)
              rows.append({
                  "name": scenario.get("name"),
                  "baselineInstancedDraws": bd,
                  "candidateInstancedDraws": cd,
                  "drawRatio": draw_ratio,
                  "baselineGpuQueries": bq,
                  "candidateGpuQueries": cq,
                  "queryRatio": query_ratio,
              })
          geometric = lambda values: math.exp(sum(map(math.log, values)) / len(values))
          result = {
              "drawArraysInstancedRatio": geometric(ratios) if ratios else None,
              "gpuQueryRatio": geometric(query_ratios) if query_ratios else None,
              "scenarios": rows,
          }
          Path("perf-results/temporal-activation.json").write_text(
              json.dumps(result, indent=2) + "\n"
          )
          print(json.dumps(result, indent=2))
          if len(rows) < 4 or result["drawArraysInstancedRatio"] is None:
              raise SystemExit("Incomplete Hero cache activation matrix")
          if result["drawArraysInstancedRatio"] > 0.5:
              raise SystemExit("Hero temporal cache did not reduce recurring integration draws")
          PY

      - name: Collect exact candidate and server logs
        if: always()
        run: |
          mkdir -p perf-results/candidate perf-results/server-logs
          cp /tmp/final-temporal-renderer.patch perf-results/candidate/ 2>/dev/null || true
          cp perf/materialized-final-temporal-stack.txt perf-results/candidate/ 2>/dev/null || true
          cp /tmp/baseline.log perf-results/server-logs/ 2>/dev/null || true
          cp /tmp/candidate.log perf-results/server-logs/ 2>/dev/null || true
          if [ "${{ matrix.focus }}" = "hero" ]; then
            cp -R src perf-results/candidate/materialized-src
          fi

      - name: Upload ${{ matrix.focus }} direct result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-temporal-${{ matrix.focus }}-${{ github.sha }}
          path: perf-results
          if-no-files-found: error
          retention-days: 30

      - name: Stop deterministic servers
        if: always()
        run: |
          test ! -f /tmp/baseline.pid || kill "$(cat /tmp/baseline.pid)" 2>/dev/null || true
          test ! -f /tmp/candidate.pid || kill "$(cat /tmp/candidate.pid)" 2>/dev/null || true

      - name: Enforce ${{ matrix.focus }} visual parity
        if: always() && steps.visual.outcome == 'failure'
        run: exit 1

  aggregate:
    name: direct 2x target verdict
    needs: benchmark
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out evaluation scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download Hero and CTA artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: final-temporal-*-${{ github.sha }}
          path: downloaded

      - name: Merge direct reports and captures
        run: |
          python - <<'PY'
          import json, shutil
          from pathlib import Path

          artifacts = sorted(Path("downloaded").glob("final-temporal-*"))
          if len(artifacts) != 2:
              raise SystemExit(f"Expected 2 focus artifacts, found {len(artifacts)}")
          reports = []
          out = Path("perf-results")
          (out / "screenshots" / "baseline").mkdir(parents=True, exist_ok=True)
          (out / "screenshots" / "candidate").mkdir(parents=True, exist_ok=True)
          (out / "candidate").mkdir(parents=True, exist_ok=True)
          for artifact in artifacts:
              report_path = artifact / "benchmark.json"
              if not report_path.exists():
                  raise SystemExit(f"Missing benchmark.json in {artifact}")
              reports.append(json.loads(report_path.read_text()))
              for side in ("baseline", "candidate"):
                  source = artifact / "screenshots" / side
                  if source.exists():
                      for image in source.glob("*.png"):
                          shutil.copy2(image, out / "screenshots" / side / image.name)
              source_candidate = artifact / "candidate"
              if source_candidate.exists():
                  for item in source_candidate.iterdir():
                      target = out / "candidate" / item.name
                      if item.is_dir():
                          if target.exists():
                              shutil.rmtree(target)
                          shutil.copytree(item, target)
                      else:
                          shutil.copy2(item, target)
          combined = dict(reports[0])
          combined["generatedAt"] = max(
              report.get("generatedAt", "") for report in reports
          )
          combined["scenarios"] = [
              scenario
              for report in reports
              for scenario in report.get("scenarios", [])
          ]
          combined["profiles"] = [
              profile
              for report in reports
              for profile in report.get("profiles", [])
          ]
          combined["snapshots"] = [
              snapshot
              for report in reports
              for snapshot in report.get("snapshots", [])
          ]
          (out / "benchmark.json").write_text(
              json.dumps(combined, indent=2) + "\n"
          )
          PY

      - name: Install visual comparison dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy scikit-image

      - name: Re-run combined visual gate
        id: visual
        continue-on-error: true
        run: |
          python perf/scripts/visual-diff.py \
            --baseline perf-results/screenshots/baseline \
            --candidate perf-results/screenshots/candidate \
            --out perf-results/visual

      - name: Evaluate direct 2x FPS and half-GPU target
        id: target
        continue-on-error: true
        run: |
          python perf/scripts/evaluate-consolidated-target.py \
            --input perf-results/benchmark.json \
            --output perf-results/final-temporal-target.json \
            --markdown perf-results/final-temporal-target.md \
            --target-ratio 0.5 \
            --maximum-regression 0.02 \
            --minimum-scenarios 8 \
            --minimum-gpu-scenarios 8

      - name: Publish final temporal summary
        if: always()
        run: |
          test ! -f perf-results/final-temporal-target.md || cat perf-results/final-temporal-target.md >> "$GITHUB_STEP_SUMMARY"
          if [ -f perf-results/visual/visual-diff.md ]; then
            printf '\n' >> "$GITHUB_STEP_SUMMARY"
            cat perf-results/visual/visual-diff.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload combined exact result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-temporal-combined-${{ github.sha }}
          path: perf-results
          if-no-files-found: error
          retention-days: 30

      - name: Enforce complete benchmark jobs
        if: always() && needs.benchmark.result != 'success'
        run: exit 1

      - name: Enforce combined visual parity
        if: always() && steps.visual.outcome == 'failure'
        run: exit 1

      - name: Enforce direct 2x target
        if: always() && steps.target.outcome == 'failure'
        run: exit 1
