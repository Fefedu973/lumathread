name: Incremental optical cache over q4 support

on:
  push:
    branches:
      - perf/major-2x-optical-incremental
  pull_request:
    branches:
      - perf/major-2x-single-frame-matrix
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: optical-incremental-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Check out incremental experiment
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install candidate dependencies
        run: bun install --frozen-lockfile

      - name: Fetch exact support and optical experiments
        run: |
          git fetch origin \
            perf/major-2x-local-support-bounds:refs/remotes/origin/perf/major-2x-local-support-bounds \
            perf/major-2x-optical-cache:refs/remotes/origin/perf/major-2x-optical-cache
          git show \
            origin/perf/major-2x-local-support-bounds:perf/scripts/apply-benchmark-reliability-fixes.mjs \
            > /tmp/apply-benchmark-reliability-fixes.mjs
          git show \
            origin/perf/major-2x-local-support-bounds:perf/scripts/apply-single-frame-paired-harness-fix.mjs \
            > /tmp/apply-single-frame-paired-harness-fix.mjs
          git show \
            origin/perf/major-2x-local-support-bounds:perf/experiments/local-support-bounds.patch \
            > /tmp/local-support-bounds.patch
          git show \
            origin/perf/major-2x-optical-cache:perf/experiments/optical-field-cache.patch.gz.b64 \
            > /tmp/optical-field-cache.patch.gz.b64
          cat perf/experiments/major-2x-specializations.patch.gz.b64.* \
            | tr -d "\n" \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/major.patch
          tr -d "\n" < /tmp/optical-field-cache.patch.gz.b64 \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/optical-field-cache.patch

      - name: Apply q4 support plus optical cache to candidate
        run: |
          git apply --whitespace=nowarn /tmp/major.patch
          python - <<'PY'
          from pathlib import Path
          path = Path("src/runtime/path-renderer.ts")
          source = path.read_text(encoding="utf-8")
          old = "useSourceInstancedQuadrature"
          new = "shouldUseSourceInstancedQuadrature"
          if source.count(old) != 2:
              raise SystemExit("unexpected source-instanced helper count")
          source = source.replace(old, new)
          threshold = "settings.headTaper <= 0.000001"
          if source.count(threshold) != 1:
              raise SystemExit("unexpected normalized taper threshold count")
          source = source.replace(threshold, "settings.headTaper <= 0.001001")
          path.write_text(source, encoding="utf-8")
          PY
          git apply --whitespace=nowarn /tmp/local-support-bounds.patch
          git apply --whitespace=nowarn /tmp/optical-field-cache.patch
          node /tmp/apply-benchmark-reliability-fixes.mjs
          node /tmp/apply-single-frame-paired-harness-fix.mjs

      - name: Format and validate candidate
        run: |
          bunx biome format --write \
            src/rendering/profile-textures.ts \
            src/rendering/shaders.ts \
            src/rendering/webgl-resources.ts \
            src/runtime/path-renderer.ts \
            src/runtime/use-hero-wave-renderer.ts \
            src/runtime/glass-terrain-renderer.ts \
            src/runtime/resource-manager.ts \
            src/runtime/draw-common.ts \
            perf/harness/gl-profiler.js \
            perf/scripts/benchmark-core.mjs \
            perf/scripts/benchmark-suite.mjs \
            perf/scripts/benchmark.mjs
          bun run check
          bun run build
          bunx tsc -p tsconfig.perf.json --noEmit

      - name: Check out exact current source baseline
        uses: actions/checkout@v4
        with:
          ref: b3c926b88b4861d851075015c141c67f225517fb
          path: baseline

      - name: Install baseline dependencies
        working-directory: baseline
        run: bun install --frozen-lockfile

      - name: Apply q4 support only to incremental baseline
        run: |
          git -C baseline apply --whitespace=nowarn /tmp/major.patch
          python - <<'PY'
          from pathlib import Path
          path = Path("baseline/src/runtime/path-renderer.ts")
          source = path.read_text(encoding="utf-8")
          old = "useSourceInstancedQuadrature"
          new = "shouldUseSourceInstancedQuadrature"
          if source.count(old) != 2:
              raise SystemExit("unexpected baseline source-instanced helper count")
          source = source.replace(old, new)
          threshold = "settings.headTaper <= 0.000001"
          if source.count(threshold) != 1:
              raise SystemExit("unexpected baseline taper threshold count")
          source = source.replace(threshold, "settings.headTaper <= 0.001001")
          path.write_text(source, encoding="utf-8")
          PY
          git -C baseline apply --whitespace=nowarn /tmp/local-support-bounds.patch
          node /tmp/apply-single-frame-paired-harness-fix.mjs baseline

      - name: Inject identical harness into incremental baseline
        run: |
          rm -rf baseline/perf/harness
          cp -R perf/harness baseline/perf/harness
          cp vite.perf.config.ts baseline/vite.perf.config.ts
          cp tsconfig.perf.json baseline/tsconfig.perf.json

      - name: Format and validate baseline renderer
        working-directory: baseline
        run: |
          bunx biome format --write \
            src/rendering/profile-textures.ts \
            src/rendering/shaders.ts \
            src/rendering/webgl-resources.ts \
            src/runtime/path-renderer.ts \
            src/runtime/use-hero-wave-renderer.ts \
            src/runtime/glass-terrain-renderer.ts \
            src/runtime/resource-manager.ts \
            src/runtime/draw-common.ts
          bun run check
          bun run build
          bunx tsc -p tsconfig.perf.json --noEmit

      - name: Build incremental baseline and candidate harnesses
        run: |
          bunx vite build --config vite.perf.config.ts \
            --outDir "$GITHUB_WORKSPACE/perf-dist-candidate"
          cd baseline
          bunx vite build --config vite.perf.config.ts \
            --outDir "$GITHUB_WORKSPACE/perf-dist-baseline"

      - name: Install visual diff dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy scikit-image

      - name: Start deterministic servers
        run: |
          python -m http.server 4173 --bind 127.0.0.1 \
            --directory perf-dist-baseline >/tmp/baseline.log 2>&1 &
          echo $! >/tmp/baseline.pid
          python -m http.server 4174 --bind 127.0.0.1 \
            --directory perf-dist-candidate >/tmp/candidate.log 2>&1 &
          echo $! >/tmp/candidate.pid
          for port in 4173 4174; do
            for attempt in $(seq 1 80); do
              curl --fail --silent "http://127.0.0.1:${port}/" >/dev/null && break
              sleep 0.1
            done
            curl --fail --silent "http://127.0.0.1:${port}/" >/dev/null
          done

      - name: Run incremental paired CTA benchmark
        run: |
          bun perf/scripts/benchmark.mjs \
            --baseline http://127.0.0.1:4173 \
            --candidate http://127.0.0.1:4174 \
            --out perf-results \
            --focus cta \
            --repeats 2 \
            --frames 8 \
            --warmup-frames 5 \
            --profile-frames 5

      - name: Prove exactly one full renderer frame per sample
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("perf-results/benchmark.json").read_text())
          failures = []
          checks = 0
          for scenario in report.get("scenarios", []):
              name = scenario.get("name", "unknown")
              for build in ("baseline", "candidate"):
                  for index, run in enumerate(scenario.get("raw", {}).get(build, [])):
                      stages = run.get("gpu", {}).get("byStage", {})
                      for stage in ("path-composite", "glass-composite"):
                          value = stages.get(stage, {}).get("countPerFrame")
                          checks += 1
                          if value is None or abs(value - 1) > 1e-9:
                              failures.append(
                                  f"{name}/{build}/{index}/{stage}: expected 1, got {value}"
                              )
                      finish = run.get("glPerFrame", {}).get("finish")
                      if finish is None or abs(finish - 1) > 1e-9:
                          failures.append(
                              f"{name}/{build}/{index}/finish: expected 1, got {finish}"
                          )
          Path("perf-results/single-frame-validation.json").write_text(
              json.dumps({"passed": not failures, "checks": checks, "failures": failures}, indent=2) + "\n"
          )
          if failures:
              raise SystemExit("\n".join(failures))
          print(f"Validated {checks} full-frame stage counters.")
          PY

      - name: Compare optical cache against q4-support output
        id: visual
        continue-on-error: true
        run: |
          python perf/scripts/visual-diff.py \
            --baseline perf-results/screenshots/baseline \
            --candidate perf-results/screenshots/candidate \
            --out perf-results/visual

      - name: Write incremental ratio summary
        if: always()
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          path = Path("perf-results/benchmark.json")
          if not path.exists():
              raise SystemExit(0)
          report = json.loads(path.read_text())
          rows = []
          wall = []
          gpu = []
          for scenario in report.get("scenarios", []):
              comparison = scenario.get("comparison", {})
              wr = comparison.get("pairedWallRatio")
              gr = comparison.get("pairedGpuRatio")
              if isinstance(wr, (int, float)) and wr > 0:
                  wall.append(wr)
              if isinstance(gr, (int, float)) and gr > 0:
                  gpu.append(gr)
              rows.append({"name": scenario.get("name"), "wallRatio": wr, "gpuRatio": gr})
          geometric = lambda values: math.exp(sum(map(math.log, values)) / len(values)) if values else None
          output = {
              "wallRatio": geometric(wall),
              "gpuRatio": geometric(gpu),
              "estimatedOriginalGpuRatio": geometric(gpu) * 0.5289345 if gpu else None,
              "scenarios": rows,
          }
          Path("perf-results/incremental-evaluation.json").write_text(json.dumps(output, indent=2) + "\n")
          lines = [
              "# Incremental optical-cache evaluation",
              "",
              f"- Wall ratio vs q4-support: {output['wallRatio']}",
              f"- GPU ratio vs q4-support: {output['gpuRatio']}",
              f"- Estimated GPU ratio vs original: {output['estimatedOriginalGpuRatio']}",
              "",
          ]
          Path("perf-results/incremental-evaluation.md").write_text("\n".join(lines))
          print("\n".join(lines))
          PY

      - name: Publish summary
        if: always()
        run: |
          test ! -f perf-results/benchmark.md || cat perf-results/benchmark.md >> "$GITHUB_STEP_SUMMARY"
          test ! -f perf-results/incremental-evaluation.md || cat perf-results/incremental-evaluation.md >> "$GITHUB_STEP_SUMMARY"
          test ! -f perf-results/visual/visual-diff.md || cat perf-results/visual/visual-diff.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exact candidate and incremental measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optical-incremental-${{ github.sha }}
          path: |
            perf-results
            src
            baseline/src
          if-no-files-found: error
          retention-days: 30

      - name: Stop servers
        if: always()
        run: |
          test ! -f /tmp/baseline.pid || kill "$(cat /tmp/baseline.pid)" 2>/dev/null || true
          test ! -f /tmp/candidate.pid || kill "$(cat /tmp/candidate.pid)" 2>/dev/null || true

      - name: Enforce visual parity
        if: always() && steps.visual.outcome == 'failure'
        run: exit 1
