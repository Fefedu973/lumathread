name: One-shot format all perf MJS

on:
  push:
    branches:
      - perf/visual-parity-renderer-optimization
    paths:
      - .github/workflows/one-shot-format-all-perf-mjs.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out optimization branch
        uses: actions/checkout@v4
        with:
          ref: perf/visual-parity-renderer-optimization
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format perf scripts and remove this workflow
        run: |
          bunx biome format --write "perf/scripts/**/*.mjs"
          rm .github/workflows/one-shot-format-all-perf-mjs.yml

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add perf/scripts .github/workflows/one-shot-format-all-perf-mjs.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format performance harness scripts"
          git push origin HEAD:perf/visual-parity-renderer-optimization
