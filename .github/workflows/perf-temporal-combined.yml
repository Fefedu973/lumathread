name: Hero temporal combined-anchor discovery

on:
  push:
    branches: [perf/major-2x-temporal-combined-anchors]
  pull_request:
    branches: [perf/major-2x-final-temporal]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporal-combined-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bun install --frozen-lockfile

      - name: Materialize selected 15 Hz stack
        run: |
          bash perf/scripts/materialize-final-temporal-stack.sh
          node perf/scripts/add-temporal-parity-snapshots.mjs
          bunx biome format --write src perf/scripts/benchmark.mjs perf/scripts/benchmark-suite.mjs
          git diff --binary b3c926b88b4861d851075015c141c67f225517fb -- src > /tmp/baseline.patch
          test -s /tmp/baseline.patch

      - name: Apply sanitized combined-anchor transform
        run: |
          tr -d '\r\n\t ' < perf/experiments/apply-temporal-combined.py.gz.b64 \
            | base64 --decode | gzip --decompress > /tmp/apply.py
          python - <<'PY'
          from pathlib import Path
          p = Path('/tmp/apply.py')
          s = p.read_text()
          old = 'resources.temporalSettingsReference !== root ||'
          new = 'resources.temporalSettingsKey !== settingsKey ||'
          if old in s:
              s = s.replace(old, new)
          elif new not in s:
              raise SystemExit('temporal settings marker missing')
          p.write_text(s)
          PY
          python /tmp/apply.py
          grep -Fq precombineTemporalPathBank src/runtime/path-renderer.ts
          grep -Fq temporalCombinedWaveTexture src/rendering/webgl-resources.ts
          bunx biome format --write src
          bun run check
          bun run build
          bunx tsc -p tsconfig.perf.json --noEmit

      - uses: actions/checkout@v4
        with:
          ref: b3c926b88b4861d851075015c141c67f225517fb
          path: baseline
      - name: Materialize identical baseline
        run: |
          cd baseline
          bun install --frozen-lockfile
          git apply --whitespace=nowarn /tmp/baseline.patch
          bunx biome format --write src
          bun run check
          bun run build
          cd ..
          mkdir -p baseline/perf
          rm -rf baseline/perf/harness baseline/perf/scripts
          cp -R perf/harness baseline/perf/harness
          cp -R perf/scripts baseline/perf/scripts
          cp vite.perf.config.ts baseline/vite.perf.config.ts
          cp tsconfig.perf.json baseline/tsconfig.perf.json

      - name: Build harnesses
        run: |
          bunx vite build --config vite.perf.config.ts --outDir "$GITHUB_WORKSPACE/candidate-dist"
          cd baseline
          bunx tsc -p tsconfig.perf.json --noEmit
          bunx vite build --config vite.perf.config.ts --outDir "$GITHUB_WORKSPACE/baseline-dist"

      - run: python -m pip install --disable-pip-version-check pillow numpy scikit-image
      - name: Start servers
        run: |
          python -m http.server 4173 --bind 127.0.0.1 --directory baseline-dist >/tmp/b.log 2>&1 & echo $! >/tmp/b.pid
          python -m http.server 4174 --bind 127.0.0.1 --directory candidate-dist >/tmp/c.log 2>&1 & echo $! >/tmp/c.pid
          for port in 4173 4174; do
            for i in $(seq 1 100); do curl -fsS "http://127.0.0.1:${port}/" >/dev/null && break; sleep .1; done
            curl -fsS "http://127.0.0.1:${port}/" >/dev/null
          done

      - name: Benchmark Hero
        run: |
          bun perf/scripts/benchmark.mjs \
            --baseline http://127.0.0.1:4173 --candidate http://127.0.0.1:4174 \
            --out perf-results --focus hero --repeats 1 --frames 6 \
            --warmup-frames 4 --profile-frames 4

      - name: Compare captures
        id: visual
        continue-on-error: true
        run: |
          python perf/scripts/visual-diff.py \
            --baseline perf-results/screenshots/baseline \
            --candidate perf-results/screenshots/candidate \
            --out perf-results/visual

      - name: Summarize ratios
        if: always()
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          p = Path('perf-results/benchmark.json')
          if not p.exists(): raise SystemExit(0)
          r = json.loads(p.read_text())
          rows=[]
          for s in r.get('scenarios',[]):
              q=s.get('paired',{})
              rows.append({'name':s.get('name'),
                'wall':q.get('wallMeanMs',{}).get('geometricMeanRatio'),
                'gpu':q.get('gpuTotalFrameMs',{}).get('geometricMeanRatio')})
          geo=lambda k: math.exp(sum(math.log(x[k]) for x in rows if x[k] and x[k]>0)/len([x for x in rows if x[k] and x[k]>0]))
          out={'wallRatio':geo('wall'),'gpuRatio':geo('gpu'),'scenarios':rows}
          Path('perf-results/temporal-combined-evaluation.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY
          test ! -f perf-results/visual/visual-diff.md || cat perf-results/visual/visual-diff.md >> "$GITHUB_STEP_SUMMARY"
          test ! -f perf-results/temporal-combined-evaluation.json || cat perf-results/temporal-combined-evaluation.json >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: temporal-combined-discovery-${{ github.sha }}
          path: |
            perf-results
            src
            baseline/src
          if-no-files-found: error
          retention-days: 30

      - if: always()
        run: |
          test ! -f /tmp/b.pid || kill "$(cat /tmp/b.pid)" 2>/dev/null || true
          test ! -f /tmp/c.pid || kill "$(cat /tmp/c.pid)" 2>/dev/null || true
      - if: always() && steps.visual.outcome == 'failure'
        run: exit 1
