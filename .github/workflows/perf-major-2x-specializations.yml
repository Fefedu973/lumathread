name: Major optical-cache candidate parked

on:
  pull_request:
    branches:
      - perf/major-2x-specializations
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: major-2x-optical-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  parked:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Full optical-cache confirmation parked while the fast CTA matrix selects the winning candidate."
