name: Major 2x renderer candidate parked

on:
  pull_request:
    branches:
      - perf/visual-parity-renderer-optimization
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: major-2x-renderer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  parked:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Full confirmation parked while the fast CTA matrix selects the winning candidate."
