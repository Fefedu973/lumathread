name: Major optical-plus-blur candidate parked

on:
  pull_request:
    branches:
      - perf/major-2x-optical-cache
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: major-2x-optical-blur-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  parked:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Full combined confirmation parked while the fast CTA matrix selects the winning candidate."
