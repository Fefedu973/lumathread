name: Major 2x renderer specializations

on:
  push:
    branches:
      - perf/major-2x-specializations
  pull_request:
    branches:
      - perf/visual-parity-renderer-optimization
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: major-2x-renderer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out specialized candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install candidate dependencies
        run: bun install --frozen-lockfile

      - name: Apply major specialized renderer candidate
        run: |
          cat perf/experiments/major-2x-specializations.patch.gz.b64.* \
            | tr -d "\n" \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/major-2x-specializations.patch
          git apply --whitespace=nowarn \
            /tmp/major-2x-specializations.patch
          python - <<'PY'
          from pathlib import Path
          path = Path("src/runtime/path-renderer.ts")
          source = path.read_text(encoding="utf-8")
          old = "useSourceInstancedQuadrature"
          new = "shouldUseSourceInstancedQuadrature"
          count = source.count(old)
          if count != 2:
              raise SystemExit(f"expected exactly 2 helper occurrences, found {count}")
          path.write_text(source.replace(old, new), encoding="utf-8")
          PY

      - name: Format and validate specialized renderer
        run: |
          bunx biome format --write \
            src/rendering/shaders.ts \
            src/rendering/webgl-resources.ts \
            src/runtime/resource-manager.ts \
            src/runtime/glass-terrain-renderer.ts \
            src/runtime/path-renderer.ts \
            src/runtime/draw-common.ts \
            perf/scripts/benchmark-core.mjs \
            perf/scripts/benchmark-suite.mjs \
            perf/scripts/benchmark.mjs \
            perf/scripts/evaluate-major-target.mjs
          bun run check
          bun run build
          bunx tsc -p tsconfig.perf.json --noEmit

      - name: Check out exact current renderer baseline
        uses: actions/checkout@v4
        with:
          ref: b3c926b88b4861d851075015c141c67f225517fb
          path: baseline

      - name: Install baseline dependencies
        working-directory: baseline
        run: bun install --frozen-lockfile

      - name: Inject identical measurement harness into baseline
        run: |
          rm -rf baseline/perf/harness
          cp -R perf/harness baseline/perf/harness
          cp vite.perf.config.ts baseline/vite.perf.config.ts
          cp tsconfig.perf.json baseline/tsconfig.perf.json

      - name: Build baseline and candidate harnesses
        run: |
          bunx vite build \
            --config vite.perf.config.ts \
            --outDir "$GITHUB_WORKSPACE/perf-dist-candidate"
          cd baseline
          bunx tsc -p tsconfig.perf.json --noEmit
          bunx vite build \
            --config vite.perf.config.ts \
            --outDir "$GITHUB_WORKSPACE/perf-dist-baseline"

      - name: Install visual diff dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy scikit-image

      - name: Start deterministic static servers
        run: |
          python -m http.server 4173 \
            --bind 127.0.0.1 \
            --directory perf-dist-baseline > /tmp/lumathread-baseline-server.log 2>&1 &
          echo $! > /tmp/lumathread-baseline-server.pid
          python -m http.server 4174 \
            --bind 127.0.0.1 \
            --directory perf-dist-candidate > /tmp/lumathread-candidate-server.log 2>&1 &
          echo $! > /tmp/lumathread-candidate-server.pid
          for port in 4173 4174; do
            for attempt in $(seq 1 80); do
              if curl --fail --silent "http://127.0.0.1:${port}/" >/dev/null; then
                break
              fi
              sleep 0.1
            done
            curl --fail --silent "http://127.0.0.1:${port}/" >/dev/null
          done

      - name: Run full paired renderer benchmark
        run: |
          bun perf/scripts/benchmark.mjs \
            --baseline http://127.0.0.1:4173 \
            --candidate http://127.0.0.1:4174 \
            --out perf-results \
            --repeats 5 \
            --frames 36 \
            --warmup-frames 20 \
            --profile-frames 10

      - name: Compare deterministic screenshots
        id: visual
        continue-on-error: true
        run: |
          python perf/scripts/visual-diff.py \
            --baseline perf-results/screenshots/baseline \
            --candidate perf-results/screenshots/candidate \
            --out perf-results/visual

      - name: Evaluate 2x FPS and half-GPU target
        if: always()
        run: |
          if [ -f perf-results/benchmark.json ]; then
            node perf/scripts/evaluate-major-target.mjs \
              --input perf-results/benchmark.json \
              --output perf-results/major-target-evaluation.json \
              --markdown perf-results/major-target-evaluation.md \
              --target-ratio 0.5 \
              --maximum-regression 0.02
          fi

      - name: Publish benchmark summary
        if: always()
        run: |
          test ! -f perf-results/benchmark.md || cat perf-results/benchmark.md >> "$GITHUB_STEP_SUMMARY"
          if [ -f perf-results/major-target-evaluation.md ]; then
            printf '\n' >> "$GITHUB_STEP_SUMMARY"
            cat perf-results/major-target-evaluation.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f perf-results/visual/visual-diff.md ]; then
            printf '\n' >> "$GITHUB_STEP_SUMMARY"
            cat perf-results/visual/visual-diff.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Collect server logs
        if: always()
        run: |
          mkdir -p perf-results/server-logs
          cp /tmp/lumathread-baseline-server.log perf-results/server-logs/ 2>/dev/null || true
          cp /tmp/lumathread-candidate-server.log perf-results/server-logs/ 2>/dev/null || true

      - name: Upload measurements, diffs and exact candidate source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: major-2x-specializations-${{ github.sha }}
          path: |
            perf-results
            src
            perf/scripts/benchmark-core.mjs
            perf/scripts/benchmark-suite.mjs
            perf/scripts/benchmark.mjs
            perf/scripts/evaluate-major-target.mjs
          if-no-files-found: error
          retention-days: 30

      - name: Stop static servers
        if: always()
        run: |
          for pidfile in \
            /tmp/lumathread-baseline-server.pid \
            /tmp/lumathread-candidate-server.pid; do
            if [ -f "$pidfile" ]; then
              kill "$(cat "$pidfile")" 2>/dev/null || true
            fi
          done

      - name: Enforce visual parity gate
        if: always() && steps.visual.outcome == 'failure'
        run: exit 1
