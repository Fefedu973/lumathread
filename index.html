<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#030607" />
    <meta
      name="description"
      content="LumaThread — a composable WebGL luminous filament renderer for React."
    />
    <title>LumaThread — Luminous WebGL filaments for React</title>
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("lumathread-theme");
          const dark =
            stored === "dark" ||
            ((stored === null || stored === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/site/main.tsx"></script>
  </body>
</html>
