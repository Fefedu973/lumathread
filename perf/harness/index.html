<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumathread performance harness</title>
    <script>
      (() => {
        const blankCounters = () => ({
          drawArrays: 0,
          drawArraysInstanced: 0,
          drawElements: 0,
          drawElementsInstanced: 0,
          instances: 0,
          vertices: 0,
          points: 0,
          triangles: 0,
          bufferData: 0,
          bufferSubData: 0,
          bufferBytes: 0,
          textureUploads: 0,
          textureUploadPixels: 0,
          createTexture: 0,
          deleteTexture: 0,
          createFramebuffer: 0,
          deleteFramebuffer: 0,
          createProgram: 0,
          deleteProgram: 0,
          useProgram: 0,
          framebufferTexture2D: 0,
          scissor: 0,
          scissorPixels: 0,
          blitFramebuffer: 0,
          blitPixels: 0,
          clear: 0,
          finish: 0,
          flush: 0,
        });
        const stats = {
          contexts: 0,
          webgl2Contexts: 0,
          counters: blankCounters(),
          errors: [],
        };
        const contexts = [];
        const increment = (name, value = 1) => {
          stats.counters[name] = (stats.counters[name] || 0) + value;
        };
        const typedArrayBytes = (value) => {
          if (ArrayBuffer.isView(value)) return value.byteLength;
          if (value instanceof ArrayBuffer) return value.byteLength;
          return 0;
        };
        const texturePixels = (args) => {
          if (typeof args[3] === "number" && typeof args[4] === "number") {
            return Math.max(0, args[3]) * Math.max(0, args[4]);
          }
          const source = args[5] ?? args[6] ?? args[8];
          const width = Number(
            source?.videoWidth ?? source?.naturalWidth ?? source?.width ?? 0,
          );
          const height = Number(
            source?.videoHeight ?? source?.naturalHeight ?? source?.height ?? 0,
          );
          return Math.max(0, width) * Math.max(0, height);
        };
        const originalGetContext = HTMLCanvasElement.prototype.getContext;
        HTMLCanvasElement.prototype.getContext = function instrumentedGetContext(
          type,
          ...args
        ) {
          const context = originalGetContext.call(this, type, ...args);
          if (
            !context ||
            (type !== "webgl" &&
              type !== "experimental-webgl" &&
              type !== "webgl2") ||
            context.__lumathreadInstrumented
          ) {
            return context;
          }
          try {
            Object.defineProperty(context, "__lumathreadInstrumented", {
              value: true,
            });
          } catch {
            return context;
          }
          stats.contexts += 1;
          if (type === "webgl2") stats.webgl2Contexts += 1;
          contexts.push(context);

          const wrap = (name, before) => {
            const original = context[name];
            if (typeof original !== "function") return;
            try {
              context[name] = function instrumentedWebGlCall(...callArgs) {
                try {
                  before?.(callArgs);
                } catch (error) {
                  stats.errors.push(`${name}: ${String(error)}`);
                }
                return original.apply(context, callArgs);
              };
            } catch (error) {
              stats.errors.push(`wrap ${name}: ${String(error)}`);
            }
          };

          wrap("drawArrays", (callArgs) => {
            increment("drawArrays");
            const mode = callArgs[0];
            const count = Math.max(0, Number(callArgs[2]) || 0);
            increment("vertices", count);
            if (mode === context.POINTS) increment("points", count);
            if (mode === context.TRIANGLES) increment("triangles", count / 3);
          });
          wrap("drawArraysInstanced", (callArgs) => {
            increment("drawArraysInstanced");
            const mode = callArgs[0];
            const count = Math.max(0, Number(callArgs[2]) || 0);
            const instances = Math.max(0, Number(callArgs[3]) || 0);
            increment("instances", instances);
            increment("vertices", count * instances);
            if (mode === context.POINTS) increment("points", count * instances);
            if (mode === context.TRIANGLES) {
              increment("triangles", (count * instances) / 3);
            }
          });
          wrap("drawElements", (callArgs) => {
            increment("drawElements");
            const mode = callArgs[0];
            const count = Math.max(0, Number(callArgs[1]) || 0);
            increment("vertices", count);
            if (mode === context.POINTS) increment("points", count);
            if (mode === context.TRIANGLES) increment("triangles", count / 3);
          });
          wrap("drawElementsInstanced", (callArgs) => {
            increment("drawElementsInstanced");
            const mode = callArgs[0];
            const count = Math.max(0, Number(callArgs[1]) || 0);
            const instances = Math.max(0, Number(callArgs[4]) || 0);
            increment("instances", instances);
            increment("vertices", count * instances);
            if (mode === context.POINTS) increment("points", count * instances);
            if (mode === context.TRIANGLES) {
              increment("triangles", (count * instances) / 3);
            }
          });
          wrap("bufferData", (callArgs) => {
            increment("bufferData");
            const value = callArgs[1];
            increment(
              "bufferBytes",
              typeof value === "number"
                ? Math.max(0, value)
                : typedArrayBytes(value),
            );
          });
          wrap("bufferSubData", (callArgs) => {
            increment("bufferSubData");
            increment("bufferBytes", typedArrayBytes(callArgs[2]));
          });
          for (const name of ["texImage2D", "texSubImage2D"]) {
            wrap(name, (callArgs) => {
              increment("textureUploads");
              increment("textureUploadPixels", texturePixels(callArgs));
            });
          }
          wrap("scissor", (callArgs) => {
            increment("scissor");
            increment(
              "scissorPixels",
              Math.max(0, Number(callArgs[2]) || 0) *
                Math.max(0, Number(callArgs[3]) || 0),
            );
          });
          wrap("blitFramebuffer", (callArgs) => {
            increment("blitFramebuffer");
            increment(
              "blitPixels",
              Math.abs((Number(callArgs[6]) || 0) - (Number(callArgs[4]) || 0)) *
                Math.abs((Number(callArgs[7]) || 0) - (Number(callArgs[5]) || 0)),
            );
          });
          for (const name of [
            "createTexture",
            "deleteTexture",
            "createFramebuffer",
            "deleteFramebuffer",
            "createProgram",
            "deleteProgram",
            "useProgram",
            "framebufferTexture2D",
            "clear",
            "finish",
            "flush",
          ]) {
            wrap(name, () => increment(name));
          }
          return context;
        };

        window.__LUMATHREAD_GL_STATS__ = stats;
        window.__LUMATHREAD_GL_CONTEXTS__ = contexts;
        window.__LUMATHREAD_RESET_GL_STATS__ = () => {
          stats.counters = blankCounters();
          stats.errors.length = 0;
        };
      })();
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        background: #020304;
      }
      * {
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
